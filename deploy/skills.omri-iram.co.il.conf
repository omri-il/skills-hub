# skills.omri-iram.co.il: a static site built from github.com/omri-il/skills-hub.
# Files live in /var/www/skills, copied there by /root/Projects/skills-hub/deploy/update.sh.
server {
    listen 80;
    listen [::]:80;
    server_name skills.omri-iram.co.il;

    location /.well-known/acme-challenge/ { root /var/www/skills; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skills.omri-iram.co.il;

    ssl_certificate /etc/letsencrypt/live/skills.omri-iram.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skills.omri-iram.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/skills;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Sign-up (since 2026-11-11). The page POSTs here; listmonk-selfservice (:5042) forwards
    # it to the business Listmonk's own /subscription/form (lists 106, 107). The Altcha
    # captcha's challenge and script come from that Listmonk, through this server, so the
    # page stays same-origin. The CSP above allows what the widget needs: its inline <style>
    # (in its shadow root) and a blob: worker. connect-src 'self' is for the fetch.
    location = /signup {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5042/skills/signup;
        proxy_set_header Host listmonk.omri-iram.co.il;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }
    location = /api/public/captcha/altcha {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host listmonk.omri-iram.co.il;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    location = /public/static/altcha.umd.js {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host listmonk.omri-iram.co.il;
    }
    location /downloads/ {
        types { application/zip zip; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
