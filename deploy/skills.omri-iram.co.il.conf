# skills.omri-iram.co.il: a static site built from github.com/omri-il/skills-hub.
# Files live in /var/www/skills, copied there by /root/Projects/skills-hub/deploy/update.sh.
server {
    listen 80;
    listen [::]:80;
    server_name skills.omri-iram.co.il;

    location /.well-known/acme-challenge/ { root /var/www/skills; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skills.omri-iram.co.il;

    ssl_certificate /etc/letsencrypt/live/skills.omri-iram.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skills.omri-iram.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/skills;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /downloads/ {
        types { application/zip zip; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
