# skills.omri-iram.co.il: a static site built from github.com/omri-il/skills-hub.
# Files live in /var/www/skills, copied there by /root/Projects/skills-hub/deploy/update.sh.

# The site's own log (2026-11-19), read by the admin screen's numbers page (admin/stats.js).
# One JSON line per request. a = 1 when the visitor is Omri (admin cookie), so his visits are left out.
# Kept 90 days by deploy/skills-hub.logrotate (/etc/logrotate.d/skills-hub). Nothing runs in the browser for this.
log_format skills_json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$request_uri","s":$status,"r":"$http_referer","ua":"$http_user_agent","a":"$cookie_skills_admin_seen"}';

server {
    listen 80;
    listen [::]:80;
    server_name skills.omri-iram.co.il;

    location /.well-known/acme-challenge/ { root /var/www/skills; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skills.omri-iram.co.il;

    ssl_certificate /etc/letsencrypt/live/skills.omri-iram.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skills.omri-iram.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/skills;
    index index.html;
    error_page 404 /404.html;
    access_log /var/log/nginx/skills/access.log skills_json;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Sign-up (since 2026-11-11). The page POSTs here; listmonk-selfservice (:5042) forwards
    # it to the business Listmonk's own /subscription/form (lists 106, 107). The Altcha
    # captcha's challenge and script come from that Listmonk, through this server, so the
    # page stays same-origin. The CSP above allows what the widget needs: its inline <style>
    # (in its shadow root) and a blob: worker. connect-src 'self' is for the fetch.
    location = /signup {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5042/skills/signup;
        proxy_set_header Host listmonk.omri-iram.co.il;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }
    location = /api/public/captcha/altcha {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host listmonk.omri-iram.co.il;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    location = /public/static/altcha.umd.js {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host listmonk.omri-iram.co.il;
    }
    location /downloads/ {
        types { application/zip zip; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # The install tutorial video and its poster (video.yaml, 2026-11-13). Outside /var/www/skills,
    # so the 5-minute rsync --delete never touches them; copied there by hand (the repo is public
    # and a video is large, so it is not in git). CSP default-src 'self' already allows media from here.
    location /media/ {
        alias /var/www/skills-media/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # The admin screen (2026-11-17): admin/server.js, skills-hub-admin.service on :5047, one password.
    # It sends its own CSP (form-action 'self'); the add_header here stops the site's CSP from applying.
    location ~ ^/admin(/|$) {
        proxy_pass http://127.0.0.1:5047;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
        add_header X-Robots-Tag "noindex" always;
    }
}
