name: grade-student-work
title: בדיקת עבודות ומשוב לתלמידים
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שבודק עבודות, מטלות, חיבורים או עבודות חקר
problem: 'בדיקת עבודות ומבחנים היא אחד משלושת מקורות הלחץ הגדולים של מורים בישראל (TALIS 2024). כשמבקשים מבינה מלאכותית משוב לכיתה, מקבלים טקסט שמתאים לכל תלמיד באותה מידה, חמש נקודות לשיפור שאף אחד לא יתקן, וציון שנגזר מהתרשמות ולא מהמחוון.

  '
what_it_does: 'בודק כל עבודה לפי מחוון, קריטריון-קריטריון, עם ציטוט מהעבודה לכל דירוג. מחזיר לכל תלמיד משוב קצר בשלושה חלקים — מה עבד בדיוק, דבר אחד לשיפור וצעד מעשי אחד — ואחריו טבלת ציונים למורה ותמונת מצב כיתתית. אם אין מחוון, בונה אחד ועוצר לאישור. לא כותב שמות תלמידים בתוצר, ולא מאשים בהעתקה בתוך משוב לתלמיד.

  '
output: קובץ Word עם משוב בעמוד לכל תלמיד, טבלת ציונים ותמונת מצב כיתתית
requires:
- build-rubric
- hebrew-docs-rtl
role: main
tested:
- טרם נבדק בג'מיני. הסקיל נכתב ב-2026-11-11 וממתין לבדיקה של מורה
limitations:
- טרם נבדק על צילומי מחברות בכתב יד
- לא נבדק על כמות גדולה של עבודות בבת אחת, וייתכן שג'מיני יקצר את המשובים האחרונים
