name: hebrew-docs-rtl
title: מסמכים בעברית ל-Docs בלי טקסט הפוך
version: 1.3.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים שמעבירים טקסט מג'מיני ל-Docs או ל-Word
problem: 'מסמך בעברית יוצא שבור ב-Docs: פסקאות לשמאל, טבלאות הפוכות ומילים שקופצות.'
benefit: המסמך מימין לשמאל מההתחלה.
what_it_does: 'במקום כפתור הייצוא, ג''מיני בונה קובץ Word מימין לשמאל: פסקאות, טבלאות ומילים באנגלית במקום הנכון. סקילים אחרים קוראים לו.'
output: קובץ Word שנפתח נכון גם ב-Google Docs
requires: []
role: shared
tested:
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 10 מתוך 25 קיבלו 7 ומעלה'
- 'בגרסה 1.1.0, עם בנייה הוגנת של הקובץ (19.11.2026): 15 מתוך 25 קיבלו 7 ומעלה. ב-4 בקשות עם פרטים רגישים של תלמידים, ג''מיני השאיר בחוץ תעודות זהות, אבחונים ותרופות (ציונים 7 עד 9). כל הקבצים יצאו מימין לשמאל, גם הטבלאות'
- 'בגרסה 1.2.0 חתימה ושורות כותרת נשארות בשורות נפרדות. בדקתי את זה על 3 קבצים מהבדיקה, כתמונה ב-Word'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), בגרסה 1.3.0, כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 20 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.3'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
- 'באפליקציה של Gemini, כשכל 25 הסקילים מותקנים (19.11.2026, מצב Hydrogen Thinking): מחוון נבנה לפי create-rubric, והסקיל הזה הפך אותו לקובץ Word. בתצוגה המקדימה של ג''מיני הטבלה נראתה משמאל לימין. לא פתחתי את הקובץ ב-Word'
limitations:
- 'מסמך עם ניסוחים כימיים או נוסחאות: ג''מיני לא עבר לסקיל המשוואות באף אחת מ-4 הבדיקות. לדף עבודה עם נוסחאות כדאי חבילת דפי העבודה במתמטיקה'
- 'במצב המהיר יש לפעמים טעות בתוכן (שם של דמות, מילה משובשת), או פרט שהמורה לא נתן (ציוד, שנה). כדאי לקרוא את הקובץ לפני ששולחים'
- 'כשהמורה כבר ייצא ל-Docs, ג''מיני בנה קובץ חדש ולא הציע את התיקון המהיר ב-Docs'
simple: 'מסמך בעברית מג''מיני יוצא הפוך ב-Docs? עם הסקיל, ג''מיני בונה קובץ Word מימין לשמאל, עם טבלאות במקום הנכון.'
uses:
- when: 'מכתב או דף מידע'
  ask: 'תכתוב מכתב להורים על הטיול השנתי, כקובץ Word.'
  get: 'קובץ Word מימין לשמאל, שנפתח נכון גם ב-Google Docs.'
- when: 'טבלה בעברית'
  ask: 'תכין טבלה של המבחנים בחודש הבא, עם תאריך, מקצוע וחומר, כקובץ Word.'
  get: 'טבלה שהעמודה הראשונה שלה מימין, ולא הפוכה.'
- when: 'עברית ואנגלית יחד'
  ask: 'תכין דף אוצר מילים באנגלית לכיתה ז'', עם תרגום לעברית, כקובץ Word.'
  get: 'מילים באנגלית ובעברית, כל אחת במקום הנכון בשורה.'
fixes:
  intro: 'בלי הסקיל, Gemini מוציא מסמך בעברית עם 3 טעויות נפוצות:'
  list:
  - without: 'פסקאות שמתיישרות לשמאל.'
    with: 'עם הסקיל, Gemini בונה קובץ Word שכולו מימין לשמאל.'
  - without: 'טבלה הפוכה, שהעמודה הראשונה שלה משמאל.'
    with: 'עם הסקיל, העמודה הראשונה בטבלה מימין.'
  - without: 'מילים באנגלית ומספרים שקופצים לצד הלא נכון.'
    with: 'עם הסקיל, Gemini כותב אנגלית, תאריכים וטווחים בצורה שלא מתהפכת.'
