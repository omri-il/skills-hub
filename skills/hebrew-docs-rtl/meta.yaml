name: hebrew-docs-rtl
title: מסמכים בעברית ל-Docs בלי טקסט הפוך
version: 1.0.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה שמעביר טקסט מג'מיני ל-Google Docs או ל-Word
problem: 'מסמך בעברית שנראה מצוין בצ''אט יוצא שבור אחרי ייצוא ל-Docs: פסקאות מיושרות לשמאל, טבלאות הפוכות, ומילים באנגלית, מספרים וסוגריים שקופצים לצד הלא נכון. מתקנים שורה אחרי שורה.

  '
benefit: 'המסמך נבנה מימין לשמאל מההתחלה, ויש פחות מה לתקן שורה אחרי שורה ב-Docs.'
what_it_does: 'במקום כפתור הייצוא, ג''מיני בונה בעצמו קובץ Word מימין לשמאל: כל פסקה בכיוון הנכון, טבלאות שמתחילות מימין, מילים באנגלית שלא מתהפכות, וגופן אחיד. סקילים אחרים יכולים לקרוא לו כשהם יוצרים מסמך. אם המסמך כבר יצא הפוך, הוא מסביר איך לתקן הכל בבת אחת.

  '
output: קובץ Word שנפתח נכון גם ב-Google Docs
requires: []
role: shared
tested:
- עוד לא נבדק. הקוד מבוסס על הקוד של סקיל המשוואות, שכבר עובד
limitations:
- עוד לא נבדק על טבלאות ועל רשימות ממוספרות ב-Google Docs
- למסמך עם משוואות או ניסוחים כימיים יש סקיל נפרד
