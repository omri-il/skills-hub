name: sites-student-app
title: אפליקציה ששולחים לתלמידים דרך Sites
version: 1.0.0
updated: 2026-11-20
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
audience: מורים, גם בלי ניסיון בקוד
who:
- מורים
fits:
- ריאליים
- רב-מלל
problem: 'בחשבון של בית ספר אין ל-Canvas קישור לשיתוף. מייצאים ל-Google Sites, וכל תיקון יוצר קישור חדש.'
benefit: משחק או אפליקציה בקישור אחד ב-Classroom, שעובדים בטלפון, ותיקון בלי לשלוח קישור חדש.
what_it_does: 'בונה קובץ אחד בעברית שעובד בתוך Google Sites ובטלפון. נותן 5 צעדים: ייצוא ל-Sites, פרסום, קישור ב-Classroom. מסביר איך מתקנים באותו אתר, עם אותו קישור.'
output: 'ב-Canvas או בצ''אט: האפליקציה, הצעדים לשליחה, ואיך מתקנים בלי קישור חדש'
role: main
category: וייב קודינג
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (20.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 15 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.8. בגרסה הראשונה: 3'
- 'מורה ששאלה איך לשלוח משחק שכבר בנתה ב-Canvas קיבלה רק את הצעדים, בלי משחק חדש'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- 'התיקון בלי קישור חדש (להחליף את הקוד באתר הקיים) עוד לא נבדק בחשבון של בית ספר'
- 'לפעמים התשובה הנכונה היא הארוכה ביותר. לשחק פעם אחת לפני ששולחים'
- 'התשובות של התלמידים לא נשמרות. לזה יש את "לומדה ששומרת כל תשובה בגיליון"'
simple: 'ג''מיני בונה משחק או אפליקציה לתלמידים, שעובדים גם בטלפון. מקבלים צעדים קצרים איך לשלוח את זה ב-Classroom דרך Google Sites.'
uses:
- when: 'חזרה לפני מבחן'
  ask: 'תבנה לי משחק קצר על מצבי צבירה לכיתה ז'', לשלוח לתלמידים ב-Classroom.'
  get: 'משחק שעובד בטלפון, וצעדים קצרים: ייצוא ל-Sites, פרסום וקישור ב-Classroom.'
- when: 'כבר בניתם משהו ב-Canvas'
  ask: 'בניתי משחק ב-Canvas, ואין כפתור לשיתוף. איך שולחים אותו לתלמידים?'
  get: 'הצעדים לשליחה דרך Google Sites, ואיך מתקנים בהמשך עם אותו קישור.'
- when: 'תיקנתם, והקישור השתנה'
  ask: 'כל פעם שאני מתקן את האפליקציה ומייצא ל-Sites יש קישור חדש. איך מתקנים בלי לשלוח קישור חדש?'
  get: 'איך מחליפים את הקוד באתר הקיים. הקישור לתלמידים נשאר אותו קישור.'
fixes:
  also: 'לשים את כל הקוד בקובץ אחד, בלי שום דבר מאתר אחר, כי Sites חוסם אותו.'
