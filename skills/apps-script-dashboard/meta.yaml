name: apps-script-dashboard
title: 'מסדר הנתונים: לוח סיכום לגיליון בלחיצה (Apps Script)'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים ורכזים, גם בלי ניסיון בקוד'
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'גיליון של Google Forms או של לומדה מלא בשורות, ואין מבט אחד על מי צריך עזרה ובאיזו שאלה הכיתה נכשלה.'
benefit: 'תפריט בעברית בגיליון שבונה לשונית סיכום בלחיצה אחת, בלי נוסחאות.'
what_it_does: 'כותב קוד Apps Script שמוסיף תפריט "📊 סיכום". בלחיצה הוא בונה לשונית סיכום: ציון לכל תלמיד (ההגשה האחרונה), אחוז הצלחה לכל שאלה, צבעים לפי רמה, רשימת מי צריך עזרה ותרשים. לא משנה את לשונית התשובות.'
output: 'בצ''אט: Code.gs מלא והוראות התקנה'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 6.6, ו-16 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 4.0'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 7.2'
- 'הקוד בכל תשובה הורץ בגיליון מדומה (לא ב-Google): ב-18 מתוך 25 לוח הסיכום נבנה בלי שגיאה'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'הקוד הורץ בגיליון מדומה. הצבעים והתרשים לא נבדקו במראה, רק שהקוד רץ ובונה את הלשונית'
