name: apps-script-dashboard
title: לוח סיכום לגיליון בלחיצה (Apps Script)
version: 1.0.2
updated: 2026-11-20
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ורכזים, גם בלי ניסיון בקוד
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: גיליון של Google Forms מלא בשורות, ואין מבט אחד על מי צריך עזרה.
benefit: תפריט בגיליון שבונה לשונית סיכום בלחיצה, בלי נוסחאות.
what_it_does: 'כותב קוד Apps Script שמוסיף תפריט "📊 סיכום". בלחיצה נבנית לשונית: ציון לכל תלמיד, אחוז הצלחה לכל שאלה, מי צריך עזרה ותרשים. התשובות עצמן לא משתנות.'
output: 'בצ''אט: Code.gs מלא והוראות התקנה'
role: main
category: וייב קודינג
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.6, ו-16 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 7.2'
- 'הקוד הורץ בגיליון מדומה: ב-18 מתוך 25 הלוח נבנה בלי שגיאה'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 16 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.6'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- המראה של הצבעים והתרשים לא נבדק, רק שהקוד רץ
simple: 'יש לכם גיליון עם תשובות מ-Google Forms? ג''מיני כותב קוד קצר שמוסיף לגיליון כפתור. לוחצים, ומקבלים לשונית סיכום: ציון לכל תלמיד ומי צריך עזרה.'
uses:
- when: 'בוחן ב-Google Forms'
  ask: 'יש לי בוחן ב-Google Forms עם 10 שאלות. תכין לוח סיכום לגיליון התשובות.'
  get: 'קוד מוכן להדבקה והוראות צעד אחר צעד. אחרי לחיצה: ציון לכל תלמיד ואחוז הצלחה לכל שאלה.'
- when: 'לא יודעים לתכנת'
  ask: 'יש לי גיליון של מבחן בהבנת הנקרא. אני לא יודע לתכנת. איך מוסיפים לו סיכום?'
  get: 'הסבר פשוט איך להדביק את הקוד, ותפריט "📊 סיכום" בגיליון.'
- when: 'לראות מי צריך עזרה'
  ask: 'תוסיף לגיליון התשובות שלי רשימה של התלמידים שקיבלו פחות מ-60.'
  get: 'רשימה של מי שצריך עזרה, ותרשים. התשובות עצמן לא משתנות.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בלוח סיכום 3 טעויות נפוצות:'
  list:
  - without: 'קוד שמחפש עמודה לפי המספר שלה, ונשבר כשמוסיפים שאלה לטופס.'
    with: 'עם הסקיל, הקוד מוצא כל עמודה לפי הכותרת שלה.'
  - without: 'תפריט חדש שמבטל תפריט של קוד שכבר יש בגיליון.'
    with: 'עם הסקיל, Gemini מסביר איך מחברים את שני התפריטים.'
  - without: 'תשובות נכונות שהוא ממציא כשלא ראה את הגיליון.'
    with: 'עם הסקיל, Gemini מבקש קודם את שורת הכותרות.'
