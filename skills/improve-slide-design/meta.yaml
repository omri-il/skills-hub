name: improve-slide-design
title: שיפור עיצוב מצגות לכיתה
version: 1.0.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה שמכין מצגות לשיעור
problem: 'מצגות שנוצרות בבינה מלאכותית, ולא רק הן, עמוסות בטקסט קטן, בלי היררכיה, עם צבעים שנמחקים במקרן ועם פריסה שלא מתאימה לקריאה מימין לשמאל. מהשורה האחרונה בכיתה לא רואים כלום.

  '
what_it_does: 'בודק כל שקף בשבע שאלות: רעיון אחד, מה העין רואה ראשון, כמה מילים, גודל גופן, ניגודיות, תמונות ופריסה מימין לשמאל. מחזיר את שלושת התיקונים שישפרו הכי הרבה ותיקונים מדויקים לכל שקף בעייתי. כשג''מיני יוצר מצגת, הוא מעצב אותה לפי אותם כללים מההתחלה.

  '
output: ביקורת עיצוב עם תיקונים מעשיים, או מצגת שמעוצבת לפי הכללים
requires: []
role: main
tested:
- עוד לא נבדק
limitations:
- עוד לא נבדק על מצגת שמועלית כקובץ PowerPoint או PDF
- לא משנה את התוכן הפדגוגי. לזה יש את הסקיל של מצגות לשיעור
