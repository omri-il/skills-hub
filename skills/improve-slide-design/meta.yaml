name: improve-slide-design
title: שיפור עיצוב מצגות לכיתה
version: 1.1.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים שמכינים מצגות
who:
- מורים
- רכזים
- מנהלים
problem: מצגות עמוסות בטקסט קטן ובצבעים שנמחקים במקרן. מהשורה האחרונה לא רואים כלום.
benefit: מצגת שרואים גם מהשורה האחרונה, ו-3 התיקונים הכי חשובים.
what_it_does: 'בודק כל שקף ב-7 שאלות: רעיון אחד, כמות מילים, גופן, ניגודיות ופריסה מימין לשמאל. מחזיר את 3 התיקונים החשובים, ותיקון לכל שקף.'
output: ביקורת עם תיקונים, או מצגת לפי הכללים
requires: []
role: main
category: עזרי הוראה
tested:
- '25 מצגות לבדיקה כקובץ PDF, דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: בגרסה 1.1.0 ממוצע 4.5, ו-5 מתוך 25 קיבלו 7 ומעלה'
limitations:
- 'החלק החלש: ג''מיני לא רואה טוב מקובץ PDF גופנים שונים, גודל טקסט ויישור, וממציא בעיות במצגת טובה'
- לא משנה את התוכן. לזה יש את סקיל המצגות לשיעור
simple: 'מעלים לג''מיני מצגת. הוא בודק כל שקף ואומר מה לתקן, כדי שגם מהשורה האחרונה יראו ויבינו.'
uses:
- when: 'לפני שיעור'
  ask: 'תבדוק את העיצוב של המצגת שהעליתי. אני מקרין אותה בכיתה גדולה.'
  get: '3 התיקונים הכי חשובים, ותיקון לכל שקף.'
- when: 'שקף עמוס'
  ask: 'השקף הזה עמוס מדי. איך לחלק אותו? [כאן מדביקים את הטקסט של השקף]'
  get: 'הצעה לחלק את השקף לכמה שקפים, עם רעיון אחד בכל אחד.'
- when: 'מצגת חדשה'
  ask: 'תכין לי מצגת על מלחמת העצמאות לכיתה ט'', לפי כללי העיצוב לכיתה.'
  get: 'מצגת עם מעט מילים, גופן גדול וצבעים שרואים במקרן.'
hidden: true
