name: student-exam-practice
title: Gem לתרגול למבחן, בלי שהוא פותר במקום התלמיד
version: 1.0.0
updated: 2026-11-20
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, כיתות ד'-י"ב
who:
- מורים
fits:
- ריאליים
- רב-מלל
problem: תלמידים מתרגלים למבחן עם צ'אט, והוא נותן להם את התשובות במקום ללמד.
benefit: הוראות מוכנות ל-Gem שמתרגל עם התלמידים שאלה אחר שאלה, עם רמזים ובלי לפתור במקומם.
what_it_does: 'מהנושא, הכיתה והחומר, כותב הוראות ל-Gem של תלמידים: שאלה אחת בכל פעם, רמז לפני תשובה, משוב על כל תשובה וסיכום של מה לחזור עליו. מוסיף שלבים לשתף את ה-Gem ב-Classroom ובדיקה של 3 דקות.'
output: 'בצ''אט: הוראות להעתקה ל-Gem, שלבים לשיתוף ב-Classroom, ובדיקה קצרה'
role: main
category: עזרי הוראה
story: 'בקבוצות הוואטסאפ של מורים שעובדים עם Google (15.11.2026) מורה סיפרה שבנתה Gem לתרגול למבחן ולא Skill, כי תלמידים עוד לא יכולים להשתמש ב-Skills. הסקיל הזה כותב את ההוראות ל-Gem, ואותו טקסט יתאים גם ל-Skill של תלמידים כשזה יתאפשר.'
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (20.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 17 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.2, ואף אחת לא נכשלה. זה אחרי 3 סבבי תיקון: בסבב הראשון 13 מתוך 25'
limitations:
- לא נבדק באפליקציה של Gemini, בחשבון של בית ספר או ב-Classroom. גם ה-Gem עצמו, עם תלמיד אמיתי, עוד לא נבדק
- 'לפעמים ג''מיני מוסיף פרטים לרשימת הנושאים, למשל פסוק או נוסחה, ואלה יכולים לגלות לתלמיד תשובה. לקרוא את הרשימה לפני ההדבקה'
- לפעמים ג'מיני מנסח מחדש שורות קבועות בהוראות. הבדיקה של 3 דקות מראה אם ה-Gem עדיין לא נותן תשובות
simple: 'כותבים לג''מיני על מה המבחן ולאיזו כיתה. הוא כותב הוראות ל-Gem שמתרגל עם התלמידים בבית, שאלה אחר שאלה, ולא נותן להם את התשובות.'
uses:
- when: 'תרגול בבית לפני מבחן'
  ask: 'מבחן בביולוגיה לכיתה ח'' ביום ראשון על התא. תכין לי Gem שהתלמידים יתרגלו איתו.'
  get: 'הוראות להדבקה ל-Gem, ושלבים לשתף אותו ב-Classroom.'
- when: 'סימולציה של מבחן'
  ask: 'אני רוצה Gem שעושה לתלמידים מבחן מתכונת בהיסטוריה, בלי רמזים, ועם ציון בסוף. [כאן מדביקים את רשימת הנושאים]'
  get: 'הוראות ל-Gem במצב מבחן: כל השאלות, ובסוף מה לחזור עליו.'
- when: 'כיתה מתקשה'
  ask: 'Gem לתרגול שברים לכיתה ה'' מתקשה. שאלות קצרות, הרבה עידוד.'
  get: 'הוראות לגרסה מותאמת: שאלות קצרות, צעד אחד בכל פעם, 5 שאלות בתרגול.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בתרגול למבחן 3 טעויות נפוצות:'
  list:
  - without: 'נותן לתלמיד את התשובות במקום ללמד.'
    with: 'עם הסקיל, ההוראות אומרות ל-Gem לתת רמז, ולא את התשובה.'
  - without: '5 שאלות בהודעה אחת.'
    with: 'עם הסקיל, ההוראות אומרות לשאול שאלה אחת ולחכות.'
  - without: 'מפתח תשובות בהוראות או בקבצים, שהתלמידים רואים.'
    with: 'עם הסקיל, Gemini לא מכניס מפתח תשובות להוראות, ומזהיר לא להעלות אותו כקובץ.'
