name: create-lesson-slides
title: מצגת לשיעור לפי עקרונות פדגוגיים
version: 1.0.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה, מכל מקצוע ולכל גיל
problem: 'כשמבקשים מג''מיני מצגת לשיעור, מקבלים סיכום של החומר על שקפים: הרבה טקסט, מעט שאלות, ותלמידים שיושבים וקוראים. אין מטרה ברורה, אין בדיקה אם הבינו, ואין רגע שבו התלמידים עובדים בעצמם.

  '
what_it_does: 'בונה את המצגת כתסריט של שיעור: שאלת פתיחה, מטרה וקריטריונים להצלחה, הפעלת ידע קודם, הוראה בחלקים קטנים עם דוגמה פתורה ובדיקת הבנה אחרי כל רעיון, תפיסה שגויה לתיקון, תרגול פעיל, שאלת דיון, סיכום שהתלמידים כותבים בעצמם וכרטיס יציאה. בהערות הדובר: מה לומר, כמה זמן לכל שקף והתשובות הצפויות. משתמש בסקיל העיצוב ובסקיל תיקון הכיוון.

  '
output: מצגת לשיעור עם הערות דובר, ושלוש שורות למורה
requires:
- improve-slide-design
- fix-slides-rtl
role: main
tested:
- עוד לא נבדק
limitations:
- עוד לא נבדק אם ג'מיני מכניס את הערות הדובר למצגת כשמייצאים ל-Google Slides
