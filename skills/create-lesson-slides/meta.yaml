name: create-lesson-slides
title: מצגת לשיעור לפי עקרונות פדגוגיים
version: 1.1.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה
who:
- מורים
fits:
- רב-מלל
problem: 'כשמבקשים מג''מיני מצגת, מקבלים סיכום של החומר על שקפים: הרבה טקסט ומעט שאלות.'
benefit: מצגת שהיא כבר מערך שיעור, עם מה לומר בכל שקף.
what_it_does: 'בונה את המצגת כמו שיעור: שאלת פתיחה, מטרה, הוראה בחלקים קטנים עם בדיקת הבנה, תרגול, דיון וכרטיס יציאה. בהערות הדובר: מה לומר וכמה זמן. קובץ PowerPoint שנפתח ב-Slides מימין לשמאל.'
output: קובץ PowerPoint עם הערות דובר
requires:
- improve-slide-design
- fix-slides-rtl
role: main
category: עזרי הוראה
tested:
- 'מצגת על מחזור המים (Flash ו-Pro), גם עם שם הסקיל: ג''מיני בנה מצגת Canvas משלו, בלי הסקיל (7.11.2026)'
limitations:
- 'בג''מיני הסקיל לא רץ כשמבקשים מצגת: הכלי המובנה של ג''מיני לוקח את הבקשה'
- בלי תמונות
simple: 'אומרים לג''מיני נושא וכיתה. הוא בונה מצגת שהיא שיעור שלם: שאלת פתיחה, הסבר, תרגול וכרטיס יציאה. בהערות כתוב מה לומר בכל שקף.'
uses:
- when: 'שיעור בנושא חדש'
  ask: 'מצגת לשיעור של 45 דקות על פוטוסינתזה לכיתה ז''.'
  get: 'קובץ PowerPoint עם שאלות לבדיקת הבנה, ומה לומר בכל שקף.'
- when: 'פחות טקסט, יותר שאלות'
  ask: 'מצגת לשיעור על כתיבת טיעון לכיתה ט''. הרבה שאלות ומעט טקסט.'
  get: 'מצגת עם דיון ותרגול, וזמן לכל חלק.'
- when: 'חומר שכבר יש לכם'
  ask: 'הנה סיכום של הפרק בהיסטוריה. תהפוך אותו למצגת לשיעור. [כאן מדביקים את הסיכום]'
  get: 'שיעור על החומר שלכם, שנפתח ב-Google Slides מימין לשמאל.'
hidden: true
