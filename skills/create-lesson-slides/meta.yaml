name: create-lesson-slides
title: מצגת לשיעור לפי עקרונות פדגוגיים
version: 1.1.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה, מכל מקצוע ולכל גיל
who: [מורים]
fits: [רב-מלל]
problem: 'כשמבקשים מג''מיני מצגת לשיעור, מקבלים סיכום של החומר על שקפים: הרבה טקסט, מעט שאלות, ותלמידים שיושבים וקוראים. אין מטרה ברורה, אין בדיקה אם הבינו, ואין רגע שבו התלמידים עובדים בעצמם.

  '
benefit: 'מצגת שהיא כבר מערך שיעור: שאלות, בדיקת הבנה, כרטיס יציאה, ומה לומר בכל שקף.'
what_it_does: 'בונה את המצגת כתסריט של שיעור: שאלת פתיחה, מטרה וקריטריונים להצלחה, הפעלת ידע קודם, הוראה בחלקים קטנים עם דוגמה פתורה ובדיקת הבנה אחרי כל רעיון, תפיסה שגויה לתיקון, תרגול פעיל, שאלת דיון, סיכום שהתלמידים כותבים בעצמם וכרטיס יציאה. בהערות הדובר: מה לומר, כמה זמן לכל שקף והתשובות הצפויות. המצגת יוצאת כקובץ PowerPoint שנפתח ב-Google Slides מימין לשמאל. משתמש בסקיל העיצוב ובסקיל המצגות בעברית.

  '
output: קובץ PowerPoint לשיעור, עם הערות דובר, שנפתח ב-Slides מימין לשמאל
requires:
- improve-slide-design
- fix-slides-rtl
role: main
tested:
- 'בקשה למצגת על מחזור המים לכיתה ה'' בג''מיני (Flash ו-Pro), גם כשנכתב שם הסקיל: ג''מיני בנה מצגת Canvas משלו, בלי מבנה השיעור של הסקיל (7.11.2026)'
limitations:
- 'בג''מיני הסקיל לא מופעל כשמבקשים מצגת: הכלי המובנה של ג''מיני לוקח את הבקשה'
- בלי תמונות בשקפים
