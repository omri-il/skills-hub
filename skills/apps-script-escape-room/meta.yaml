name: apps-script-escape-room
title: חדר בריחה שמדווח למורה (Apps Script)
version: 1.0.0
updated: 2026-11-20
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, גם בלי ניסיון בקוד
who:
- מורים
fits:
- ריאליים
- רב-מלל
problem: 'משחק שבונים ב-Canvas נראה מצוין, אבל לא יודעים מי סיים, מי נתקע, ובאיזה שלב.'
benefit: חדר בריחה בקישור לתלמידים, וגיליון שמראה לכם מי תקוע ובאיזה שלב.
what_it_does: 'כותב 2 קבצים ל-Apps Script: משחק שלבים עם מנעולים, רמזים ודף שעובד בטלפון. כל ניסיון נשמר בגיליון, ולשונית "סיכום למורה" מראה כמה עברו כל שלב ומי תקוע בו. התשובות נשארות בשרת.'
output: 'בצ''אט: Code.gs, Index.html והוראות התקנה'
requires: []
role: main
category: וייב קודינג
tested:
- עוד לא נבדק
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- בחשבון של בית ספר אפליקציות אינטרנט יכולות להיות חסומות לתלמידים. לבדוק את הקישור מחשבון של תלמיד לפני השיעור
simple: 'ג''מיני בונה חדר בריחה שתלמידים פותחים בקישור. בגיליון שלכם רואים כמה עברו כל שלב, ומי תקוע איפה.'
uses:
- when: 'חזרה לפני מבחן'
  ask: 'תבנה לי חדר בריחה על שברים לכיתה ו''.'
  get: 'משחק של 5 שלבים, 2 קבצי קוד מוכנים, והסבר צעד אחר צעד איך לפרסם.'
- when: 'השאלות כבר אצלכם'
  ask: 'תבנה חדר בריחה מהשאלות האלה לכיתה ט''. [כאן מדביקים את השאלות והתשובות]'
  get: 'כל שאלה הופכת למנעול. השאלות שלכם נכנסות מילה במילה.'
- when: 'לדעת איפה הכיתה נתקעת'
  ask: 'אני רוצה משחק שלבים בביולוגיה לכיתה י'', ושאראה באיזה שלב רוב התלמידים נתקעים.'
  get: 'לשונית "סיכום למורה" עם כל שלב: כמה עברו, כמה ניסיונות, ומי תקוע בו עכשיו.'
