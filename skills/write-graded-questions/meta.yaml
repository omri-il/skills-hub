name: write-graded-questions
title: שאלות מדורגות לפי רמות חשיבה
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה שכותב שאלות לדף עבודה, למבחן, לשיעור או לדיון
problem: 'שאלות שנכתבות מהר נוטות כולן לאותה רמה, ושאלה שמתחילה ב"נתחו" היא לעיתים שאלת שינון. בנוסף, הרבה שאלות מגלות את התשובה בניסוח עצמו, לא אומרות לתלמיד בכמה שורות לענות, ומסיחים בשאלות אמריקאיות נבנים רנדומלית ולכן לא מלמדים כלום על התלמיד.

  '
what_it_does: 'כותב שאלות בחמש רמות חשיבה עם פיזור שמתאים למטרה — בוחן, מבחן, דף תרגול, שיעור או חזרה. מוודא שכל שאלה היא שאלה אחת, שהתשובה לא מופיעה בניסוח, שכל שאלה ברמה גבוהה נשענת על נתון שהתלמיד רואה, שההיקף הנדרש מצוין, ושכל מסיח בשאלה אמריקאית הוא טעות אמיתית שתלמידים עושים.

  '
output: רשימת שאלות עם ניקוד וסימון רמת החשיבה של כל אחת
requires: []
role: shared
tested:
- 'טרם נבדק. הותקן בג''מיני ב-2026-11-11 אבל לא הורץ: סקיל עזר; לא נבדק לבד'
limitations:
- טרם נבדק על שאלות אוריינות על טקסט ארוך
- לא נבדק עד כמה ג'מיני מצליח לייצר מסיחים שהם טעויות אמיתיות ולא רנדומליות
