name: adapt-worksheet-for-levels
title: התאמת חומר לרמות ולהתאמות
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה בכיתה הטרוגנית, ומורים שמלמדים תלמידים עם התאמות מאושרות
problem: 'דיפרנציאציה אמיתית דורשת להכין שלושה דפים במקום אחד, ולכן היא לא קורית. כשמבקשים מבינה מלאכותית "גרסה קלה", מקבלים דף עם פחות שאלות וממוספר מחדש, שמונע מהמורה לעבוד עם כל הכיתה יחד, וכתוב עליו בגדול "גרסה לחלשים".

  '
what_it_does: 'לוקח דף עבודה, מבחן או חומר קיים ובונה שלוש גרסאות שמשרתות אותה מטרת למידה. שומר על אותו מספור שאלות בכל הגרסאות כדי שאפשר לבדוק יחד ולדבר בכיתה על "שאלה 3", מסמן את הגרסאות בסימן נייטרלי ולא בדירוג, בוחר פיגומים לפי מה שחוסם את התלמיד, ומיישם התאמות נגישות לפענוח, קשב, הקראה וכתיבה.

  '
output: קובץ Word עם שלוש גרסאות, כל אחת בעמוד, ודף מורה עם מפתח תשובות אחד
requires:
- hebrew-docs-rtl
- format-equations-for-hebrew-worksheets
role: main
tested:
- טרם נבדק בג'מיני. הסקיל נכתב ב-2026-11-11 וממתין לבדיקה של מורה
limitations:
- טרם נבדק על דף עבודה סרוק או מצולם שהמורה מעלה
- לא נבדק האם ג'מיני שומר בפועל על המספור המקורי בכל שלוש הגרסאות
