name: build-rubric
title: בניית מחוון
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה שנותן ציון על עבודה, מטלה, פרויקט או מצגת
problem: 'מחוון שנכתב מהר מלא בשורות כמו "מראה הבנה טובה" או "כתיבה איכותית", ושני מורים שבודקים לפיו מגיעים לציונים רחוקים. כשמבקשים מחוון מבינה מלאכותית בלי הנחיות, מקבלים תשע שורות של שיפוטים שאי אפשר להצביע עליהם בעבודה, ומשקלים שלא מסתכמים ל-100.

  '
what_it_does: 'בונה מחוון עם ארבע רמות ביצוע ועד שישה קריטריונים, שכל תא בו מתאר מה רואים בעבודה ולא מה הבודק חושב. מוודא שהמשקלים מסתכמים ל-100, מגביל עיצוב ואורך ל-10%, מוציא מאמץ והתנהגות מהציון התוכני, ומציג את חשבון ההמרה לציון. אם המחוון מחולק לתלמידים מראש, הוא מנוסח כהוראה ולא כשיפוט.

  '
output: טבלת מחוון בצ'אט, וקובץ Word להדפסה או לחלוקה
requires: []
role: shared
tested:
- 'טרם נבדק. הותקן בג''מיני ב-2026-11-11 אבל לא הורץ: סקיל עזר; לא נבדק לבד'
limitations:
- טרם נבדק על מקצועות הומניים ועל מטלות מעשיות
- לא נבדק האם ג'מיני מקפיד בפועל על סכום משקלים של 100 בלי חישוב בקוד
