name: hebrew-gender-address
title: פנייה נכונה לתלמידים ולתלמידות
version: 1.1.0
updated: 2026-11-21
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים שכותבים דפי עבודה, מבחנים, הודעות ו-Gems לתלמידים
fits:
- רב-מלל
- ריאליים
problem: ג'מיני כותב הכול בזכר, מחליף מגדר באמצע הטקסט, או ממלא את הדף ב"קרא/י".
benefit: דף שפונה נכון לכל תלמיד ולכל תלמידה, בלי לעבור עליו מילה אחר מילה.
what_it_does: 'משכתב טקסט באחת מ-4 דרכים: פנייה שוויונית בשם פועל, 2 גרסאות (לתלמיד ולתלמידה), מגדר אחד, או רק בדיקה שמסמנת כל מקום שבו המגדר מתחלף. התוכן, המספרים והציטוטים לא משתנים.'
output: הטקסט המתוקן, מוכן להעתקה, ורשימה קצרה של מה ששונה
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 16 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.4'
- 'בגרסה 1.1.0, אותן 25 בקשות (21.11.2026, gemini-3.5-flash): 17 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.8. השתפרו: בבדיקה הוא כבר לא ממציא בעיה בטקסט תקין, ולא עובר לזכר בלי בקשה'
limitations:
- 'לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @'
- 'במצב המהיר לפעמים יש מילה עם שגיאת כתיב או אות משפה אחרת. לקרוא לפני שמדפיסים'
- 'בכלל שהוא מוסיף ל-Gem, לפעמים הניסוח שונה מעט מהנוסח שבסקיל'
simple: 'מדביקים לג''מיני דף עבודה, מבחן או הודעה. מקבלים טקסט שפונה נכון לתלמידים ולתלמידות, מההתחלה עד הסוף.'
uses:
- when: 'דף עבודה לכל הכיתה'
  ask: 'תכתוב את הדף בפנייה שוויונית, גם לתלמידים וגם לתלמידות. [כאן מדביקים את הדף]'
  get: 'כל הוראה בשם פועל ("לקרוא", "לענות"), בלי "קרא/י".'
- when: 'מבחן בנוסח לבנים ונוסח לבנות'
  ask: 'תכין 2 גרסאות של המבחן: לתלמיד ולתלמידה. [כאן מדביקים את המבחן]'
  get: '2 גרסאות מלאות, עם אותן שאלות ואותם מספרים.'
- when: 'לבדוק טקסט שג''מיני כבר כתב'
  ask: 'תבדוק את המגדר בטקסט הזה ותסמן כל מקום שהוא מתחלף. [כאן מדביקים את הטקסט]'
  get: 'טבלה של כל מקום עם בעיה, ואחריה הטקסט המתוקן.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בפנייה לתלמידים 3 טעויות נפוצות:'
  list:
  - without: 'כל הדף בלשון זכר, גם כשהכיתה מעורבת.'
    with: 'עם הסקיל, כל הוראה בשם פועל ("לקרוא", "לענות"), והיא פונה לכולם.'
  - without: '"אתה" בשאלה אחת ו"את" בשאלה הבאה.'
    with: 'עם הסקיל, אותה פנייה מהשורה הראשונה עד האחרונה.'
  - without: '"קרא/י" ו"תלמיד/ה" בכל שורה, וקשה לקרוא.'
    with: 'עם הסקיל, בלי לוכסנים, וגם המספרים והציטוטים נשארים כמו שהם.'
