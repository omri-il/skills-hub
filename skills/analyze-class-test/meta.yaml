name: analyze-class-test
title: ניתוח מבחן כיתה
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה אחרי מבחן או בוחן, ורכזי מקצוע
problem: 'אחרי מבחן יש טבלת ציונים ואין זמן להסתכל עליה, ולכן ההחלטה מה ללמד שוב מתקבלת מתחושה. בנוסף, מודלים של בינה מלאכותית מעריכים אחוזים וממוצעים בעין ונוטים להזות מספרים, ומורה שייקח מכאן נתון שגוי ייקח אותו לישיבת צוות.

  '
what_it_does: 'מחשב בקוד את כל המספרים — ממוצע, חציון ואחוז הצלחה לכל שאלה — ומאמת קודם שהניקוד מסתכם. מסמן שאלות שנכשלו כחשד שהשאלה פגומה ולא שהכיתה לא ידעה, מזהה מסיח שנבחר יותר מהתשובה הנכונה כתפיסה שגויה מוגדרת, מפריד בעיית זמן מבעיית ידע, ומסיים בשלוש החלטות: מה ללמד שוב לכולם, מה בקבוצה קטנה, ועל מה לא לחזור.

  '
output: קובץ Word עם ניתוח הפריטים והקבוצות, ושלוש החלטות בצ'אט
requires:
- hebrew-docs-rtl
role: main
tested:
- '2026-11-11, Gemini 3.1 Pro: טבלת ציונים של 10 תלמידים ב-5 שאלות, שהודבקה בצ''אט. הריץ קוד, אימת קודם שהניקוד מסתכם ל-100, ויצר קובץ Word מימין לשמאל. כל המספרים נבדקו ביד ונכונים (ממוצע 67.8, חציון 69.5, 2 נכשלים)'
- 'שאלה עם 24% הצלחה סומנה כחשד ששאלה פגומה ולא ככישלון של הכיתה, עם הנימוק שאין נכשלים בשאר המבחן. בצ''אט נשארו בדיוק שלוש החלטות, ובקובץ התלמידים מופיעים במספרים ולא בשמות'
limitations:
- 'נבדק רק ב-Gemini 3.1 Pro. ב-2026-11-11 בחשבון הבדיקה Flash ענה רק על שאלות של שורה אחת, ועל שאלות הבדיקה החזיר סירוב גנרי או נתקע; Thinking נתקע או סירב גם על "מה בירת איטליה". לא ברור אם זו תקלה בחשבון או עומס מ-36 הסקילים שהיו מותקנים בו, ולכן עדיין לא ידוע איך הסקיל מתנהג ב-Flash, ברירת המחדל של רוב המורים'
- 'נבדק רק על טבלה שהודבקה בצ''אט, לא על קובץ ממערכת מנהלת ולא על צילומי מבחנים'
- 'לא נבדק עם פחות מ-10 תלמידים, הסף שבו הסקיל אמור להזהיר שהמסקנות הן על יחידים'
- 'לא נבדק על מבחן אמריקאי, ולכן זיהוי תפיסה שגויה מתוך מסיח עוד לא נבדק'
