who: [מורים]
problem: 'יצירת דף תרגול טוב לוקחת זמן: צריך לדרג את הקושי, לבחור מספרים שנותנים תשובות נקיות, לכתוב פתרון מלא, ולוודא שהמשוואות נראות נכון בדף. כשמבקשים את זה מג''מיני בלי הנחיות, מקבלים שאלות לא מדורגות, מפתח עם טעויות ומשוואות שבורות.

  '
benefit: 'קובץ Word תוך דקה בערך, עם שאלות מדורגות ומפתח תשובות שנבדק בקוד.'
what_it_does: 'יוצר דף עבודה במתמטיקה לפי כיתה ונושא: שאלות מדורגות מבסיס להעמקה, מקום לפתרון, ומפתח תשובות עם פתרון מלא בעמוד נפרד. יכול ליצור גרסת בסיס וגרסה מתקדמת לדיפרנציאציה. משתמש בסקיל העיצוב ובסקיל הבדיקה.

  '
output: קובץ Word עם דף תלמיד ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- verify-solutions
role: main
