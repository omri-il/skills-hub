name: create-math-practice
title: דפי תרגול במתמטיקה
version: 1.3.0
updated: 2026-11-19
subjects:
- מתמטיקה
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים למתמטיקה, חט"ב ותיכון (3-5 יח"ל)
who:
- מורים
problem: דף תרגול טוב לוקח זמן. ג'מיני בלי הנחיות נותן שאלות לא מדורגות, מפתח עם טעויות ומשוואות שבורות.
benefit: קובץ Word עם שאלות מדורגות, גרפים ושרטוטים נכונים, ומפתח שנבדק בקוד.
what_it_does: 'יוצר דף לפי כיתה ונושא: שאלות מדורגות ומפתח עם פתרון מלא. מצייר גרפים, מעגלים, משולשים ושרטוטי הוכחה, והקוד בודק שכל מספר בשרטוט נכון. בשאלה שמחשבים בה, הגרף בלי מספרים, כדי לא לגלות את התשובה. אפשר גרסת בסיס וגרסה מתקדמת.'
output: קובץ Word עם דף תלמיד ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- verify-solutions
role: main
category: עזרי הוראה
tested:
- 'ציורים, גרסה 1.3.0 (19.11.2026): 16 בקשות דרך ה-API, כל אחת פעמיים ב-gemini-3.5-flash, ו-12 הרצות ב-gemini-4-hydrogen'
- 'Claude נתן ציון מ-0 עד 10: ב-Hydrogen ממוצע 8.5, ו-11 מתוך 12 קיבלו 7 ומעלה. ב-Flash: ב-14 מתוך 16 נוצר קובץ, ממוצע 6.6'
- הקוד מצא שרטוטים שלא תאמו לנתונים, ו-Gemini תיקן אותם לפני שמסר
- 'Claude פתח 11 קבצים ב-Word: גרפים, מעגלים ושרטוטי הוכחה מוצגים נכון'
- רץ לבד מבקשה רגילה, וקרא לבד לסקיל העיצוב ולסקיל הבדיקה
- 'דף סדרות הנדסיות 4 יח"ל: 6 שאלות מדורגות וקובץ Word תוך דקה'
limitations:
- הציורים לא נבדקו באפליקציה. הם צריכים pandoc, matplotlib ו-sympy
- במצב המהיר לפעמים יש טעות בהוכחה או במפתח. לעבור על ההוכחות, או לעבוד במצב Thinking
- לא מצייר גופים במרחב, סטטיסטיקה ווקטורים
- לפעמים צריך לכתוב "כקובץ Word" בבקשה
simple: 'אומרים לג''מיני כיתה ונושא במתמטיקה. הוא יוצר דף תרגול בקובץ Word, עם שאלות מהקל לקשה, שרטוטים נכונים ומפתח עם פתרון מלא.'
uses:
- when: 'דף לשיעור'
  ask: 'דף תרגול בסדרות הנדסיות ל-4 יחידות, כקובץ Word.'
  get: 'שאלות מדורגות, ומפתח עם כל שלבי הפתרון.'
- when: 'גאומטריה'
  ask: 'דף על משולשים חופפים לכיתה ח'', עם שרטוטים.'
  get: 'שרטוטים ברורים, וכל מספר בשרטוט נכון.'
- when: '2 רמות'
  ask: 'דף על פונקציה קווית לכיתה ט'', בגרסת בסיס ובגרסה מתקדמת.'
  get: '2 דפים באותו נושא, ומפתח לכל אחד.'
