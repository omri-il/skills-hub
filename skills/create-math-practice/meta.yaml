name: create-math-practice
title: דפי תרגול במתמטיקה
version: 1.3.0
updated: 2026-11-19
subjects:
- מתמטיקה
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים למתמטיקה, חטיבת ביניים ותיכון (3, 4 ו-5 יחידות)
who: [מורים]
problem: 'יצירת דף תרגול טוב לוקחת זמן: צריך לדרג את הקושי, לבחור מספרים שנותנים תשובות נקיות, לכתוב פתרון מלא, ולוודא שהמשוואות נראות נכון בדף. כשמבקשים את זה מג''מיני בלי הנחיות, מקבלים שאלות לא מדורגות, מפתח עם טעויות ומשוואות שבורות.

  '
benefit: 'קובץ Word עם שאלות מדורגות, גרפים ושרטוטים שמתאימים לנתונים, ומפתח תשובות שנבדק בקוד.'
what_it_does: 'יוצר דף עבודה במתמטיקה לפי כיתה ונושא: שאלות מדורגות מבסיס להעמקה, מקום לפתרון, ומפתח תשובות עם פתרון מלא בעמוד נפרד. מצייר בתוך הדף גרפים של פונקציות (כולל אסימפטוטות ושטח צבוע בין גרפים), נקודות, ישרים ומעגלים על מערכת צירים, משולשים לפי מידות לטריגונומטריה, ושרטוטים להוכחה עם אותיות, סימני צלעות שוות, זוויות ישרות וזוויות שוות. הקוד בודק שכל מספר וכל סימן בשרטוט מתאים לשרטוט עצמו. בשאלה שבה מחשבים, הגרף הוא סקיצה בלי מספרים, כדי שהתלמיד לא יקרא את התשובה מהציור. יכול ליצור גרסת בסיס וגרסה מתקדמת לדיפרנציאציה. משתמש בסקיל העיצוב ובסקיל הבדיקה.

  '
output: קובץ Word עם דף תלמיד ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- verify-solutions
role: main
tested:
- 'ציורים, גרסה 1.3.0 (19.11.2026). בדיקה דרך ה-API של Gemini, לא באפליקציה. ב-API אין pandoc, ולכן הקוד של Gemini רץ במחשב עם pandoc, כמו בסביבת הקוד של האפליקציה. 16 בקשות של מורים (פונקציות, הוכחות, טריגונומטריה, מעגל, אינטגרלים, גאומטריה אנליטית, דמיון), כל אחת פעמיים עם gemini-3.5-flash, ו-12 הרצות עם gemini-4-hydrogen'
- 'Claude נתן לכל דף ציון מ-0 עד 10. gemini-4-hydrogen: ממוצע 7.9 בסבב הראשון ו-8.5 בשני, ו-11 מתוך 12 דפים קיבלו 7 ומעלה. gemini-3.5-flash בסבב האחרון: ב-14 מתוך 16 נוצר קובץ, ממוצע 6.6 לדפים שנוצרו. הציונים הנמוכים ב-Flash באו בעיקר מטעויות בהוכחות ובמפתח, לא מהציורים'
- 'הקוד מצא שרטוטים שלא מתאימים לנתונים, ו-Gemini תיקן אותם לפני שמסר: למשל צלע שכתוב עליה 10, כשבשרטוט היא 8.5'
- 'בסבב הראשון ציורים גילו את התשובה: שיעורים של נקודה שהתלמיד צריך למצוא, או זווית ישרה שצריך להוכיח. הוספתי סקיצה בלי מספרים כברירת מחדל ובדיקה של כל סימן מול הנתון, ובסבב השני הבעיה כמעט נעלמה'
- 'Claude פתח 11 קבצים ב-Word וראה אותם כתמונה: גרפים, אסימפטוטות, שטח צבוע, מעגלים עם משיק, משולשים עם ? ושרטוטי הוכחה מוצגים נכון'
- הופעל אוטומטית מבקשה רגילה, בלי /, וקרא בעצמו לסקיל העיצוב ולסקיל הבדיקה
- 'דף סדרות הנדסיות 4 יח"ל: 6 שאלות מדורגות, תשובות שנבדקו בקוד, קובץ Word תוך כדקה'
limitations:
- 'הציורים לא נבדקו עדיין באפליקציית Gemini. הם צריכים pandoc, matplotlib ו-sympy בסביבת הקוד'
- 'במצב המהיר (Flash) יש לפעמים טעות בהוכחה או במפתח, ושרטוט של הוכחה עם שיעורים שלא מתאימים לנתון שלא סומן בשרטוט. כדאי לעבור על ההוכחות לפני ההדפסה, או לעבוד במצב Thinking'
- 'ב-2 מתוך 16 בקשות במצב המהיר, Gemini הריץ הרבה קוד כדי לחשב שיעורים לשרטוטים ולא מסר קובץ. אחרי תיקון בסקיל, 4 מתוך 4 בקשות כאלה מסרו קובץ'
- 'הסקיל לא מצייר גופים במרחב, דיאגרמות של נתונים וסטטיסטיקה, ווקטורים'
- לא תמיד יוצר קובץ בלי שהמילים "כקובץ Word" מופיעות בבקשה
