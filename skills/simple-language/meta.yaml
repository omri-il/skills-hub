name: simple-language
title: שפה פשוטה וברורה (STE)
version: 1.4.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים שכותבים הוראות, דפי עבודה ומכתבים להורים
fits:
- רב-מלל
problem: הוראות ומכתבים להורים נכתבים במשפטים ארוכים ובשפה גבוהה. תלמידים והורים מפספסים דרישות ושואלים שוב.
benefit: ההודעה מובנת מהקריאה הראשונה. פחות תלמידים והורים חוזרים לשאול מה צריך לעשות.
what_it_does: 'כותב בשפה פשוטה לפי כללי STE: משפטים קצרים, פעולה אחת בכל משפט, בלי מילים גבוהות. משכתב טקסט ושומר את כל העובדות, או כותב חומר חדש. מפשט את השפה, לא את התוכן.'
output: טקסט מוכן להעתקה, ורשימה קצרה של מה ששונה
requires: []
role: main
category: כלים לכל יום
tested:
- '12.11.2026, ב-Flash: בהוראות למטלה ובהודעה להורים כל העובדות נשארו, והאזהרה עברה להתחלה'
- '14.11.2026, 10 בקשות ב-3 מודלים: כל 25 העובדות בעבודת חקר נשארו, ושיר של ביאליק נשאר אות באות'
- '100 בקשות דרך ה-API, מול תשובה בלי הסקיל: 85 עברו בגרסה 1.2.0. בגרסה 1.3.0 עברו 31 מתוך 43, מול 21 קודם'
- 'מגרסה 1.2.0 התוכן לא מתפשט: משוואות ברמה של כיתה ח'', ומערך עם מטרות ותשובות'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 5 מתוך 25 קיבלו 7 ומעלה, ממוצע 5.0. בגרסה הקודמת, באותו יום: 6. אלה בקשות קשות יותר מבעבר: פרטים אישיים, פסוקים וטקסט חסר'
limitations:
- דף עבודה מבקשה קצרה יוצא לפעמים רדוד יותר מבלי הסקיל (4 מתוך 8)
- Gemini עדיין טועה לפעמים בעובדה
- כדאי לכתוב @simple-language. בלי @ הסקיל רץ לבד רק ב-Hydrogen 4 (לא ב-Flash וב-Argon)
- ב-Argon 4 השיחה נעלמה בלי תשובה, גם בלי הסקיל
- אין STE רשמי בעברית. הכללים הם התאמה שלי
- רוב הבדיקות רצו דרך ה-API, לא באפליקציה
simple: 'נותנים לג''מיני טקסט, והוא כותב אותו מחדש בשפה פשוטה: משפטים קצרים ומילים רגילות. כל העובדות נשארות.'
uses:
- when: 'מכתב להורים'
  ask: 'תכתוב את המכתב הזה להורים בשפה פשוטה. [כאן מדביקים את המכתב]'
  get: 'מכתב קצר וברור, ורשימה קצרה של מה השתנה.'
- when: 'הוראות למשימה'
  ask: 'תכתוב בשפה פשוטה את ההוראות של המשימה לכיתה ו''. [כאן מדביקים את ההוראות]'
  get: 'הוראות במשפטים קצרים, פעולה אחת בכל משפט.'
- when: 'הודעה חדשה'
  ask: 'תכתוב בשפה פשוטה הודעה לתלמידים על מועד ב'' במתמטיקה: יום שלישי, 10:00, בחדר 12.'
  get: 'הודעה מוכנה להעתקה, עם כל הפרטים.'
story: |
  בשנות ה-80 חברות המטוסים באירופה גילו בעיה. טכנאים בכל העולם קראו ספרי תחזוקה באנגלית, והרבה מהם לא דוברי אנגלית. משפט אחד לא ברור יכול לגרום לטעות במטוס.

  לכן הן כתבו שפה מיוחדת, STE. יש בה רק כ-900 מילים מאושרות, לכל מילה יש משמעות אחת, ובכל משפט יש פעולה אחת. הסקיל לוקח את אותם כללים לדף עבודה ולמכתב להורים.
