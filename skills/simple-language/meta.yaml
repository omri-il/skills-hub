name: simple-language
title: שפה פשוטה וברורה (STE)
version: 1.2.0
updated: 2026-11-14
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שכותב הוראות, דפי עבודה או מכתבים להורים
fits: [רב-מלל]
problem: 'הוראות למטלה ומכתבים להורים נכתבים הרבה פעמים במשפטים ארוכים ובשפה גבוהה ("יש לבצע", "בהתאם לכך"). תלמידים עם לקויות למידה, תלמידים עולים והורים שעברית היא לא שפת האם שלהם מפספסים דרישות ושואלים שוב.

  '
benefit: 'ההודעה מובנת מהקריאה הראשונה. פחות תלמידים והורים חוזרים לשאול מה צריך לעשות.'
what_it_does: 'כותב בשפה פשוטה לפי כללי STE, שפה מבוקרת מתעשיית התעופה, בהתאמה לעברית: משפטים קצרים, פעולה אחת בכל משפט, הוראות בשם פועל (בלי לבחור מגדר) ובלי מילים גבוהות. אפשר להדביק טקסט ולקבל אותו משוכתב, עם כל העובדות של המקור ורשימה קצרה של מה ששונה. אפשר גם לבקש חומר חדש לתלמידים או להורים: דף עבודה, מערך, מכתב. הוא מפשט את השפה ולא את התוכן: אותה רמה של הכיתה, ואותה כמות של שאלות ותרגילים.

  '
output: טקסט משוכתב או חומר חדש מוכן להעתקה. בשכתוב, גם רשימה קצרה של השינויים ושאלה אם משהו במקור לא ברור
requires: []
role: main
tested:
- 'נבדק ב-Gemini Flash ב-12.11.2026, על 2 טקסטים: הוראות למטלה והודעת תשלום להורים. בשניהם כל העובדות של המקור נשארו, האזהרה עברה לתחילת הטקסט, ההוראות נכתבו בשם פועל, והתשובה כללה את החלק "מה שיניתי"'
- בהודעה להורים הסקיל גם שאל שאלה אחת על פרט חסר במקור (השם של מערכת התשלומים), כמו שכתוב בכללים
- 'נבדק ב-14.11.2026 ב-10 בקשות, ב-Hydrogen 4, ב-3.1 Pro וב-3.5 Flash-Lite. שכתוב של הוראות ארוכות לעבודת חקר: כל 25 העובדות נשארו. שכתוב של דף עבודה עם שיר של ביאליק: השיר נשאר אות באות, וכל 6 השאלות נשארו'
- 'בגרסה 1.1.0 הסקיל פישט גם את התוכן: לתלמידים עם לקויות למידה בכיתה ח׳ הוא נתן רק משוואות של צעד אחד (x+3=8), ומערך שיעור יצא 172 מילים בלי מטרות ובלי תשובות. בגרסה 1.2.0, באותן בקשות: משוואות של כיתה ח׳ (עד 6x+3=2x+15), ומערך של 350 מילים עם מטרות, כרטיסיות, דף משימה ב-3 רמות ותשובות למורה'
- 'בגרסה 1.2.0 מכתב להורים על טיול יצא עם טופס אישור לחתימה, ודף הוראות לראיון עם סבא או סבתא יצא עם 13 שאלות מוכנות ולא רק רשימת נושאים'
- 'שאלה קצרה לשימוש אישי קיבלה תשובה קצרה (64 מילים). כשביקשתי הסבר לעומק, התשובה הייתה מלאה (288 מילים, עם טבלת השוואה)'
limitations:
- אין גרסה רשמית של STE בעברית. הכללים כאן הם התאמה שלי לאותם עקרונות
- 'כדאי לכתוב @simple-language בתחילת הבקשה. ב-12.11.2026 הסקיל לא נדלק מעצמו ב-Gemini Flash וב-Argon. ב-14.11.2026 הוא נדלק מעצמו ב-Hydrogen 4 בבקשה "תכתוב לי בשפה פשוטה דף הוראות", 2 פעמים מתוך 2. במודלים האחרים לא בדקתי בלי @'
- 'ב-Argon 4 הסקיל לא עובד: ב-14.11.2026 השיחה נעלמה בלי תשובה 2 פעמים. גם בלי הסקיל Argon נכשל באותה צורה, אז זאת תקלה של Argon'
- 'מערך שיעור ב-Pro יוצא קצר יותר מבלי הסקיל: 350 מילים, מול 537 מילים בבקשה בלי הסקיל (שם הופעל סקיל אחר למערכי שיעור)'
- 'ב-Flash-Lite, בשכתוב מכתב להורים, הסקיל קיצר את השם "גב׳ מיכל לוי" ל"מיכל" ולא כתב את החלק "מה שיניתי" (14.11.2026, גרסה 1.1.0). לא בדקתי שוב בגרסה 1.2.0'
- 'במשוואות, Gemini העתיק 2 דוגמאות פתורות מתוך הדוגמה שבסקיל. התוכן נכון, אבל זה לא חומר חדש'
- 'הבקשה "תכין בקנבס" הובנה כ-Canva ולא כ-Canvas, וחלון Canvas לא נפתח (14.11.2026)'
- לא נבדק ב-Claude וב-ChatGPT
