name: simple-language
title: שפה פשוטה וברורה (STE)
version: 1.1.0
updated: 2026-11-12
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שכותב הוראות, דפי עבודה או מכתבים להורים
fits: [רב-מלל]
problem: 'הוראות למטלה ומכתבים להורים נכתבים הרבה פעמים במשפטים ארוכים ובשפה גבוהה ("יש לבצע", "בהתאם לכך"). תלמידים עם לקויות למידה, תלמידים עולים והורים שעברית היא לא שפת האם שלהם מפספסים דרישות ושואלים שוב.

  '
benefit: 'ההודעה מובנת מהקריאה הראשונה. פחות תלמידים והורים חוזרים לשאול מה צריך לעשות.'
what_it_does: 'כותב בשפה פשוטה לפי כללי STE, שפה מבוקרת מתעשיית התעופה, בהתאמה לעברית: משפטים קצרים, פעולה אחת בכל משפט, הוראות בשם פועל (בלי לבחור מגדר) ובלי מילים גבוהות. אפשר לבקש ממנו לענות כך, או להדביק טקסט ולקבל אותו משוכתב, עם כל העובדות של המקור ורשימה קצרה של מה ששונה.

  '
output: טקסט משוכתב מוכן להעתקה, רשימה קצרה של השינויים, ושאלה אם משהו במקור לא ברור
requires: []
role: main
tested:
- 'נבדק ב-Gemini Flash ב-12.11.2026, על 2 טקסטים: הוראות למטלה והודעת תשלום להורים. בשניהם כל העובדות של המקור נשארו, האזהרה עברה לתחילת הטקסט, ההוראות נכתבו בשם פועל, והתשובה כללה את החלק "מה שיניתי"'
- בהודעה להורים הסקיל גם שאל שאלה אחת על פרט חסר במקור (השם של מערכת התשלומים), כמו שכתוב בכללים
limitations:
- אין גרסה רשמית של STE בעברית. הכללים כאן הם התאמה שלי לאותם עקרונות
- 'צריך לכתוב @simple-language בתחילת הבקשה. ב-12.11.2026 הסקיל לא נדלק מעצמו ב-Gemini Flash וב-Argon, לא מ"תפשט את ההוראות האלה", לא מ"תכתוב בשפה פשוטה" ולא מהמילה "STE". באותה בדיקה גם סקיל אחר שמותקן באותו חשבון לא נדלק לבד, אז זאת התנהגות של Gemini ולא בעיה של הסקיל הזה'
- 'לא נבדק ב-Gemini Pro: ב-3 ניסיונות Pro נתקע ולא החזיר תשובה (12.11.2026)'
- לא נבדק ב-Claude וב-ChatGPT
