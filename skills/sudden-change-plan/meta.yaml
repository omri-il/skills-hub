name: sudden-change-plan
title: 'שינוי פתאומי: תוכנית ל-24 שעות'
version: 1.0.0
updated: 2026-11-21
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מנהלים וסגני מנהלים שצריכים להגיב לשינוי מהיום למחר
who:
- מנהלים
problem: בשמונה בערב מגיעה הנחיה חדשה, ועד הבוקר צריך להחליט מה משתנה ולהודיע לכולם בסדר הנכון.
benefit: תוכנית ו-3 הודעות מוכנות לצוות, להורים ולתלמידים, עם רשימה של מה שעוד לא ידוע.
what_it_does: 'מקבל הנחיה חדשה או תיאור של שינוי, וכותב: מה משתנה מחר, למי להודיע ובאיזה סדר, הודעה לצוות, להורים ולתלמידים, ורשימה של מה שעוד לא ידוע ומי יכול לענות. רק מה שכתוב בהנחיה.'
output: תוכנית קצרה, 3 הודעות מוכנות, ורשימת "עוד לא ידוע"
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מנהלים וסגני מנהלים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: בגרסה 1.0.0, 16 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.9. בסבב הקודם באותו יום: 15 מתוך 25'
- 'אותן 25 בקשות ב-Gemini Pro (gemini-3.1-pro-preview): 19 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.2'
- 'בהנחיה על מצב ביטחוני, ג''מיני לא כתב הוראות אזעקה מהזיכרון. הוא כתב "לפעול לפי הנחיות פיקוד העורף", וזמן ההגעה למרחב מוגן עבר ל"עוד לא ידוע"'
- 'כשהמנהלת ביקשה שלא לשתף למה מורה נעדרת, אף הודעה לא כתבה את הסיבה'
limitations:
- 'בבקשה על חפץ חשוד, גם Flash וגם Pro הוסיפו הוראה לצוות שהמשטרה לא נתנה ("להישאר במקום"). בהודעה על אירוע ביטחוני, לבדוק כל משפט מול ההנחיה'
- 'לפעמים נכנסת להודעה משימה, שעה או אחראי שלא כתבתם, כמו "המורים יגיעו ב-7:45" או "המחנכים ישלחו קישורים"'
- 'לפעמים מה שעוד לא החלטתם נכתב בהודעה כהחלטה, כמו "יום המגמות נדחה"'
- 'הבקשות נכתבו לבדיקה. לא נבדק עוד עם מנהל אמיתי באפליקציה של ג''מיני'
simple: 'מדביקים לג''מיני את ההנחיה החדשה, או כותבים מה השתנה. הוא כותב מה עושים מחר, ו-3 הודעות מוכנות לצוות, להורים ולתלמידים.'
uses:
- when: 'הנחיה חדשה בערב'
  ask: 'הגיעה הנחיה חדשה. מה עושים מחר? [כאן מדביקים את ההנחיה]'
  get: 'מה משתנה, הסדר, 3 הודעות, ומה עוד לא ידוע.'
- when: 'מורה נעדר לזמן ארוך'
  ask: 'המורה ל[מקצוע] לא תלמד חודש. [כאן כותבים מי מחליף ומה ידוע]'
  get: 'הודעה להורים בלי פרטים אישיים, ותוכנית לצוות.'
- when: 'רק הודעה להורים'
  ask: 'רק הודעה להורים על השינוי. [כאן כותבים מה השתנה]'
  get: 'הודעה עד 80 מילים, ומה עוד לא ידוע.'
fixes:
  source: 'מתוך 25 בקשות של מנהלים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 21.11.2026.'
  list:
  - without: 'במצב ביטחוני כותב הוראות בטיחות מהזיכרון, שלא היו בהנחיה. כך היה בשתי הבקשות על מצב ביטחוני.'
    quote: 'יש לשכב על הקרקע ולהגן על הראש באמצעות הידיים'
    with: 'לא כתב הוראות אזעקה מהזיכרון. כתב "לפעול לפי הנחיות פיקוד העורף", וזמן ההגעה למרחב מוגן עבר ל"עוד לא ידוע".'
  - without: 'כשיש 2 הנחיות סותרות, בוחר לבד איזו נכונה וכותב להורים שבית הספר סגור.'
    quote: 'הנחיית ראש המועצה / הרשות המקומית גוברת'
    with: 'לא בוחר צד. ההודעה להורים אומרת שבודקים מה נכון ו"נעדכן עד [שעה]", והסתירה היא השורה הראשונה ב"עוד לא ידוע".'
  - without: 'כותב הבטחות שאין להן בסיס בהנחיה, גם כי המנהלת ביקשה: שזה לא ישפיע על הבגרויות, שהכסף של הטיול נשמר.'
    quote: 'לא ישפיע בכל דרך שהיא על לוח הבגרויות'
    with: 'לא כותב את ההבטחה. השאלה עוברת ל"עוד לא ידוע", ובסוף יש שורה שאומרת מה לא נכתב ולמה.'
  - without: 'כותב להורים למה המורה נעדרת, גם כשהיא ביקשה שלא לשתף.'
    quote: 'מיכל, יוצאת לחופשה רפואית ממושכת'
    with: 'אין סיבה באף הודעה. רק שהמורה לא תלמד בתקופה הקרובה ומי מחליפה אותה.'
  also: 'לשלוח הודעה לצוות לפני ההורים ולפני התלמידים, ולשמור על טון רגוע בלי סימני קריאה כפולים.'
