name: ai-resistant-task
title: משימה שלא מעתיקים מ‑AI
version: 1.3.0
updated: 2026-11-18
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים, כיתות ד'-י"ב
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: תלמידים מדביקים את המשימה בצ'אט ומגישים מה שיצא. הציון כבר לא אומר מה הם יודעים.
benefit: משימה שלא משתלם להעתיק, עם מחוון ושאלות לשיחה עם התלמיד.
what_it_does: 'בודק מה AI יענה על המשימה, ומוסיף לה 3-4 "מנעולים": עוגן במה שקרה בכיתה, הגשה בשלבים, שיחה קצרה עם התלמיד, ביקורת על תשובה של AI ועוד. שואל באיזו מערכת מגישים, ומחזיר משימה מוכנה ומדריך למורה.'
output: 'בצ''אט: ניסוי ההעתקה, המשימה לתלמידים ומדריך למורה עם מחוון'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 5.3 בגרסה 1.2.0. עם 3.1 Pro: 6.2'
- 'בלי @, ב-Hydrogen 4 (14.11.2026): ג''מיני הפעיל את הסקיל לבד, ומסר משימה של 3 שלבים עם מחוון, 4 שאלות לשיחה ומה עדיין אפשר להעתיק'
- 'משימה קיימת בהיסטוריה, עם @: ג''מיני הראה שכל חלקיה קלים להעתקה, ובנה משימה חדשה עם תרשים ביד ושיחה עם תלמידים בהגרלה'
- '10 בדיקות ב-Flash-Lite, ב-Hydrogen 4 וב-3.1 Pro: עם @ הסקיל רץ ב-4 מתוך 4, עם כל החלקים'
- 'טקסט עם טעויות שתולות: מספר הטעויות בטקסט ובמפתח היה זהה (2 מתוך 2)'
- 'משימה שכבר קשה להעתקה (ראיון עם סבא או סבתא): ג''מיני אמר שהיא טובה, והציע רק 2 שינויים'
- '"AI אסור לגמרי": הכתיבה עצמה נעשית בכיתה, בלי מסכים'
- 'שאלה על גלאי AI: 2 משפטים למה לא לסמוך עליו, בלי המלצה על כלי'
limitations:
- גרסה 1.3.0 (שואלת באיזו מערכת מגישים) עוד לא נבדקה בג'מיני
- במצב המהיר לפעמים מספר הטעויות בטקסט לא תואם למפתח, או שנוסחה יוצאת ב-LaTeX. לבדוק את הטקסט לפני שנותנים לתלמידים
- בלי @ הסקיל לא תמיד רץ (0 מתוך 2 ב-Hydrogen 4 עם העמקה). כדאי לכתוב @ai-resistant-task
- ב-3.1 Pro ריצה אחת נתקעה יותר מ-3 דקות
- לא נבדק בחשבון של בית ספר וב-Classroom
- אין משימה שאי אפשר להעתיק. הסקיל אומר בכל משימה מה עדיין אפשר
