name: ai-resistant-task
title: משימה שלא מעתיקים מ‑AI
version: 1.1.0
updated: 2026-11-14
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים בכל מקצוע, מכיתה ד' עד י"ב
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'תלמידים מדביקים את המשימה בצ''אט ומגישים מה שיצא. העבודה נראית טובה, אבל לא ברור מי עשה אותה, והציון כבר לא אומר מה התלמיד יודע.

  '
benefit: 'משימה שבה ההעתקה לא משתלמת, עם מחוון ושאלות לשיחה עם התלמיד, בלי לחפש לבד דרכים לבדוק מי עשה את העבודה.'
what_it_does: 'בודק מה תלמיד יקבל אם ידביק את המשימה ב-AI, ומשנה אותה עם 3-4 "מנעולים": עוגן במה שקרה בכיתה, הגשה בשלבים, היסטוריית גרסאות, שיחה קצרה עם התלמיד, ביקורת על תשובה של AI עם טעויות, ועוד. מחזיר משימה מוכנה ל-Classroom ומדריך למורה עם מחוון של תהליך, תוצר והגנה.

  '
output: 'בצ''אט: ניסוי ההעתקה, המשימה לתלמידים מוכנה להדבקה, ומדריך למורה עם מחוון ושאלות לשיחה'
role: main
tested:
- 'בקשה בלי @ ("נמאס לי שהתלמידים מעתיקים שיעורי בית מ-ChatGPT... משימה על פוטוסינתזה"), Gemini Hydrogen 4, 14.11.2026: ג''מיני הפעיל את הסקיל לבד, שאל את 5 השאלות בהודעה אחת, ואחרי "כיתה ח'', תחליט אתה" מסר משימה של 3 שלבים: מציאת טעויות בתשובה של AI, צילום עלה בשמש ועלה בצל בבית, ותרשים ביד בכיתה. במדריך היו מחוון, 4 שאלות לשיחה, מה לבדוק בהיסטוריית הגרסאות, זמן בדיקה לכיתה של 30, ומה עדיין אפשר להעתיק'
- 'עם @, משימה קיימת להיסטוריה לכיתה ט'' ("עבודה של עמוד וחצי על הגורמים למלחמת העולם הראשונה"), Gemini Hydrogen 4, 14.11.2026: ג''מיני שאל רק 3 שאלות, כי הכיתה והמשימה כבר היו בבקשה. אחרי "תחליט אתה" הוא הראה שכל חלקי המשימה המקורית קלים להעתקה, ובנה משימה עם תרשים ביד, עמדה מנומקת מול תשובה של AI, ושיחה עם תלמידים בהגרלה'
- '10 בדיקות נוספות ב-14.11.2026, בשלושה מצבים של ג''מיני: Flash-Lite (מהיר), Hydrogen 4 עם העמקה גבוהה (חשיבה) ו-3.1 Pro. עם @ הסקיל רץ ב-4 מתוך 4. בכל ריצה היו ניסוי העתקה (כשהייתה משימה קיימת), משימה לתלמידים, מחוון, שאלות לשיחה, ומה עדיין אפשר להעתיק'
- 'טקסט עם טעויות שתולות (מערכת החיסון ב-Flash-Lite, מטוטלת ב-Pro): בשתי הריצות מספר הטעויות בטקסט, בהוראה לתלמידים ובמפתח היה זהה, וכל טעות הייתה במשפט נפרד'
- 'משימה שכבר קשה להעתקה (ראיון עם סבא או סבתא והצגה בעל פה, Hydrogen 4): ג''מיני אמר שהמשימה כבר טובה והציע רק 2 שינויים קטנים, ובנוסף חלופה לתלמיד שאין לו סבא או סבתא לראיין'
- '"AI אסור לגמרי" (תנ"ך, Hydrogen 4 עם העמקה גבוהה): בלי מנעול של ביקורת על AI, והכתיבה עצמה בכיתה בלי מסכים'
- 'אחרי תיקון התיאור בגרסה 1.1.0: רכזת ששאלה על גלאי AI (Pro, בלי @) קיבלה 2 משפטים למה לא לסמוך עליו, בלי המלצה על כלי, ואז את השאלות של הסקיל. בקשה על "הנסיך הקטן" (Flash-Lite, בלי @) הפעילה את הסקיל לבד'
limitations:
- 'בלי @ ג''מיני לא תמיד מפעיל את הסקיל. בגרסה 1.0.0 הוא רץ לבד ב-2 מתוך 6 בקשות. ריצה בלי @ ב-Pro המליצה על גלאי AI בשמם. שיפרתי את התיאור בגרסה 1.1.0, ושתי הבקשות שנכשלו עבדו, אבל זה עוד לא נבדק בהרבה ריצות. כדאי לכתוב @ai-resistant-task'
- 'ב-3.1 Pro ריצה אחת נתקעה יותר מ-3 דקות בלי תשובה. בריצה השנייה של אותה בקשה התשובה הגיעה אחרי 2 דקות'
- 'ב-Flash-Lite, משימה במתמטיקה קיבלה "השוואה לתשובה של AI" בתור מנעול של ביקורת על AI, ומילה אחת יצאה עם אות לא עברית. בגרסה 1.1.0 הוספתי כלל שמבדיל בין השניים'
- 'ב-Pro, כשהמורה כתב ש-AI אסור לגמרי, הכתיבה עצמה נשארה בבית. בגרסה 1.1.0 הכלל אומר במפורש שהכתיבה בכיתה'
- נבדק בחשבון Gmail רגיל. לא נבדק בחשבון של בית ספר ולא ב-Classroom
- אין משימה שאי אפשר להעתיק. הסקיל מקשה על ההעתקה, ואומר בכל משימה מה עדיין אפשר להעתיק
