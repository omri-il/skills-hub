name: red-team
title: צוות אדום לרעיונות
version: 1.0.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה, רכז או מנהל שעומד להתחיל משהו חדש
who: [מורים, רכזים, מנהלים]
problem: 'כשמביאים לג''מיני רעיון חדש, הוא מתלהב מכל רעיון: "רעיון מצוין!". מקבלים מחמאות במקום לגלות מראש שהפעילות לא תיכנס בשיעור, שהציוד לא יעבוד, או שההורים יתלוננו.

  '
what_it_does: 'מבקר כל רעיון כמו צוות אדום לפני מבצע: מה חזק בו, איפה הוא ייכשל בתרחישים מוחשיים (זמן, תלמידים, ציוד, הורים, פרטיות, מדידת הצלחה), שאלה קשה אחת שצריך לענות עליה, ושניים-שלושה שינויים קטנים שמתקנים את הבעיות החמורות.

  '
output: ביקורת מסודרת בצ'אט, בחמישה חלקים קצרים
requires: []
role: main
tested:
- עוד לא נבדק בגרסה הזו. גרסה ראשונה שלו נבנתה עם מורים בסדנה ב-19.10.2026
limitations:
- עוד לא נבדק אם ג'מיני מפעיל אותו לבד כשמציעים רעיון, בלי לכתוב "צוות אדום"
