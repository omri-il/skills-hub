name: red-team
title: צוות אדום לרעיונות
version: 1.1.1
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, רכזים ומנהלים
who:
- מורים
- רכזים
- מנהלים
fits:
- רב-מלל
problem: 'ג''מיני מתלהב מכל רעיון: "רעיון מצוין!". מקבלים מחמאות במקום ביקורת.'
benefit: מגלים את הבעיות ברעיון לפני השיעור, ולא מול הכיתה.
what_it_does: 'מבקר את הרעיון: מה חזק בו, איפה הוא ייכשל (זמן, ציוד, הורים, פרטיות), שאלה קשה אחת, ו-2-3 תיקונים קטנים.'
output: ביקורת בצ'אט, ב-5 חלקים קצרים
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 5.4, ו-4 מתוך 25 קיבלו 7 ומעלה. בגרסה 1.1.0, אחרי 2 סבבי תיקון: 5.8, ו-7 מתוך 25'
- הגרסה הראשונה נבנתה עם מורים בסדנה (19.10.2026)
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 8 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.0'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- 'החלק החלש: חוזר על שמות תלמידים ליד ציונים, תרופות ואבחנות, ולפעמים ממציא שמות של שירים'
- לא נבדק אם הוא רץ לבד, בלי לכתוב "צוות אדום"
simple: 'מספרים לג''מיני רעיון, והוא מבקר אותו במקום להחמיא. מקבלים מה חזק, איפה זה ייכשל, ואיך לתקן.'
uses:
- when: 'רעיון לשיעור'
  ask: 'אני רוצה שהתלמידים יצלמו סרטון בטלפון במקום מבחן. מה יכול להשתבש?'
  get: 'מה חזק ברעיון, איפה הוא ייכשל (זמן, ציוד, הורים, פרטיות), ו-2-3 תיקונים.'
- when: 'תוכנית לבית הספר'
  ask: 'אנחנו רוצים לבטל שיעורי בית בשכבת ז''. תבקר את התוכנית.'
  get: 'ביקורת קצרה, ושאלה קשה אחת לחשוב עליה לפני שמתחילים.'
- when: 'לפני ישיבת צוות'
  ask: 'מחר אני מציג לצוות רעיון ליום שיא בנושא AI. תבקר אותו.'
  get: 'ביקורת ב-5 חלקים קצרים, כדי להגיע לישיבה מוכנים.'
hidden: true
story: |
  בחיל האוויר, כשטייסים מתכננים מבצע, יש צוות אדום. התפקיד שלו הוא למצוא חורים בתוכנית: מה לא חשבו עליו, ואיפה משהו יכול להשתבש.

  ג'מיני עושה בדיוק את ההפך, ומתלהב מכל רעיון. שאלתי אותו על קולפן אבוקדו שאומר אם האבוקדו בשל, והוא מיד בנה לי רשימת רכיבים. הסקיל הזה הופך את ג'מיני לצוות האדום שלכם.
