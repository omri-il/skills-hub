name: create-elementary-math-practice
title: דפי תרגול במתמטיקה ליסודי (א'-ו'), עם צורות וזוויות
version: 1.2.1
updated: 2026-11-19
subjects:
- מתמטיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ומחנכים, כיתות א'-ו'
who:
- מורים
- מחנכים
problem: דף תרגול טוב ליסודי לוקח זמן. ג'מיני בלי הנחיות שובר תרגילים במאונך ושברים, והופך סימני גדול-קטן.
benefit: דף Word מוכן להדפסה, עם תרגילים, שברים וציורים נכונים, ומפתח שנבדק בקוד.
what_it_does: 'יוצר דף בחשבון לפי כיתה ונושא: תרגילים במאונך, שברים, בעיות מילוליות ושאלת אתגר. מצייר צורות, זוויות למדידה, ישר מספרים ושעון, והמספרים תמיד מתאימים לציור. כל תשובה נבדקת בקוד. אפשר דף ב-3 רמות, וניקוד.'
output: קובץ Word עם דף לתלמיד (או 3 רמות) ומפתח תשובות
role: main
category: עזרי הוראה
tested:
- 'ציורים (19.11.2026): 25 בקשות דרך ה-API, gemini-3.5-flash. ב-25 מתוך 25 נוצר קובץ, ואף ציור לא סתר את המספרים. Claude נתן ציון מ-0 עד 10: ממוצע 6.8. עם gemini-4-hydrogen: 8.6'
- 'Claude פתח 10 קבצים ב-Word: מלבן של 6 ס"מ יצא 6.03 ס"מ, ושעונים, זוויות ושברים מוצגים נכון'
- בבדיקה הראשונה 4 ציורים גילו את התשובה. הוספתי כלל, ובבדיקה החוזרת לא נמצא ציור כזה
- 'גרסה 1.0.0, בלי ציורים: ממוצע 7.1 ב-Flash ו-8.4 ב-Hydrogen. תרגילים במאונך וניקוד מוצגים נכון מימין לשמאל'
- 'בקשה בלי כיתה: ג''מיני שאל על הכיתה והנושא קודם'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), בגרסה 1.2.1, כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 15 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.5. בגרסה שלפני 19.11, באותו יום: 12'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
- 'בגרסה 1.2.0, כשביקשו דף בשפה פשוטה וכל 25 הסקילים מותקנים, ההוראות נשארו "פתרו" (2 מתוך 2). בגרסה 1.2.1 ההוראות בשם פועל ("לפתור"), 4 מתוך 4 דרך ה-API'
- 'באפליקציה של Gemini, כשכל 25 הסקילים מותקנים (19.11.2026, מצב Hydrogen Thinking): דף בשפה פשוטה יצא כקובץ Word, עם 17 הוראות בשם פועל ובלי "פתרו"'
- '25 בקשות, Flash מול Pro (21.11.2026, Claude קרא את קובץ ה-Word, ציון דרך ה-API): ב-Flash 16 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.8. ב-Pro (gemini-3.1-pro-preview): 12 מתוך 25, ממוצע 6.6. Pro לא עדיף כאן'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @. הציורים צריכים matplotlib, ובאפליקציה לא בדקתי
- מדידה בסרגל נכונה רק בהדפסה בגודל 100%
- דף של 8 שאלות עם ציורים יוצא 5 עד 9 עמודים
- במצב המהיר לפעמים יש טעות בשאלת האתגר (3 מתוך 25), ופעם אחת התשובות הופיעו בדף לתלמיד. לעבור על הדף לפני ההדפסה
- לא מצייר גופים, דיאגרמות, סימטריה ומערכת צירים. חילוק ארוך בלי "הבית"
simple: 'אומרים לג''מיני כיתה ונושא בחשבון. הוא יוצר דף תרגול בקובץ Word, עם ציורים ומפתח תשובות שנבדק.'
uses:
- when: 'דף לשיעור'
  ask: 'דף תרגול בשברים לכיתה ד'', כקובץ Word.'
  get: 'דף מוכן להדפסה עם תרגילים, בעיות מילוליות ושאלת אתגר, ומפתח.'
- when: 'כיתה עם רמות שונות'
  ask: 'דף בכפל במאונך לכיתה ג'', ב-3 רמות.'
  get: '3 דפים באותו נושא, אחד לכל רמה.'
- when: 'גאומטריה'
  ask: 'דף על מדידת זוויות לכיתה ה'', עם ציורים.'
  get: 'דף עם זוויות מצוירות. המספרים מתאימים לציור.'
fixes:
  source: 'מתוך 25 בקשות של מורים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 21.11.2026.'
  list:
  - without: 'אין קובץ Word. מקבלים טקסט בצ''אט ונאמר לכם להעתיק אותו ל-Word לבד. ב-25 מתוך 25 בקשות.'
    quote: 'בעיצוב נקי ומסודר שנוח להעתיק ל-Word ולהדפיס'
    with: 'נוצר קובץ Word מוכן להדפסה, עם דף לתלמיד ומפתח תשובות בסוף.'
  - without: 'צורות ומלבנים מצוירים בסימני מקלדת. המידות זזות מחוץ לצורה והציור מתפרק. ב-5 מתוך 25 בקשות.'
    quote: 'במלבן הבא נתון השטח. מצאו את אורך הצלע החסרה ואת ההיקף'
    with: 'הצורה מצוירת כתמונה אמיתית בקובץ, והמידות כתובות ליד הצלעות ומתאימות לציור.'
  - without: 'ביקשתם לזהות שבר או שעה מתוך ציור, ואין ציור. במקומו כתוב במילים מה רואים, וכך התשובה כבר כתובה. ב-3 מתוך 25 בקשות.'
    quote: 'עיגול מחולק ל-4 חלקים שווים, 3 חלקים צבועים'
    with: 'יש ציור אמיתי של עיגול, פס או שעון, והתלמידים צריכים להסתכל עליו כדי לענות.'
  also: 'לבנות תרגילים במאונך ושברים שמוצגים נכון מימין לשמאל, ולבדוק בקוד כל תשובה במפתח.'
hidden: true
