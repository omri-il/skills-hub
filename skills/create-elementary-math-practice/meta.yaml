name: create-elementary-math-practice
title: דפי תרגול במתמטיקה ליסודי (א'-ו')
version: 1.1.0
updated: 2026-11-19
subjects:
- מתמטיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים למתמטיקה ומחנכים בבית הספר היסודי, כיתות א' עד ו'
who: [מורים, מחנכים]
problem: 'דף תרגול טוב ליסודי לוקח זמן: מספרים שמתאימים לכיתה, תרגילים במאונך, שברים, בעיות מילוליות בשפה של ילדים ומקום לכתוב. כשמבקשים את זה מג''מיני בלי הנחיות, התרגילים במאונך והשברים נשברים בקובץ, סימני "גדול מ-" ו"קטן מ-" מתהפכים בדף בעברית, וחידות יוצאות עם יותר מתשובה אחת.

  '
benefit: 'קובץ Word מוכן להדפסה, עם אותיות גדולות, תרגילים במאונך, שברים וציורים שנראים נכון, ומפתח תשובות שנבדק בקוד.'
what_it_does: 'יוצר דף עבודה בחשבון לפי כיתה ונושא, במספרים שמתאימים לתוכנית הלימודים של הכיתה: תרגילים במאונך, שברים ומספרים מעורבים, השלמה עם משבצת, השוואה, בעיות מילוליות מהחיים של ילדים, "מצאו את הטעות" ושאלת אתגר. מצייר בתוך הדף צורות עם מידות (מלבן, משולש, מצולעים, צורות מורכבות, עיגול), זוויות בגודל מדויק למדידה במד זווית, דף משבצות, ישר מספרים, שעון ומודל שבר. המספרים בציור תמיד מתאימים לאורכים ולזוויות שבו. כל תשובה נבדקת בקוד, וחידות נבדקות שיש להן תשובה אחת. לכיתה הטרוגנית: אותו דף ב-3 רמות ("דף 1", "דף 2", "דף 3", בלי שמות של רמות), עם אותו מספור לבדיקה משותפת. ניקוד לפי בקשה.

  '
output: קובץ Word עם דף לתלמיד (או 3 דפים) ומפתח תשובות בעמוד נפרד, שנפתח גם ב-Google Docs
role: main
tested:
- 'ציורים, בדיקה דרך ה-API של Gemini, לא באפליקציה (19.11.2026): 25 בקשות של מורים, 20 מהן על צורות, זוויות, משבצות, ישר מספרים, שעון ושברים, עם gemini-3.5-flash. ב-25 מתוך 25 נוצר קובץ Word עם הציורים, והקוד לא מצא אף ציור שלא מתאים למספרים שלו. Claude נתן לכל דף ציון מ-0 עד 10: ממוצע 6.8, ו-18 מתוך 25 קיבלו 7 ומעלה. הציונים הנמוכים באו בעיקר משאלות אתגר ומניסוח, לא מהציורים'
- 'אותה בדיקה עם gemini-4-hydrogen (10 בקשות): ממוצע 8.6, כל 10 קיבלו 7 ומעלה'
- 'Claude פתח 10 קבצים ב-Word וראה אותם כתמונה: מלבן של 6 ס"מ יצא 6.03 ס"מ בקובץ PDF, ושעונים, זוויות למדידה, משבצות של 1 ס"מ, ישר מספרים עם שברים ועיגולי שברים מוצגים נכון'
- 'בבדיקה הראשונה, ב-4 דפים הציור גילה את התשובה: זווית שהילד צריך למצוא הייתה כתובה בציור, או שקפיצות על ישר המספרים הגיעו עד התוצאה. הוספתי כלל, 6 בקשות רצו שוב, ולא נמצא ציור כזה'
- 'גרסה 1.0.0, בלי ציורים (19.11.2026): 25 בקשות עם gemini-3.5-flash, ממוצע 7.1, ו-22 מתוך 25 קיבלו 7 ומעלה. עם gemini-4-hydrogen (10 בקשות, כולל 3 רמות וניקוד): ממוצע 8.4'
- 'Claude פתח 4 קבצים ב-Word וראה אותם כתמונה: תרגילים במאונך עם קו, שברים, משבצות להשלמה וניקוד מוצגים נכון מימין לשמאל'
- 'בקשה בלי כיתה ("דף עבודה בחשבון"): ג''מיני שאל על הכיתה והנושא לפני שבנה את הדף'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @. הציורים צריכים את matplotlib בסביבת הקוד. בבדיקה דרך ה-API הוא קיים, ובאפליקציה לא בדקתי'
- 'מדידה בסרגל יוצאת נכונה רק כשמדפיסים בגודל אמיתי (100%). מדפסת עם "התאמה לעמוד" מקטינה את הציור קצת'
- 'ציורים תופסים מקום: בבדיקה, דף של 8 שאלות עם ציורים יצא 5 עד 9 עמודים, כולל מפתח התשובות'
- 'במצב המהיר (Flash) יש לפעמים טעות בשאלת האתגר: חידה בלי תשובה, או עם 2 תשובות כשבמפתח יש אחת (3 מתוך 25 דפים בבדיקה של הציורים). כדאי לפתור את שאלת האתגר לפני ההדפסה, או לעבוד במצב Thinking'
- 'במצב המהיר Gemini כותב לפעמים 2 הוראות בשאלה אחת. פעם אחת הוא כתב את התשובות בדף לתלמיד, מתחת לציורים של שברים'
- 'הסקיל לא מצייר תיבה, קובייה וגופים, דיאגרמות של נתונים, סימטריה ומערכת צירים. שאלות עליהם כתובות במילים'
- 'חילוק ארוך מופיע כתרגיל בשורה עם מקום לפתרון, בלי "הבית" של החילוק'
