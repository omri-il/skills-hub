name: create-elementary-math-practice
title: דפי תרגול במתמטיקה ליסודי
version: 1.1.0
updated: 2026-11-11
subjects:
- מתמטיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים למתמטיקה ביסודי, כיתות א'–ו'
problem: 'דף עבודה ביסודי צריך שרטוטים: זוויות למדידה, משולשים, ישר מספרים, שברים. ג''מיני מצייר אותם כתמונה שנראית טוב, אבל הזווית בה לא באמת בגודל שכתוב, ותרגילים בתוך משפט בעברית יוצאים עם המספרים הפוכים.
  '
what_it_does: 'יוצר דף עבודה במתמטיקה לכיתות א''–ו'' לפי כיתה ונושא: שאלות מדורגות בשפה של ילדים, שרטוטים מדויקים שמצוירים בקוד, ומפתח תשובות עם דרך פתרון ועם הטעות הנפוצה. בזוויות: מדידה במד-זווית, מיון, מציאת זווית חסרה במשולש, במרובע ובזוויות צמודות וקודקודיות. משתמש בסקיל השרטוטים ובסקיל העיצוב.
  '
output: קובץ Word עם דף תלמיד, שרטוטים בגודל אמיתי ומפתח תשובות
requires:
- draw-math-figures
- format-equations-for-hebrew-worksheets
role: main
tested:
- 'נבדק במחשב, לא בג''מיני: דף זוויות ושברים לכיתה ה'' עם שרטוטים נבנה כקובץ Word, והתרגילים (ריבוע למספר חסר, נקודתיים לחילוק, מעלות) יצאו כמשוואות Word'
limitations:
- 'בג''מיני (11.11.2026) הסקיל הופעל לבד מבקשה רגילה בפעם אחת מתוך שלוש. בפעם ההיא ג''מיני ענה אחרי כ-10 דקות "אני רק מייצר טקסט", ובשתי האחרות כתב את הדף בצ''אט, בלי קובץ ובלי שרטוטים'
- 'באותו יום גם create-math-practice, שעבד קודם, בנה את הקובץ בקוד ואז לא מסר אותו. צריך לבדוק שוב כשג''מיני חוזר למסור קבצים'
- גודל הגופן זהה לדפים של חטיבה ותיכון, גם לכיתות א'–ב'
example: דף עבודה במדידת זוויות במד-זווית לכיתה ה', כקובץ Word
