name: create-elementary-math-practice
title: דפי תרגול במתמטיקה ליסודי (א'-ו')
version: 1.0.0
updated: 2026-11-19
subjects:
- מתמטיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים למתמטיקה ומחנכים בבית הספר היסודי, כיתות א' עד ו'
who: [מורים, מחנכים]
problem: 'דף תרגול טוב ליסודי לוקח זמן: מספרים שמתאימים לכיתה, תרגילים במאונך, שברים, בעיות מילוליות בשפה של ילדים ומקום לכתוב. כשמבקשים את זה מג''מיני בלי הנחיות, התרגילים במאונך והשברים נשברים בקובץ, סימני "גדול מ-" ו"קטן מ-" מתהפכים בדף בעברית, וחידות יוצאות עם יותר מתשובה אחת.

  '
benefit: 'קובץ Word מוכן להדפסה, עם אותיות גדולות, תרגילים במאונך ושברים שנראים נכון, ומפתח תשובות שנבדק בקוד.'
what_it_does: 'יוצר דף עבודה בחשבון לפי כיתה ונושא, במספרים שמתאימים לתוכנית הלימודים של הכיתה: תרגילים במאונך, שברים ומספרים מעורבים, השלמה עם משבצת, השוואה, בעיות מילוליות מהחיים של ילדים, "מצאו את הטעות" ושאלת אתגר. כל תשובה נבדקת בקוד, וחידות נבדקות שיש להן תשובה אחת. לכיתה הטרוגנית: אותו דף ב-3 רמות ("דף 1", "דף 2", "דף 3", בלי שמות של רמות), עם אותו מספור לבדיקה משותפת. ניקוד לפי בקשה.

  '
output: קובץ Word עם דף לתלמיד (או 3 דפים) ומפתח תשובות בעמוד נפרד, שנפתח גם ב-Google Docs
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (19.11.2026): 25 בקשות של מורים מכיתה א'' עד ו'', עם gemini-3.5-flash. Claude בדק כל דף מול הסקיל, בציון מ-0 עד 10, ופתר מחדש כל תשובה במפתח. ב-25 מתוך 25 נוצר קובץ Word. בגרסה הראשונה הממוצע היה 6.9, ובגרסה הזאת 7.1, ו-22 מתוך 25 קיבלו 7 ומעלה'
- 'אותה בדיקה עם gemini-4-hydrogen (10 בקשות, כולל 3 רמות וניקוד): ממוצע 8.4, כל 10 קיבלו 7 ומעלה, ולא נמצאה אף תשובה שגויה במפתח'
- 'Claude פתח 4 קבצים ב-Word וראה אותם כתמונה: תרגילים במאונך עם קו, שברים, משבצות להשלמה וניקוד מוצגים נכון מימין לשמאל'
- 'בקשה בלי כיתה ("דף עבודה בחשבון"): ג''מיני שאל על הכיתה והנושא לפני שבנה את הדף'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'במצב המהיר (Flash), ב-2 מתוך 25 דפים הייתה טעות בשאלת האתגר: חידה עם 2 תשובות כשבמפתח הייתה אחת, ו"תשובה נוספת" שלא עומדת בתנאים. אחרי זה הוספתי כלל, שעוד לא נבדק. כדאי לפתור את שאלת האתגר לפני ההדפסה, או לעבוד במצב Thinking'
- 'במצב המהיר Gemini שם לפעמים תרגיל בתוך משפט ולא בשורה משלו, או כותב 2 הוראות בשאלה אחת'
- 'הסקיל לא מצייר צורות, זוויות או ישר מספרים. שאלות על שטח, היקף וגאומטריה כתובות במילים ובמספרים'
- 'חילוק ארוך מופיע כתרגיל בשורה עם מקום לפתרון, בלי "הבית" של החילוק'
