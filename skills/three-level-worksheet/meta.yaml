name: three-level-worksheet
title: דף אחד ב-3 רמות, לכיתה הטרוגנית
version: 1.2.0
updated: 2026-11-21
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים בכיתות הטרוגניות, כיתות ג'-י"ב, כולל עולים חדשים ותלמידי שילוב
who:
- מורים
fits:
- רב-מלל
- ריאליים
problem: 3 דפים שונים לכל שיעור לוקחים שעות. ג'מיני בלי הנחיות נותן לדף הקל שאלות של כיתה נמוכה, וכל רמה לומדת משהו אחר.
benefit: 3 גרסאות של אותו דף, כך שכל הכיתה לומדת את אותו חומר ובודקת יחד.
what_it_does: 'בונה 3 גרסאות של הדף שלכם: אותן שאלות ליבה ואותה מטרה, עם תמיכה שונה. בדף התמיכה: טקסט בחלקים, מילון מילים קשות (אפשר עם תרגום), דוגמה פתורה ופתיחי משפטים. בדף האתגר: שאלת העמקה. מסמן ב-●, לא במילים כמו "חלשים".'
output: '3 דפים מוכנים להעתקה ודף למורה עם מפתח'
role: main
category: עזרי הוראה
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 13 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.6'
- 'בגרסה 1.2.0, אותן 25 בקשות (21.11.2026, gemini-3.5-flash): 17 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.8. את הציונים נתן Claude בתוך Claude Code, באותן הוראות בדיקה. השתפר: שאלות הליבה זהות ב-3 הדפים'
limitations:
- 'לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @'
- 'במצב המהיר לפעמים יש בדף אות משפה אחרת או מילה שבורה. לקרוא לפני שמדפיסים'
- 'לפעמים הרמז בדף ● מראה את דרך הפתרון כמעט עד הסוף'
- 'את התרגום במילון לא בדק דובר של השפה'
simple: 'מדביקים לג''מיני דף עבודה. מקבלים 3 גרסאות של אותו דף: עם תמיכה, רגילה ועם אתגר. השאלות המרכזיות זהות, כך שכל הכיתה בודקת יחד.'
uses:
- when: 'כיתה עם פערים גדולים'
  ask: 'תעשה את הדף הזה ב-3 רמות, לכיתה ח''. [כאן מדביקים את הדף]'
  get: '3 דפים עם אותן שאלות ליבה, ודף למורה עם מפתח.'
- when: 'עולים חדשים בכיתה'
  ask: 'תעשה 3 רמות, ובדף עם התמיכה מילון מילים קשות עם תרגום לרוסית. [כאן מדביקים את הטקסט]'
  get: 'דף ● עם מילון מילים קשות ותרגום, ושורה שמזכירה לבדוק את התרגום.'
- when: 'אין דף, רק נושא'
  ask: '3 רמות על מחזור המים, כיתה ה'''
  get: 'דף מלא על הנושא ב-3 רמות, עם שאלת אתגר בדף ●●●.'
fixes:
  source: 'מתוך 2 בקשות של מורים ל-Gemini Flash בלי הסקיל (21.11.2026), מול 25 בקשות עם הסקיל.'
  list:
  - without: 'כותב על הדף למי הוא מיועד.'
    quote: 'רמה א'' – מונגשת מאוד (מיועדת לעולים חדשים ולתלמידים עם קשיי קריאה משמעותיים)'
    with: 'על הדף רק סמל: ●, ●● או ●●●.'
  - without: 'בדף הקל משנה את המספרים בשאלה: 120 ק"מ במקום 90.'
    quote: 'היא עברה דרך של 120 ק"מ.'
    with: 'אותן שאלות ליבה ואותם מספרים בכל 3 הדפים.'
