name: create-science-simulation
title: סימולציה למדעים בחטיבה, בלי טעויות מדעיות
version: 1.2.0
updated: 2026-11-21
subjects:
- מדעים
- פיזיקה
- ביולוגיה
- כימיה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים למדעים, כיתות ז'-ט'
who:
- מורים
problem: 'סימולציה מ-AI נראית טוב, אבל לפעמים היא מלמדת טעות: חלקיקים שגדלים בחימום, אנרגיה שנעלמת, עברית הפוכה ליד מספרים.'
benefit: סימולציה בעברית שעובדת בטלפון, עם מודל מדעי נכון ובדיקה שהמורה רואה.
what_it_does: 'כותב קודם את המודל במילים, ובונה לפיו סימולציה ב-Canvas. התלמיד מנחש לפני שהוא מפעיל. מה שנשמר (אנרגיה, מסה) מופיע על המסך, ויש כפתור "בדיקת המודל למורה".'
output: 'ב-Canvas: סימולציה בקובץ אחד, המודל במילים, ובדיקה של 2 דקות לפני הכיתה'
role: main
category: עזרי הוראה
fixes:
  source: 'מתוך בקשה של מורה באפליקציה של Gemini, בלי הסקיל ועם הסקיל, 21.11.2026. הסימולציות צולמו בדפדפן בגודל של טלפון: מוצק מימין, גז משמאל.'
  intro: 'בלי הסקיל, Gemini בונה סימולציה שנראית טוב אבל מלמדת טעות:'
  list:
  - without: 'החלקיקים כחולים במוצק וכתומים בגז, כאילו החלקיק עצמו התחמם. הטמפרטורה כתובה הפוך, והמסך מראה כוכביות של Markdown.'
    quote: 'C° 140'
    with: 'עם הסקיל, החלקיקים באותו צבע ובאותו גודל בכל טמפרטורה. רק המהירות והמרחק משתנים, והטמפרטורה כתובה נכון.'
hidden: true
tested:
- '25 בקשות של מורים למדעים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash), בכל בקשה סימולציה שנבדקה בדפדפן, בטלפון ובמחשב. גרסה 1.0: 0 מתוך 25 קיבלו ציון 7 ומעלה. גרסה 1.1, עם שלד קוד קבוע: 4 מתוך 25, ממוצע 5.2'
- 'אותן 25 בקשות בלי הסקיל: החלקיקים החליפו צבע בחימום, טקסט של הטמפרטורה יצא הפוך, והסימולציה יצאה מהמסך בטלפון'
- 'באפליקציה של Gemini (21.11.2026, Hydrogen Thinking), 3 בקשות עם הסקיל ובלעדיו. מודל החלקיקים ומעגל חשמלי: הסקיל עבד, עם המודל במילים, שאלת ניחוש, ערכים נכונים על המסך ובדיקה למורה. בקשת החיכוך: Gemini לא הפעיל את הסקיל, גם כשהבקשה התחילה ב-@, ובנה סימולציה רגילה'
- 'באפליקציה, Gemini הפעיל את הסקיל גם בלי @, כשהבקשה התאימה לתיאור שלו. הקוד הגיע בצ''אט ולא ב-Canvas'
limitations:
- 'עוד לא עובר את הסף של האתר (20 מתוך 25). גרסה 1.2 מתקנת באג בשלד שהפיל 5 סימולציות, ועוד לא נבדקה'
- 'גם עם הסקיל, ג''מיני כותב לפעמים ערך "נשמר" קבוע, ולא מחושב'
- 'באפליקציה, לא תמיד מופעל: בבקשה אחת מתוך 3 Gemini התעלם ממנו'
- לא נבדק בחשבון של בית ספר
simple: 'כותבים לג''מיני נושא וכיתה. מקבלים סימולציה בעברית, עם שאלת ניחוש לתלמיד ומודל מדעי שנבדק.'
uses:
- when: 'שיעור על מודל החלקיקים'
  ask: 'תבנה לי סימולציה לכיתה ז'' שמראה מה קורה לחלקיקים כשמחממים חומר, ממוצק לנוזל לגז.'
  get: 'סימולציה שבה החלקיקים לא גדלים, רק זזים מהר יותר, עם שאלת ניחוש לפני ההפעלה.'
- when: 'מעגל חשמלי'
  ask: 'סימולציה לכיתה ט'' של מעגל עם סוללה ו-2 נורות בטור. שהתלמידים יראו את הזרם בכל נקודה.'
  get: 'מעגל שבו הזרם שווה לפני הנורה ואחריה, והערכים מופיעים על המסך.'
- when: 'כוחות ותנועה'
  ask: 'תבנה לי סימולציה לכיתה ח'' של קופסה על רצפה, שאפשר לשנות את החיכוך ואת הדחיפה.'
  get: 'סימולציה שמראה את המהירות והכוחות, ושהאנרגיה לא נעלמת אלא הופכת לחום.'
