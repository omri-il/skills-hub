problem: 'טעות במפתח תשובות פוגעת בתלמידים יותר מכל טעות עיצוב, ומודלים של בינה מלאכותית נוטים "לאשר" את התשובה שכבר כתובה במקום לפתור מחדש.

  '
benefit: 'פחות טעויות במפתח התשובות מגיעות לכיתה, ופחות שאלות צריך לפתור בעצמך כדי לבדוק.'
what_it_does: 'פותר כל שאלה מחדש בלי להסתכל במפתח, מאמת בדרך שנייה (הצבה, יחידות, ספירת אטומים ומטענים), מתקן טעויות, ומחזיר טבלה קצרה של מה נבדק ומה תוקן. אפשר להפעיל אותו גם על דף עבודה קיים שהמורה מעלה.

  '
output: טבלת דיווח ומפתח תשובות מתוקן
