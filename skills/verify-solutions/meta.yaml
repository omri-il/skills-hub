name: verify-solutions
title: בדיקת שאלות ומפתחות תשובות
version: 1.3.0
updated: 2026-11-21
subjects:
- מתמטיקה
- כימיה
- פיזיקה
- ביולוגיה
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים למתמטיקה ולמדעים
who:
- מורים
problem: טעות במפתח פוגעת בתלמידים, ו-AI נוטה "לאשר" את התשובה הכתובה במקום לפתור מחדש.
benefit: פחות טעויות במפתח מגיעות לכיתה.
what_it_does: פותר כל שאלה מחדש בלי להסתכל במפתח, בודק בדרך שנייה, ומחזיר טבלה של מה נבדק ומה תוקן.
output: טבלת דיווח ומפתח תשובות מתוקן
requires: []
role: shared
tested:
- ג'מיני בדק בקוד Python את כל התשובות לפני יצירת הקובץ
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 13 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.1. בגרסה הקודמת, באותו יום: 13'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- לא נבדק על דף עבודה שמורה מעלה
simple: 'נותנים לג''מיני שאלות עם מפתח תשובות. הוא פותר כל שאלה מחדש, ומוצא טעויות במפתח.'
uses:
- when: 'דף ש-AI הכין'
  ask: 'תבדוק את מפתח התשובות של דף העבודה שהעליתי.'
  get: 'טבלה של כל שאלה: מה נבדק ומה תוקן.'
- when: 'מבחן לפני הדפסה'
  ask: 'לפני שאני מדפיס את המבחן בפיזיקה, תבדוק שכל התשובות במפתח נכונות. [כאן מדביקים את המבחן והמפתח]'
  get: 'מפתח מתוקן. כל שאלה נבדקה ב-2 דרכים.'
- when: 'תלמיד אומר שיש טעות'
  ask: 'תלמיד אומר שהתשובה לשאלה 3 במפתח לא נכונה. תפתור מחדש. [כאן מדביקים את השאלה ואת התשובה]'
  get: 'פתרון מלא מההתחלה, בלי להסתכל בתשובה הכתובה.'
fixes:
  source: 'מתוך 25 בקשות של מורים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 21.11.2026.'
  list:
  - without: 'כששכחתם לשלוח את השאלות, מנחש אותן ו"מתקן" תשובה נכונה שלכם לתשובה שגויה. ב-1 מתוך 25 בקשות.'
    quote: 'נקודות החיתוך עם ציר x צריכות להיות'
    with: 'כשחסרות השאלות, מבקש אותן ולא מנחש. בודק רק אחרי שתשלחו אותן.'
  - without: 'כשחסרה טבלה, כותב שהשאלות תקינות עוד לפני שראה אותה. ב-2 מתוך 25 בקשות.'
    quote: 'לא צירפת את הטבלה, אך הניסוח והפורמט תקינים.'
    with: 'שאלה שחסר לה נתון מסומנת כך בטבלה, ונבדקת רק אחרי שתשלחו אותו.'
  - without: 'כותב "נכון" על תשובה בלי לבדוק אותה שוב בדרך אחרת. ב-16 מתוך 25 בקשות.'
    quote: 'הנה סקירה קצרה שמאשרת את כל הסעיפים:'
    with: 'פותר את השאלה מחדש ובודק אותה בדרך שנייה, כמו הצבה או פתיחת סוגריים.'
  also: 'לפתור כל שאלה מחדש בלי להסתכל במפתח, ולהחזיר טבלה של מה נבדק ומה תוקן.'
