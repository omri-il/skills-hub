name: create-choice-board
title: לוח בחירה
version: 1.0.0
updated: 2026-11-10
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים בכל מקצוע, מכיתה א' עד י"ב
problem: 'כשמבקשים מג''מיני לוח בחירה, מקבלים רשימה ארוכה של כרטיסים זה מתחת לזה, לא לוח משבצות שתלמיד רואה במבט אחד. לפעמים גם כל משימה לוקחת את כל השיעור, ומשימת ציור מסתיימת ב"וכתבו הסבר".

  '
what_it_does: 'יוצר ב-Canvas לוח בחירה אמיתי: טבלת משבצות צבעונית (ברירת מחדל 3 על 3, "שלוש בשורה", עם בחירה חופשית באמצע), שבה כל שורה משלבת סוגי משימות שונים, והזמן מתחלק בין המשבצות. בלשונית שנייה, מדריך למורה עם מטרה, שלבים, תמיכה והרחבה לכל משבצת. מודפס בעמוד אחד לרוחב.

  '
output: דף Canvas עם לוח לתלמיד ומדריך למורה, להדפסה או לשיתוף
role: main
tested:
- עדיין לא נבדק בג'מיני
limitations:
- עדיין לא נבדק אם ג'מיני פותח Canvas לבד, בלי שהמילה "Canvas" מופיעה בבקשה
- לא נבדק ב-Gemini בתוך Google Classroom
