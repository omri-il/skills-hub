name: create-choice-board
title: לוח בחירה
version: 1.3.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים, כיתות א'-י"ב
who:
- מורים
fits:
- רב-מלל
problem: כשמבקשים מג'מיני לוח בחירה, מקבלים רשימה ארוכה של כרטיסים, לא לוח שרואים במבט אחד.
benefit: לוח בעמוד אחד ומדריך למורה, מוכנים להדפסה בפחות מדקה.
what_it_does: יוצר טבלת משבצות צבעונית בעמוד אחד (3 על 3, בחירה חופשית באמצע). בכל שורה סוגי משימות שונים. אחריה מדריך למורה, עם תמיכה והרחבה לכל משבצת.
output: 'קובץ Word: לוח לתלמיד ומדריך למורה. נפתח גם ב-Google Docs'
role: main
category: עזרי הוראה
tested:
- 'לוח 3×3 לכיתה ח'' על בעלי חיים במדבר: קובץ Word בפחות מדקה, לוח בעמוד אחד ומדריך'
- 'בלי @ ("צור לוח בחירה בנושא פוטוסינתזה"): ג''מיני הפעיל את הסקיל לבד, ושאל רק לאיזו כיתה'
- 'בקשה בלי פרטים: ג''מיני שאל 4 שאלות בהודעה אחת, כל אחת עם ברירת מחדל'
- '200 הרצות דרך ה-API (14.11.2026): בגרסה 1.2.0, 103 מתוך 104 קבצים נפתחו ב-Word'
- 'בקשת המשך באנגלית: הלוח נבנה מחדש בעברית'
limitations:
- 'במשימות מיון לבדוק את הדוגמאות: חלק מהן התאימו ליותר מתשובה אחת'
- לוח 2×3 לכיתות א'-ג' לא נבדק, וגם לא ב-Classroom
- Flash-Lite מחזיר קוד במקום קובץ (16 מתוך 16). לבחור מודל אחר
- הבדיקות של 14.11 רצו דרך ה-API, לא באפליקציה
simple: 'ג''מיני בונה לוח של 9 משבצות, ובכל משבצת משימה. התלמיד בוחר אילו משימות לעשות. מקבלים קובץ Word מוכן להדפסה.'
uses:
- when: 'סיום יחידה'
  ask: 'לוח בחירה על מערכת השמש לכיתה ד''.'
  get: 'לוח בעמוד אחד, 3 על 3, ומדריך למורה.'
- when: 'כיתה עם רמות שונות'
  ask: 'לוח בחירה בספרות לכיתה ח'', עם משימות לתלמידים שמתקשים וגם לחזקים.'
  get: 'לוח, ובמדריך למורה יש עזרה ואתגר לכל משבצת.'
- when: 'שיעורי בית לשבוע'
  ask: 'לוח בחירה לשבוע בנושא שברים לכיתה ה''. כל תלמיד עושה 3 משימות בשורה.'
  get: 'לוח צבעוני להדפסה, עם משבצת של בחירה חופשית באמצע.'
