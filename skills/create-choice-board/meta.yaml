name: create-choice-board
title: לוח בחירה
version: 1.1.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים בכל מקצוע, מכיתה א' עד י"ב
problem: 'כשמבקשים מג''מיני לוח בחירה, מקבלים רשימה ארוכה של כרטיסים זה מתחת לזה, לא לוח משבצות שתלמיד רואה במבט אחד. לפעמים גם כל משימה לוקחת את כל השיעור, ומשימת ציור מסתיימת ב"וכתבו הסבר".

  '
what_it_does: 'יוצר לוח בחירה אמיתי: טבלת משבצות צבעונית בעמוד אחד לרוחב (ברירת מחדל 3 על 3, "שלוש בשורה", עם בחירה חופשית באמצע), שבה כל שורה משלבת סוגי משימות שונים, והזמן מתחלק בין המשבצות. אחרי הלוח, מדריך למורה עם מטרה, שלבים, תמיכה והרחבה לכל משבצת.

  '
output: קובץ Word עם לוח לתלמיד (עמוד 1) ומדריך למורה, שנפתח גם ב-Google Docs
role: main
tested:
- 'לוח 3×3 לכיתה ח'' על התאמות של בעלי חיים למדבר, עם @create-choice-board: קובץ Word בפחות מדקה, לוח צבעוני בעמוד אחד לרוחב ומדריך למורה, וסוגי המשימות מסודרים כך שאין שורה עם שני סוגים זהים'
- 'בקשה קצרה בלי @ ("צור לוח בחירה בנושא פוטוסינתזה"): ג''מיני הפעיל את הסקיל לבד, שאל רק לאיזו כיתה, ואחרי "יא" מסר קובץ Word עם לוח 3×3 בעמוד אחד ומדריך למורה'
- 'בקשה קצרה בלי פרטים ("צור לוח בחירה על מחזור המים"): ג''מיני שאל בהודעה אחת את ארבע השאלות (כיתה, מטרה, מספר משבצות וזמן), כל אחת עם ברירת מחדל'
limitations:
- 'ג''מיני לא מאפשר Canvas כשסקיל פעיל, ולכן התוצר הוא קובץ Word ולא דף Canvas'
- 'במשימות מיון כדאי לעבור על הדוגמאות לפני ההדפסה: בלוח לפוטוסינתזה חלק מהמצבים במיון לגורם מגביל התאימו ליותר מגורם אחד'
- 'לוח 2×3 לכיתות א''–ג'' עדיין לא נבדק'
- 'לא נבדק ב-Gemini בתוך Google Classroom'
