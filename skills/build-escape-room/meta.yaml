name: build-escape-room
title: חדר בריחה לשיעור
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שרוצה שיעור חזרה או מפגש שיא שהתלמידים זוכרים
problem: 'חדר בריחה שנבנה מהר מתפוצץ בכיתה: החידות טוריות ולכן קבוצה נתקעת ויושבת רבע שעה בלי לעשות כלום, חלק מהחידות ניתנות לגוגל, והקוד הסופי לא יוצא כי אף אחד לא פתר את השרשרת מראש.

  '
what_it_does: 'בונה ארבע חידות עצמאיות שנפתרות רק מהחומר הנלמד, כל אחת מניבה פיסה אחת של קוד היציאה. בונה קודם את שרשרת הקוד ואז את החידות, פותר הכול בעצמו לפני המסירה, ומייצר דף מורה עם שלושה רמזים ומפתח חירום לכל חידה, מה לעשות עם קבוצה שנתקעת, מה לעשות אם נשארו עשר דקות, וסגירה שהופכת את המשחק לשיעור.

  '
output: קובץ Word עם דף תלמיד להדפסה ודף הפעלה למורה עם כל הפתרונות
requires:
- write-graded-questions
- hebrew-docs-rtl
role: main
tested:
- '2026-11-11, Gemini 3.1 Pro: חדר בריחה על המהפכה הצרפתית לכיתה ח'', 45 דקות, "כקובץ Word". נכשל: לא נוצר קובץ. ג''מיני כתב את החדר בצ''אט, התחיל גרסה שנייה באמצע הראשונה, ואחרי שסיים כל התשובה הוחלפה ב"אני לא יכול לעזור לך, כי אני רק מודל שפה". ניסיון חוזר נתן את אותו סירוב'
- 'בטיוטה שנמחקה היו שלוש טעויות שהסקיל אמור למנוע: צופן אתב"ש שלא מתפענח לתשובה שניתנה ("ת כ ו ו ה" אינו "אחווה"), חידה שהתשובה שלה כתובה בקטע המקור (14 ביולי), ושאלה שמגלה את התשובה בניסוח ("לאירוע שסימנתם כמספר 3 (כיבוש הבסטיליה)")'
limitations:
- 'לא ראוי לעלות לאתר במצב הנוכחי'
- 'לא ברור אם הסירוב נבע מהסקיל או מתקלה בחשבון הבדיקה, שבו גם בקשות בלי קשר לסקיל החזירו את אותו נוסח סירוב. שלוש הטעויות בטיוטה הן בעיה של הסקיל בכל מקרה'
- 'נבדק רק ב-Gemini 3.1 Pro. ב-2026-11-11 בחשבון הבדיקה Flash ענה רק על שאלות של שורה אחת, ועל שאלות הבדיקה החזיר סירוב גנרי או נתקע; Thinking נתקע או סירב גם על "מה בירת איטליה". באותו יום, בחשבון גוגל רגיל עם 9 סקילים, Flash ענה כרגיל על אותן שאלות. לא ברור אם ההבדל הוא בחשבון ה-Workspace או ב-36 הסקילים שהיו מותקנים בו. איך הסקיל הזה מתנהג ב-Flash, ברירת המחדל של רוב המורים, עוד לא נבדק'
- 'טרם נבדק בכיתה אמיתית, ולכן הערכות הזמן לכל חידה עדיין תיאורטיות'
