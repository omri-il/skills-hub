name: create-reading-comprehension
title: דף הבנת הנקרא ליסודי (א'-ו'), לפי ממדי ההבנה
version: 1.0.0
updated: 2026-11-20
subjects:
- לשון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ומחנכים, כיתות א'-ו'
who:
- מורים
- מחנכים
problem: לכתוב טקסט ושאלות טובות לכל ממד לוקח שעה. ג'מיני בלי הנחיות ממציא ציטוטים במפתח.
benefit: דף Word מוכן להדפסה, עם שאלות בכל 4 הממדים ומפתח שהציטוטים בו נבדקו בקוד.
what_it_does: 'לוקח טקסט של המורה, או כותב טקסט לפי נושא וכיתה. כותב שאלות סגורות ופתוחות לפי 4 ממדי ההבנה של משרד החינוך, עם אוצר מילים. במפתח, כל ציטוט נבדק בקוד מול הטקסט. אפשר 3 רמות וניקוד.'
output: קובץ Word עם הטקסט, השאלות ומפתח תשובות
role: main
category: עזרי הוראה
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (20.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 13 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.6'
- 'אותן 25 בקשות במודל Pro (gemini-3.1-pro-preview). 23 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.1'
- 'בכל 50 הבקשות נוצר קובץ Word, וכל ציטוט במפתח נמצא בטקסט ובפסקה הנכונה'
- 'Claude פתח 4 קבצים ב-Word: ניקוד לכיתה א'' ו-3 רמות מוצגים נכון מימין לשמאל'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- 'עדיף לעבוד במצב Thinking. במצב המהיר יש לפעמים מילה שגויה או טעות בניקוד'
- 'חלק מהשאלות מסומנות בממד ב או ג, אבל התשובה כתובה בטקסט. לעבור על המפתח לפני ההדפסה'
- 'בשאלות סגורות, לפעמים תשובה שגויה קלה מדי לפסילה'
- 'דף ב-3 רמות יוצא 12 עד 18 עמודים'
simple: 'נותנים לג''מיני כיתה וטקסט, או רק נושא. הוא יוצר דף הבנת הנקרא בקובץ Word, עם שאלות ומפתח תשובות.'
uses:
- when: 'יש לכם טקסט מהספר'
  ask: 'דף הבנת הנקרא לכיתה ג'' על הטקסט הזה: [כאן מדביקים את הטקסט]'
  get: 'הטקסט עם מספרי פסקאות, 8 שאלות לפי הממדים, ומפתח עם ציטוט לכל תשובה.'
- when: 'אין לכם טקסט'
  ask: 'טקסט מידעי על דבורים לכיתה ד'', עם שאלות הבנה.'
  get: 'טקסט חדש באורך שמתאים לכיתה, עם שאלות ומפתח.'
- when: 'כיתה עם רמות שונות'
  ask: 'דף הבנת הנקרא לכיתה ב'' על חברות, ב-3 רמות.'
  get: '3 דפים עם אותו טקסט ואותם מספרי שאלות, ברמות קושי שונות.'
fixes:
  source: 'מתוך 25 בקשות של מורים ל-Gemini Pro, בלי הסקיל ועם הסקיל, 21.11.2026.'
  list:
  - without: 'אין קובץ Word, גם כשביקשתם אחד. מקבלים טקסט בצ''אט ומתבקשים להעתיק אותו לבד. ב-25 מתוך 25 בקשות.'
    quote: 'אינני יכול לשלוח קובץ Word ישירות להורדה'
    with: 'נוצר קובץ Word מוכן להדפסה, עם שורת שם ותאריך ופסקאות ממוספרות.'
  - without: 'ביקשתם 3 רמות לאותו טקסט, וקיבלתם טקסט אחר בכל רמה, עם כותרת כמו "מתקשים" שהילד רואה. ב-4 מתוך 4 בקשות.'
    quote: 'רמה 1: מתקשים (טקסט מנוקד, משפטים קצרים וברורים)'
    with: 'אותו טקסט בכל 3 הדפים, והכותרות הן רק דף 1, דף 2 ודף 3.'
  - without: 'לא כתבתם כיתה, והדף נכתב לכיתה שג''מיני ניחש. ב-4 מתוך 4 בקשות בלי כיתה.'
    quote: 'הטקסט מותאם פחות או יותר לכיתות ג''-ד'''
    with: 'קודם שואל באיזו כיתה, בשאלה אחת קצרה, ורק אז בונה את הדף.'
  also: 'לבדוק בקוד שכל ציטוט במפתח נמצא בטקסט, ולבנות קובץ Word מוכן להדפסה.'
hidden: true
