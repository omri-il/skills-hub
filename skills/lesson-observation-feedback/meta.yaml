name: lesson-observation-feedback
title: משוב אחרי צפייה בשיעור
version: 1.0.0
updated: 2026-11-21
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מנהלים, סגני מנהלים ורכזים שצופים בשיעורים
who:
- מנהלים
- רכזים
problem: אחרי צפייה בשיעור יש 15 נקודות מהירות בטלפון, וצריך להפוך אותן למשוב שהמורה יקבל בלי להתגונן.
benefit: משוב מכבד עם דבר אחד ברור לשיעור הבא, במקום רשימה ארוכה של הערות.
what_it_does: 'מקבל את הנקודות מהצפייה, וכותב משוב למורה: 2-3 חוזקות עם דוגמה מהשיעור, נקודה אחת לשיפור עם צעד מעשי, ושאלה אחת לשיחה. גם 2-3 שורות לתיק. רק מה שנכתב בנקודות, בלי ציון.'
output: משוב למורה, סיכום קצר לתיק, והערות לצופה בלבד לשיחה הבאה
requires: []
role: main
category: הערכה ומשוב
tested:
- 'עוד לא נבדק'
limitations:
- 'עוד לא נבדק'
simple: 'מדביקים לג''מיני את הנקודות שכתבתם בזמן הצפייה. הוא כותב משוב למורה עם מה שעבד, דבר אחד לשפר, ושאלה לשיחה.'
uses:
- when: 'אחרי צפייה בשיעור'
  ask: 'תכתוב משוב למורה על השיעור. [כאן מדביקים את הנקודות מהצפייה]'
  get: 'משוב קצר, סיכום לתיק, והערות רק בשבילכם.'
- when: 'לפני שיחת משוב'
  ask: 'תכין לי שאלות לשיחת משוב. [כאן מדביקים את הנקודות]'
  get: '3 שאלות פתוחות לשיחה, ומה עבד בשיעור.'
- when: 'מורה חדש'
  ask: 'זה מורה חדש, תכתוב משוב עדין. [כאן מדביקים את הנקודות]'
  get: '3 חוזקות וצעד קטן אחד לשיעור הבא.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה במשוב למורה 3 טעויות נפוצות:'
  list:
  - without: 'רשימה ארוכה של כל מה שאפשר לשפר.'
    with: 'עם הסקיל, נקודה אחת לשיפור וצעד אחד לשיעור הבא.'
  - without: 'מחמאות כלליות כמו "שיעור מצוין".'
    with: 'עם הסקיל, כל חוזקה באה עם דוגמה מהשיעור.'
  - without: 'מעתיק מילים שופטות מהנקודות שלכם.'
    with: 'עם הסקיל, המשוב מתאר מה קרה בשיעור, לא את המורה.'
