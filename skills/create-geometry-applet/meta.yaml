name: create-geometry-applet
title: יישומון לגוף במרחב, לסובב, לשנות ולפרוס
version: 1.0.0
updated: 2026-11-27
subjects:
- מתמטיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ומרצים למתמטיקה, חטיבת ביניים ותיכון
who:
- מורים
problem: 'תלמידים לא רואים גוף במרחב בציור במחברת. יישומון מ-AI נראה טוב, אבל לפעמים הפריסה לא נכונה, הנפח לא מתאים לציור, או שהמסך שחור בגלל ספרייה מבחוץ.'
benefit: יישומון בעברית שעובד בטלפון, שבו התלמיד מסובב, משנה מידות ופורס את הגוף, עם בדיקה שהמורה רואה.
what_it_does: 'כותב קודם את הנוסחאות, ובונה לפיהן יישומון ב-Canvas: גוף שמסתובב בגרירה, סליידרים למידות, פריסה לרשת, ושאלת ניחוש לפני שמשנים. כפתור "בדיקה למורה" משווה את הנוסחה לציור.'
output: 'ב-Canvas: יישומון בקובץ אחד, הנוסחאות, שאלת חקר לזוגות, ובדיקה של 2 דקות לפני הכיתה'
role: main
category: עזרי הוראה
hidden: true
tested:
- 'הקוד נבדק בדפדפן (27.11.2026) ב-6 הגופים: חרוט, גליל, פירמידה ריבועית, מנסרה משולשת, תיבה וכדור. בכל אחד הבדיקה למורה הראתה ✓ במידות הקטנות, באמצע ובגדולות, והפריסה נכונה'
- 'באפליקציה של Gemini, חשבון בית ספר, Hydrogen (27.11.2026). חרוט לכיתה ט'', בלי @: Gemini העתיק את הקוד אות באות, והיישומון עבד ב-Canvas. אבל בצ''אט הוא כתב רק 2 משפטים, בלי הנוסחאות, שאלת החקר והבדיקה'
- 'מנסרה משולשת לכיתה ח'', 4 ניסיונות (גרסה 1 וגרסה 2, עם @ ובלי): Gemini לא השתמש בקוד של הסקיל. פעמיים הוא כתב יישומון משלו, פעם אחת ענה בהמחשה החזותית המובנית שלו עם נוסחאות LaTeX, ופעם אחת התשובה יצאה ריקה'
limitations:
- 'ב-Hydrogen הסקיל עבד רק בחרוט. בגופים אחרים Gemini עקף אותו, גם עם @'
- רק גופים במרחב. לא צורות במישור
simple: 'כותבים לג''מיני גוף וכיתה. מקבלים יישומון בעברית שבו התלמיד מסובב את הגוף, משנה מידות ופורס אותו, עם שאלת ניחוש לפני.'
uses:
- when: 'שיעור על נפח החרוט'
  ask: 'תבנה לי יישומון לכיתה ט'' על חרוט: שהתלמידים ישנו רדיוס וגובה ויראו מה קורה לנפח ולשטח הפנים, ושיוכלו לפרוס אותו.'
  get: 'חרוט שמסתובב, עם סליידרים, פריסה לגזרה ועיגול, ושאלת ניחוש על הכפלת הרדיוס.'
- when: 'פריסה של גליל'
  ask: 'יישומון לכיתה ח'' שמראה איך הגליל נפתח למלבן ו-2 עיגולים.'
  get: 'גליל שנפתח בסליידר, עם אורך המלבן שמתעדכן לפי הרדיוס.'
- when: 'גובה מול גובה הפאה'
  ask: 'תבנה יישומון של פירמידה ריבועית לכיתה י'' שמראה את ההבדל בין הגובה של הפירמידה לגובה של הפאה.'
  get: 'פירמידה עם 2 קווי עזר, h ו-hₐ, והערכים שלהם על המסך בכל מידה.'
