name: biology-experiment-analysis
title: שאלות ניתוח ניסוי בביולוגיה
version: 1.1.0
updated: 2026-11-21
subjects:
- ביולוגיה
- מדעים
platforms:
  tested:
  - Gemini
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים לביולוגיה ולמדעים, חט"ב ותיכון
who:
- מורים
problem: 'שאלת ניסוי טובה לוקחת זמן: ניסוי שנשמע אמיתי, טבלה עם נתונים הגיוניים וסעיפים בסגנון בגרות. ג''מיני בלי הנחיות ממציא נתונים שלא מתאימים לביולוגיה.'
benefit: שאלת ניסוי בסגנון בגרות עם טבלה ומפתח, מוכנה להדפסה.
what_it_does: 'יוצר ניסוי לפי נושא וכיתה: תיאור, טבלת תוצאות עם נתונים שמתאימים לביולוגיה, ו-7 סעיפים על משתנים, בקרה, גרף, הסבר, מסקנה וניבוי. הממוצעים בטבלה נבדקים בקוד, והמפתח כתוב כמו תשובה טובה בבגרות.'
output: קובץ Word עם דף תלמיד ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- verify-solutions
role: main
category: עזרי הוראה
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 13 מתוך 25 קיבלו 7 ומעלה. הממוצעים בטבלאות נכונים, והנתונים מתאימים לביולוגיה'
- 'באפליקציה של Gemini (21.11.2026, מצב Hydrogen Thinking, עם @biology-experiment-analysis): דף על אוסמוזה לכיתה ח'' יצא כקובץ Word, עם השורות בצ''אט כמו בסקיל'
- 'קובץ אחד מהבדיקה נבדק כתמונה ב-Word: מימין לשמאל, והטבלה מתחילה מימין'
- 'אותן 25 בקשות, Flash מול Pro (21.11.2026, בדיקה שנייה): ב-Flash רק 7 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.0. ב-Pro (gemini-3.1-pro-preview): 19 מתוך 24, ממוצע 7.1. לכן הסקיל מסומן "צריך Gemini Pro"'
needs_pro: true
limitations:
- 'הסקיל לא מצייר גרף. התלמיד משרטט אותו, והמפתח מתאר איזה גרף ומה על כל ציר'
- 'במצב המהיר יש לפעמים מילה משובשת, או שאלה שמגלה מונח מהתשובה. כדאי לעבור על הדף לפני ההדפסה'
- 'בבדיקה אחת ג''מיני שינה נתון בטבלה שהמורה הדביק. כדאי לבדוק שהנתונים שלכם נשארו כמו שהם'
simple: 'אומרים לג''מיני נושא בביולוגיה וכיתה. הוא יוצר שאלת ניסוי בסגנון בגרות בקובץ Word: תיאור, טבלת תוצאות, 7 סעיפים ומפתח.'
uses:
- when: 'תרגול לבגרות'
  ask: 'שאלת ניתוח ניסוי על אנזימים לכיתה י"א, כקובץ Word.'
  get: 'ניסוי עם טבלת תוצאות, סעיפים מהקל לקשה, ומפתח בסגנון בגרות.'
- when: 'ניסוי שכבר עשיתם בכיתה'
  ask: 'זה הניסוי והתוצאות שלנו. תכין עליו שאלות ניתוח: [כאן מדביקים את התיאור ואת הטבלה]'
  get: 'סעיפים על הנתונים שלכם, בלי לשנות אותם, ומפתח תשובות.'
- when: 'מדעים בחטיבה'
  ask: 'שאלת ניסוי פשוטה על אוסמוזה לכיתה ח''.'
  get: '5 סעיפים קצרים על משתנים, תוצאות ומסקנה.'
fixes:
  also: 'לחשב כל ממוצע בקוד, ולכתוב במפתח איזה גרף מתאים ומה על כל ציר.'
hidden: true
