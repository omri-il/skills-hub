name: create-test-with-rubric
title: מבחן עם מפתח ומחוון
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שבונה מבחן, בוחן או מתכונת
problem: 'מבחן שנבנה מהר מגיע עם ניקוד שמסתכם ל-97, עם סעיף ב'' שתלוי בתשובה של סעיף א'' כך שתלמיד שטעה פעם אחת מאבד שאלה שלמה, ועם מפתח שיש בו רק תשובות סופיות — ולכן הבדיקה לוקחת שלוש שעות ומסתיימת בוויכוחים על חלקי ניקוד.

  '
what_it_does: 'בונה קודם מפרט מבחן ומוודא בחישוב שהניקוד מסתכם ל-100, עם פיזור מוגדר בין רמות החשיבה. מחשב את זמן הפתרון ומכפיל בשלוש כדי לוודא שהמבחן נכנס בזמן הבחינה, מגביל שאלה ל-20 נקודות לכל היותר, ומוודא שאין שאלה שתלויה בתשובה של שאלה אחרת. המפתח כולל פיצול נקודות בתוך כל שאלה ומה מקבל ניקוד חלקי, והשאלות נבדקות לפני המסירה.

  '
output: קובץ Word עם דף מבחן, מפתח תשובות עם פיצול נקודות ודף מורה
requires:
- write-graded-questions
- build-rubric
- verify-solutions
- hebrew-docs-rtl
- format-equations-for-hebrew-worksheets
role: main
tested:
- טרם נבדק בג'מיני. הסקיל נכתב ב-2026-11-11 וממתין לבדיקה של מורה
limitations:
- טרם נבדק על מבחן במקצוע הומני, שבו רוב השאלות פתוחות
- הערכת זמן הפתרון היא הערכה של המודל, ולא נבדקה מול כיתה אמיתית
- הסקיל קורא לארבעה סקילים אחרים, ולא נבדק האם ג'מיני מצליח להחזיק את כולם בבקשה אחת
