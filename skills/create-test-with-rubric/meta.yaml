name: create-test-with-rubric
title: מבחן עם מפתח ומחוון
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שבונה מבחן, בוחן או מתכונת
problem: 'מבחן שנבנה מהר מגיע עם ניקוד שמסתכם ל-97, עם סעיף ב'' שתלוי בתשובה של סעיף א'' כך שתלמיד שטעה פעם אחת מאבד שאלה שלמה, ועם מפתח שיש בו רק תשובות סופיות — ולכן הבדיקה לוקחת שלוש שעות ומסתיימת בוויכוחים על חלקי ניקוד.

  '
what_it_does: 'בונה קודם מפרט מבחן ומוודא בחישוב שהניקוד מסתכם ל-100, עם פיזור מוגדר בין רמות החשיבה. מחשב את זמן הפתרון ומכפיל בשלוש כדי לוודא שהמבחן נכנס בזמן הבחינה, מגביל שאלה ל-20 נקודות לכל היותר, ומוודא שאין שאלה שתלויה בתשובה של שאלה אחרת. המפתח כולל פיצול נקודות בתוך כל שאלה ומה מקבל ניקוד חלקי, והשאלות נבדקות לפני המסירה.

  '
output: קובץ Word עם דף מבחן, מפתח תשובות עם פיצול נקודות ודף מורה
requires:
- write-graded-questions
- build-rubric
- verify-solutions
- hebrew-docs-rtl
- format-equations-for-hebrew-worksheets
role: main
tested:
- '2026-11-11, Gemini 3.1 Pro: מבחן של 45 דקות על מערכת העיכול לכיתה ז'', "כקובץ Word". יצר קובץ עם שש שאלות. הניקוד נספר ביד ומסתכם בדיוק ל-100 (12+16+18+18+18+18), אין שאלה מעל 20, ופיצול הנקודות בשאלות 3, 5 ו-6 מסתכם נכון (בשאלות 1, 2 ו-4 לא בדקתי את הפיצול). ציין שהמורה פותר בכ-12 דקות, כלומר כ-36 דקות לתלמיד'
limitations:
- 'נבדק רק ב-Gemini 3.1 Pro. ב-2026-11-11 בחשבון הבדיקה Flash ענה רק על שאלות של שורה אחת, ועל שאלות הבדיקה החזיר סירוב גנרי או נתקע; Thinking נתקע או סירב גם על "מה בירת איטליה". באותו יום, בחשבון גוגל רגיל עם 9 סקילים, Flash ענה כרגיל על אותן שאלות. לא ברור אם ההבדל הוא בחשבון ה-Workspace או ב-36 הסקילים שהיו מותקנים בו. איך הסקיל הזה מתנהג ב-Flash, ברירת המחדל של רוב המורים, עוד לא נבדק'
- 'נבדק הניקוד ולא מפתח התשובות שורה אחר שורה'
- 'טרם נבדק על מבחן במקצוע הומני, שבו רוב השאלות פתוחות'
- 'לא ידוע אם ג''מיני הפעיל בפועל את build-rubric ואת write-graded-questions או עשה את העבודה בלעדיהם'
