name: check-science-simulation
title: בדיקת סימולציה למדעים לפני הכיתה
version: 1.2.0
updated: 2026-11-21
subjects:
- מדעים
- פיזיקה
- ביולוגיה
- כימיה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים למדעים, כיתות ז'-ט'
who:
- מורים
problem: 'בניתם סימולציה ב-Canvas, והיא נראית בסדר. קשה לדעת אם יש בה שגיאה בחישוב או ציור שמלמד תפיסה שגויה.'
benefit: פחות סימולציות עם טעות מדעית מגיעות לכיתה.
what_it_does: 'קורא מה הקוד באמת מחשב, מחשב את אותו דבר מחדש ב-Python, ובודק אנרגיה, מסה, יחידות וערכי קצה. בודק אם הציור מלמד טעות ואם העברית שבורה. מחזיר טבלת ממצאים וקוד מתוקן.'
output: 'בצ''אט: טבלת ממצאים, מה נבדק, והקוד המלא המתוקן'
role: main
category: עזרי הוראה
fixes:
  source: 'מתוך בקשה של מורה ל-Gemini Flash, בלי הסקיל ועם הסקיל, 21.11.2026. הסימולציות צולמו בדפדפן בגודל של טלפון.'
  intro: 'בלי בדיקה, סימולציה עם טעות מדעית מגיעה לכיתה:'
  list:
  - without: 'סימולציה שנבנתה בלי סקיל: החלקיקים מחליפים צבע כשמחממים, והטמפרטורה כתובה הפוך.'
    quote: 'C° 120'
    with: 'אחרי הבדיקה, החלקיקים באותו צבע בכל טמפרטורה, והטמפרטורה כתובה נכון.'
hidden: true
tested:
- '25 בקשות של מורים למדעים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash), רובן עם סימולציה שיש בה 1-3 טעויות. גרסה 1.1: 15 מתוך 25 קיבלו ציון 7 ומעלה, ממוצע 6.8'
- 'על 3 סימולציות שג''מיני בנה בלי סקיל, הבדיקה מצאה בכל אחת בעיה אמיתית, למשל חלקיקים שמחליפים צבע בחימום'
limitations:
- 'עוד לא עובר את הסף של האתר (20 מתוך 25)'
- 'בסימולציה תקינה הוא עדיין ממציא לפעמים בעיות. גרסה 1.2 מוסיפה כלל נגד זה, ועוד לא נבדקה'
- 'בתיקון של עברית ליד מספרים הוא עלול להפוך יחידות בעברית. לבדוק את הסימולציה המתוקנת בטלפון'
- לא נבדק באפליקציה של Gemini או בחשבון של בית ספר
simple: 'מדביקים לג''מיני את הקוד של הסימולציה. מקבלים רשימה של הטעויות שנמצאו, וסימולציה מתוקנת.'
uses:
- when: 'לפני שמראים סימולציה בכיתה'
  ask: 'תבדוק אם הסימולציה הזאת נכונה מדעית לכיתה ח'': [כאן מדביקים את הקוד]'
  get: 'טבלה של מה שנמצא, מה נבדק ב-Python, והקוד המתוקן.'
- when: 'משהו בסימולציה מתנהג מוזר'
  ask: 'הכדור בסימולציה קופץ כל פעם יותר גבוה. מה הבעיה? [כאן מדביקים את הקוד]'
  get: 'הסיבה בקוד, התיקון, ובדיקה שהאנרגיה כבר לא עולה.'
- when: 'העברית במסך הפוכה'
  ask: 'המספרים והיחידות בסימולציה יוצאים הפוכים. תתקן: [כאן מדביקים את הקוד]'
  get: 'קוד שבו כל הטקסט בעברית נכון, גם ליד מספרים, וגם בטלפון.'
