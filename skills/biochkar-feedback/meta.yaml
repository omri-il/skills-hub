name: biochkar-feedback
title: משוב על עבודת ביוחקר
version: 1.3.0
updated: 2026-11-21
subjects:
- ביולוגיה
platforms:
  tested: []
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים לביולוגיה שמלווים עבודות ביוחקר
who:
- מורים
problem: 'בדיקה של טיוטות ביוחקר לוקחת שעות. בכל צוות צריך לבדוק שוב את אותם כללים: שאלת חקר, השערה, טיפולים, חזרות ובקרה.'
benefit: 'בדיקה לפי ההנחיות הרשמיות, ומשוב לצוות שמוכן להעתקה.'
what_it_does: 'בודק את החלק שהדבקתם לפי חוברת ההנחיות לביוחקר (תשפ"ז): שאלת חקר, השערה, בסיס ביולוגי, מערך החקר, תוצאות ודיון. מחזיר טבלה למורה ומשוב קצר לצוות עם שאלות מכוונות, בלי לכתוב את העבודה במקום התלמידים.'
output: טבלת בדיקה למורה ומשוב לצוות להעתקה
role: main
hidden: true
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: בגרסה 1.1.0 13 מתוך 25 קיבלו 7 ומעלה, בגרסה 1.2.0 10, ובגרסה 1.3.0 11'
- 'אותן 25 בקשות על gemini-3.1-pro-preview, בגרסה 1.3.0: 10 מתוך 25'
- 'באפליקציה של Gemini (21.11.2026): במצב Hydrogen ג''מיני לא קרא את הסקיל גם עם @. במצב Hydrogen Thinking עם @ הוא קרא אותו, אבל לא כתב את טבלת הבדיקה'
limitations:
- 'הסקיל לא יודע אם התלמידים השתמשו ב-AI, ולא נותן ציון אם לא ביקשתם'
- 'הבעיה העיקרית: המשוב לצוות מגלה לפעמים את התשובה (מושג, רמת ארגון, אורגניזם) במקום לשאול'
simple: 'מדביקים לג''מיני חלק מעבודת ביוחקר. הוא בודק אותו לפי ההנחיות של משרד החינוך, ומחזיר משוב קצר שאפשר להעביר לצוות.'
uses:
- when: 'הצוות שלח שאלת חקר והשערה'
  ask: 'תבדוק את שאלת החקר וההשערה של הצוות: [כאן מדביקים את הטקסט]'
  get: 'מה תקין ומה חסר, ו-3 עד 5 שאלות מכוונות לצוות.'
- when: 'הצעת מחקר לפני הניסוי'
  ask: 'תבדוק את מערך הניסוי הזה לפני שהם מתחילים: [כאן מדביקים את ההצעה]'
  get: 'בדיקה של טיפולים, חזרות, גורמים קבועים ובקרה, לפני שמבזבזים שבועות.'
- when: 'טיוטה של דיון'
  ask: 'תן משוב על הדיון והמסקנות של העבודה: [כאן מדביקים את הדיון]'
  get: 'טבלה למורה, ומשוב לצוות להעתקה ל-Classroom או ל-Docs.'
