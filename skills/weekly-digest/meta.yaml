name: weekly-digest
title: סיכום שבועי מהמייל ומהיומן
version: 1.1.0
updated: 2026-11-19
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
audience: מורים, מחנכים, רכזים ויועצות
problem: עשרות מיילים בשבוע, וקל לפספס שאלה של הורה או מועד שלא נכנס ליומן.
benefit: סיכום של דקה במקום לעבור על כל המיילים.
what_it_does: 'קורא את המייל והיומן של השבוע (קריאה בלבד) ומחזיר: מה מחכה לתשובה, מה בשבוע הבא, ואילו מועדים חסרים ביומן. לא שולח ולא מוחק כלום.'
output: סיכום בצ'אט, ב-5 חלקים
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: בגרסה 1.1.0 ממוצע 6.9, ו-16 מתוך 25 קיבלו 7 ומעלה (בגרסה 1.0.0: 5.3, ו-9 מתוך 25)'
- 'בלי חיבור ל-Gmail ג''מיני אמר שצריך לחבר, ולא המציא סיכום'
limitations:
- המיילים והיומן הודבקו בבקשה, כי ב-API אין חיבור. לא נבדק עם Gmail אמיתי באפליקציה, וגם לא כמשימה מתוזמנת
- 'לפעמים המספר בשורה הראשונה שגוי ב-1, או שמועד מהמייל חסר ב"להוסיף ליומן". כדאי לבדוק מול המייל'
- עובד רק כש-Gmail ו-Calendar מחוברים לג'מיני. בבית ספר זה יכול להיות חסום
simple: 'ג''מיני קורא את המייל והיומן שלכם מהשבוע, ואומר מה מחכה לתשובה ומה בשבוע הבא. הוא רק קורא: לא שולח ולא מוחק כלום. צריך לחבר את Gmail והיומן לג''מיני.'
uses:
- when: 'סוף שבוע'
  ask: 'תסכם לי את השבוע מהמייל ומהיומן.'
  get: 'מה מחכה לתשובה, מה בשבוע הבא, ואילו מועדים חסרים ביומן.'
- when: 'לא לפספס הורים'
  ask: 'על אילו מיילים מהשבוע עוד לא עניתי?'
  get: 'רשימה של מיילים שמחכים לתשובה שלכם.'
- when: 'לפני שבוע עמוס'
  ask: 'תכין אותי לשבוע הבא. מה הוזכר במייל ועוד לא נכנס ליומן?'
  get: 'מה יש בשבוע הבא, ורשימה של מועדים מהמייל שחסרים ביומן.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בסיכום השבועי 2 טעויות נפוצות:'
  list:
  - without: 'סיכום מומצא כשהמייל לא מחובר.'
    with: 'עם הסקיל, Gemini אומר שצריך לחבר את Gmail.'
  - without: 'שם של תלמיד ומצב רפואי בתוך הסיכום.'
    with: 'עם הסקיל, כתוב רק מי שלח ועל איזה נושא.'
