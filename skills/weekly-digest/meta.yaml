name: weekly-digest
title: סיכום שבועי מהמייל ומהיומן
version: 1.0.0
updated: 2026-11-07
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
audience: מורים, מחנכים, רכזים ויועצות שמקבלים הרבה מיילים
problem: 'עשרות מיילים בשבוע מהנהלה, מהורים ומרכזים. קל לפספס שאלה שחיכתה לתשובה, או מועד שהופיע במייל ולא נכנס ליומן.

  '
benefit: 'סיכום של דקה במקום לעבור על עשרות מיילים. קל יותר לראות איזו שאלה של הורה עוד מחכה לתשובה.'
what_it_does: 'קורא את המיילים והיומן של השבוע (בגישת קריאה בלבד) ומחזיר סיכום של דקה: מה מחכה לתשובה שלך, מה קרה השבוע, מה בשבוע הבא ומה להכין, ואילו מועדים מהמיילים חסרים ביומן. אפשר לתזמן אותו כך שיגיע לבד כל שבוע. לא שולח, לא מוחק ולא משנה כלום.

  '
output: סיכום בצ'אט בחמישה חלקים קצרים
requires: []
role: main
tested:
- עוד לא נבדק
limitations:
- עובד רק כש-Gmail ו-Google Calendar מחוברים לג'מיני. בחשבון של בית ספר ייתכן שזה חסום
- עוד לא נבדק כמשימה מתוזמנת
