name: draw-worksheet-diagrams
title: שרטוטים לדפי עבודה
version: 1.0.0
updated: 2026-11-10
subjects:
- מתמטיקה
- גיאומטריה
- פיזיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים למתמטיקה ולמדעים
problem: 'כשמבקשים מג''מיני שרטוט לדף עבודה, הוא יוצר תמונה במחולל תמונות: הזוויות והאורכים לא מתאימים לנתונים, והכיתוב בתמונה, בעיקר בעברית, משתבש.

  '
what_it_does: 'מגדיר לג''מיני לשרטט כל שרטוט בקוד, לפי קואורדינטות שמחושבות מהנתונים, ולהכניס אותו לקובץ ה-Word: משולשים, מרובעים, מעגלים, זוויות, מערכות צירים וגרפים, תרשימי כוחות, מישור משופע ומעגלים חשמליים. התוויות רק באותיות לועזיות, ביוונית ובמספרים, והעברית נשארת בטקסט השאלה.

  '
output: שרטוטים בתוך קובץ ה-Word של דף העבודה
requires: []
role: shared
tested:
- עוד לא נבדק בג'מיני. הקוד שבסקיל נבדק בהרצה במחשב, על משולש לפי שלוש צלעות, מישור משופע עם כוחות, מעגל חשמלי וגרף מהירות-זמן
limitations:
- שרטוטים מסובכים (גופים במרחב, מערכות אופטיות) עוד אין להם תבנית מוכנה, וג'מיני צריך לבנות אותם מקווים וחיצים
