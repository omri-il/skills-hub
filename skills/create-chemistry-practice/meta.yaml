name: create-chemistry-practice
title: דפי תרגול בכימיה
version: 1.5.0
updated: 2026-11-19
subjects:
- כימיה
- ביולוגיה
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים לכימיה ולביולוגיה
who:
- מורים
problem: 'בדף כימיה בעברית קל לטעות: ניסוח לא מאוזן במפתח, מטען שגוי, חץ הפוך. ג''מיני בלי הנחיות נופל בזה.'
benefit: דף תרגול עם מפתח תשובות שנבדק.
what_it_does: 'יוצר דף עבודה לפי כיתה ונושא: איזון ניסוחים, מול, חומצות ובסיסים ועוד. בודק כל ניסוח, ומצרף מפתח עם חישוב מלא.'
output: קובץ Word עם דף תלמיד ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- verify-solutions
role: main
category: עזרי הוראה
tested:
- 'דף חומצות ובסיסים לכיתה י'': ניסוחים, חצים ומפתח נכונים בקובץ Word'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 9 מתוך 25 קיבלו 7 ומעלה. בגרסה 1.4.0, עם בנייה הוגנת של הקובץ: 6 מתוך 25'
- 'הבעיה העיקרית בגרסה 1.4.0: ג''מיני שם מספרים וניסוחים כמשוואות Word באמצע משפט בעברית, והם קופצים לסוף השורה'
- 'בגרסה 1.5.0 הכול בדף הוא טקסט רגיל, בלי משוואות Word (19.11.2026, אותן 25 בקשות): 23 מתוך 25 קיבלו 7 ומעלה. ב-9 מהן הציון ניתן מחדש לתשובות השמורות של ג''מיני, אחרי תיקון בבנייה של הקובץ. 2 קבצים נבדקו כתמונה ב-Word'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
- 'באפליקציה של Gemini, כשכל 25 הסקילים מותקנים (19.11.2026, מצב Hydrogen Thinking): דף בכימיה יצא כקובץ Word עם ניסוחים, בלי סימני $'
- 'אותן 25 בקשות, Flash מול Pro (21.11.2026): ב-Flash 14 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.5. ב-Pro (gemini-3.1-pro-preview): 16 מתוך 25, ממוצע 7.2'
limitations:
- 'במצב המהיר יש עדיין טעויות קטנות: ספרות משמעותיות במפתח, מילה משובשת, ולפעמים השאלה מגלה חלק מהתשובה. כדאי לעבור על הדף לפני ההדפסה'
- בלי המילים "כקובץ Word" ג'מיני ענה פעם אחת בצ'אט, עם LaTeX
- לא נבדק על כל הנושאים (חמצון-חיזור, מבנה וקישור)
simple: 'אומרים לג''מיני כיתה ונושא בכימיה. הוא יוצר דף עבודה בקובץ Word עם מפתח תשובות, וכל ניסוח בדף נבדק.'
uses:
- when: 'דף תרגול לשיעור'
  ask: 'דף עבודה באיזון ניסוחים לכיתה י'', כקובץ Word.'
  get: 'דף לתלמיד ומפתח עם פתרון מלא. כל הניסוחים מאוזנים.'
- when: 'חזרה לפני מבחן'
  ask: 'דף חזרה על מול וחישובי מסה לכיתה י"א, 8 שאלות מהקל לקשה.'
  get: 'שאלות מדורגות, ומפתח עם כל שלבי החישוב.'
- when: 'חומצות ובסיסים'
  ask: 'דף עבודה על חומצות ובסיסים לכיתה ט'', עם ניסוחים של תגובות.'
  get: 'דף מוכן להדפסה. המטענים והחצים במקום הנכון.'
fixes:
  also: 'לבנות קובץ Word מוכן להדפסה, לספור את האטומים בכל ניסוח, ולבדוק מטענים וכיוון של חץ.'
hidden: true
