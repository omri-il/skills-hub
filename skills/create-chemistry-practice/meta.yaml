name: create-chemistry-practice
title: דפי תרגול בכימיה
version: 1.3.0
updated: 2026-11-07
subjects:
- כימיה
- ביולוגיה
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים לכימיה ולביולוגיה
who: [מורים]
problem: 'בדפי כימיה בעברית יש מלכודות שקל לפספס: ניסוח לא מאוזן במפתח, מטען שגוי ביון, חץ שיוצא הפוך בדף עברי, ומטענים שקופצים לתחילת השורה. ג''מיני בלי הנחיות נופל ברוב המלכודות האלה.

  '
benefit: 'דף תרגול עם מפתח תשובות שנבדק. פחות ניסוחים, מטענים וחצים נשארים לך לבדוק.'
what_it_does: 'יוצר דף עבודה בכימיה לפי כיתה ונושא: איזון ניסוחים, חישובי מול וסטויכיומטריה, חומצות ובסיסים, שיווי משקל ועוד. כולל תיבת נתונים עם מסות אטומיות, בודק איזון אטומים ומטענים בכל ניסוח, ומצרף מפתח תשובות עם חישוב מלא ויחידות. משתמש בסקיל העיצוב ובסקיל הבדיקה.

  '
output: קובץ Word עם דף תלמיד ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- verify-solutions
role: main
tested:
- 'דף חומצות ובסיסים לכיתה י'': ניסוחים ביוניקוד, חצים נכונים, מצבי צבירה, ומפתח תשובות בקובץ Word'
limitations:
- בבקשה בלי "כקובץ Word" ג'מיני ענה פעם אחת בצ'אט וכתב ניסוחים ב-LaTeX. עם "כקובץ Word" זה עבד
- עדיין לא נבדק על מגוון נושאים מלא (חמצון-חיזור, מבנה וקישור)
