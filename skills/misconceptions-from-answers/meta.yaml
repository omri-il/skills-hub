name: misconceptions-from-answers
title: טעויות שחוזרות בתשובות של הכיתה
version: 1.1.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים בכל מקצוע
who:
- מורים
fits:
- ריאליים
- רב-מלל
problem: 30 תשובות פתוחות מחכות, ואין זמן לגלות איזו טעות הכי נפוצה.
benefit: מיון של כל התשובות לקבוצות, עם ציטוטים ופעילות לשיעור הבא.
what_it_does: 'ממיין תשובות לפי ההבנה: הבינו, בכיוון, וכל טעות שחוזרת כקבוצה משלה. סופר, מצטט, ומציע פעילות שסותרת את הטעות.'
output: 'בצ''אט: קבוצות עם ציטוטים, פעילות ושאלה לבדיקה חוזרת'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 7.2, ו-16 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 6.2'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: בשתי הרצות, 13 ו-15 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.0. בגרסה הקודמת, באותו יום: 18 ו-18'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- לפעמים טעות של 2 תלמידים נכנסת ל"טעויות בודדות"
simple: 'מדביקים לג''מיני את התשובות של התלמידים. ג''מיני אומר כמה הבינו, איזו טעות הכי חוזרת, ומה לעשות איתה בשיעור הבא.'
uses:
- when: 'אחרי כרטיס יציאה'
  ask: 'אלה כרטיסי היציאה של ז''3 מהיום. השאלה הייתה: למה קרח צף על מים? [כאן מדביקים את התשובות, תשובה בכל שורה]'
  get: 'כמה תלמידים הבינו, איזו טעות חוזרת אצל כמה מהם, ופעילות של 10 דקות לשיעור מחר.'
- when: 'שאלה פתוחה במבחן'
  ask: 'בדקתי את שאלה 4 במבחן בהיסטוריה. הנה 28 התשובות. מה הטעות שהכי חוזרת?'
  get: 'טבלה: כל טעות, כמה תלמידים עשו אותה, ציטוט מהתשובות, ומה הם כנראה חשבו.'
- when: 'תשובות מטופס Google Forms'
  ask: 'העתקתי את עמודת התשובות מהטופס של שיעורי הבית בשברים. מה הם לא הבינו?'
  get: 'תמונת מצב של הכיתה, ושאלה אחת לתחילת השיעור הבא, כדי לבדוק אם הטעות נעלמה.'
fixes:
  source: 'מתוך 25 בקשות של מורים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 21.11.2026.'
  list:
  - without: 'כששאלתם אם תלמידים כתבו עם AI, קובע בביטחון שכן, ואפילו נותן אחוזים. ב-2 מתוך 25 בקשות.'
    quote: 'בוודאות כמעט מוחלטת (99%) בינה מלאכותית'
    with: 'עונה במשפט אחד שאי אפשר לדעת את זה מהטקסט, ומציע שיחה קצרה שלא מאשימה את התלמיד.'
  - without: 'חוזר בתשובה על שמות מלאים של תלמידים, ואפילו כותב את האבחון של כל תלמיד ליד השם. ב-3 מתוך 25 בקשות.'
    quote: 'מתן (ASD), נטע (ASD), אלמוג (ASD)'
    with: 'כותב רק שם פרטי, בלי שם משפחה ובלי אבחון, ומציע פעם אחת להחליף שמות במספרים בפעם הבאה.'
  - without: 'עוד לפני שהדבקתם את התשובות, ממציא טעויות שהתלמידים כאילו כתבו, וכותב עליהן ניתוח ארוך. ב-2 מתוך 25 בקשות.'
    quote: 'יונה ברח כי הוא פחד מאנשי נינווה'
    with: 'כשאין עדיין תשובות, מבקש בהודעה אחת קצרה את השאלה, את התשובות ואת התשובה שציפיתם לה.'
  - without: 'לא נותן שאלה קצרה לבדוק בשיעור הבא אם הטעות נעלמה, ובחלק מהתשובות רק ממליץ להסביר שוב. ב-17 מתוך 25 בקשות.'
    quote: 'להסביר מדויק מדוע הבריטים בחרו בניסוח המעורפל'
    with: 'מציע פעילות קצרה שבה התלמידים קודם מנבאים ואז בודקים משהו שסותר את הניבוי, ומסיים בשאלה אחת לבדיקה חוזרת.'
  also: 'למיין לפי מה שהתלמידים הבינו, לתת שם לכל טעות, ולבדוק שהסכום שווה למספר התשובות.'
hidden: true
