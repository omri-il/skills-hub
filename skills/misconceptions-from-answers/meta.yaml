name: misconceptions-from-answers
title: 'טעויות שחוזרות בתשובות של הכיתה'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים בכל מקצוע'
who: [מורים]
fits: [ריאליים, רב-מלל]
problem: '30 כרטיסי יציאה או תשובות פתוחות מחכים לקריאה, ואין זמן לגלות לפני השיעור הבא איזו טעות הכי נפוצה.'
benefit: 'מיון של כל התשובות לקבוצות, עם ציטוטים ופעילות לשיעור הבא, בדקה.'
what_it_does: 'ממיין תשובות פתוחות לפי ההבנה: הבינו, בכיוון, כל טעות שחוזרת אצל 2 תלמידים או יותר כקבוצה משלה, טעויות בודדות ולא ענו. סופר, מצטט מילה במילה, ומציע פעילות שבה התלמידים מנבאים ואז בודקים משהו שסותר את הטעות.'
output: 'בצ''אט: טבלת קבוצות עם ציטוטים, פעילות לשיעור הבא ושאלה לבדיקה חוזרת'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 7.2, ו-16 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 7.2'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 6.2'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'לפעמים טעות שחוזרת אצל 2 תלמידים נכנסת ל"טעויות בודדות", או שתשובה בלי הסבר נכנסת ל"הבינו"'
