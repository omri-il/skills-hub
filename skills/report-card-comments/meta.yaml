name: report-card-comments
title: הערכה מילולית לתעודה, פסקה אישית לכל תלמיד
version: 1.2.0
updated: 2026-11-21
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מחנכים ומורים, כיתות א'-י"ב
who:
- מחנכים
- מורים
problem: 30 הערכות לתעודה לוקחות ערב שלם. ג'מיני בלי הנחיות כותב פסקאות שנשמעות אותו דבר, מתבלבל במגדר וממציא הישגים.
benefit: טיוטה של פסקה אישית לכל תלמיד, בסגנון שלכם, שאתם רק קוראים ומשנים.
what_it_does: 'לומד את הסגנון מפסקה אחת שלכם. לכל תלמיד: פסקה עם חוזקה ויעד, רק מההערות שכתבתם, במגדר הנכון בכל מילה. בלי שמות, בלי אבחונים, ובלי 2 פסקאות שנפתחות אותו דבר.'
output: 'בצ''אט: טבלה שמדביקים ב-Sheets, עם מספר ופסקה לכל תלמיד'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מחנכים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: 1 מתוך 25 קיבל 7 ומעלה, ממוצע 5.4. אחרי 2 תיקונים, בגרסה 1.2.0: 11 מתוך 25, ממוצע 6.2'
- 'בגרסה 1.2.0, אותן 25 בקשות במודל Pro (21.11.2026, gemini-3.1-pro-preview): 16 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.9. את הציונים נתן Claude בתוך Claude Code, באותן הוראות בדיקה'
limitations:
- 'עובד טוב רק במצב Pro של ג''מיני. ב-Flash הוא מוסיף יותר שבחים שלא כתבתם וחוזר על אותם משפטים'
- 'לפעמים מוסיף מילה כמו "מאוד" או פרט קטן שלא היה בהערות. לקרוא כל פסקה לפני שמדביקים בתעודה'
- 'לא סופר תווים. את האורך בודקים בגיליון עם =LEN'
- 'לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @'
simple: 'נותנים לג''מיני פסקה אחת שכתבתם, ו-2-3 מילים על כל תלמיד. מקבלים פסקה אישית לכל תלמיד, בסגנון שלכם.'
uses:
- when: 'תעודת מחצית לכל הכיתה'
  ask: 'זו פסקה שכתבתי בעבר, וזו רשימת התלמידים: מספר, ב/ת והערות. תכתוב הערכה מילולית לכל אחד. [כאן מדביקים את הפסקה ואת הרשימה]'
  get: 'טבלה עם פסקה אישית לכל תלמיד, ו-[שם] במקום השם.'
- when: 'מערכת התעודות מגבילה את האורך'
  ask: 'עד 250 תווים לכל תלמיד, בפנייה ישירה לתלמיד. [כאן מדביקים את הרשימה]'
  get: 'פסקאות קצרות, ונוסחה לבדיקת האורך בגיליון.'
- when: 'משפט "ממני אליך" בסוף השנה'
  ask: 'תכתוב לכל תלמיד משפט אישי אחד ממני, לסוף השנה. [כאן מדביקים את הרשימה]'
  get: 'משפט חם ושונה לכל תלמיד, במגדר הנכון.'
needs_pro: true
fixes:
  intro: 'בלי הסקיל, Gemini עושה בהערכות לתעודה 3 טעויות נפוצות:'
  list:
  - without: 'פסקאות שנשמעות אותו דבר, עם אותה פתיחה ואותה ברכה.'
    with: 'עם הסקיל, כל פסקה נפתחת אחרת, וברכה מופיעה רק בחלק מהן.'
  - without: 'שבחים והישגים שלא כתבתם בהערות.'
    with: 'עם הסקיל, כל משפט נשען על הערה שלכם על אותו תלמיד.'
  - without: 'שמות, אבחונים ומצב משפחתי נכנסים לפסקה.'
    with: 'עם הסקיל, במקום השם יש [שם], ופרטים רגישים נשארים בחוץ.'
