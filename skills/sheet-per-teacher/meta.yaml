name: sheet-per-teacher
title: גיליון אחד, וכל מורה רואה רק את הנתונים שלו (Apps Script)
version: 1.4.0
updated: 2026-11-26
subjects:
- ניהול וארגון
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: רכזים ומנהלים, גם בלי ניסיון בקוד
who:
- רכזים
- מנהלים
- מחנכים
problem: 'רוצים לשתף גיליון אחד כך שכל מורה יראה רק את הלשונית שלו, אבל ב-Google Sheets אי אפשר להסתיר לשונית ממי שהקובץ משותף איתו.'
benefit: כל מורה מקבל קובץ משלו עם הנתונים שלו בלבד, והקובץ מתעדכן לבד מהגיליון שלכם.
what_it_does: 'כותב קוד Apps Script עם תפריט בגיליון: יוצר קובץ לכל מורה, משתף אותו רק עם המייל של המורה בצפייה בלבד, ומעדכן אותו כל 5 דקות, רק כשמשהו השתנה. עמודות רגישות כמו ת"ז לא עוברות. מסביר גם מתי מספיקה IMPORTRANGE בלי קוד.'
output: 'בצ''אט: Code.gs מלא והוראות הפעלה צעד אחר צעד'
role: main
category: וייב קודינג
tested:
- 'גרסה 1.4.0 (26.11.2026), הקוד ש-Gemini כתב הורץ בגיליון בדיקה אמיתי בחשבון של בית ספר: כפתור 1 יצר לשונית שיתוף מימין לשמאל עם 3 המחנכים. אחרי מייל ליד מחנך אחד, כפתור 2 יצר קובץ אחד עם 2 התלמידים שלו בלבד ובלי עמודת הת"ז, משותף רק עם המייל הזה בצפייה בלבד. ליד 2 המחנכים בלי מייל נכתב "חסר מייל". לחיצה שנייה על 2 כתבה "ללא שינוי" ולא יצרה קובץ כפול. בחשבון בית הספר לא הופיע המסך "Google לא אימתה את האפליקציה"'
- 'גרסה 1.4.0 (26.11.2026), באפליקציה של Gemini, בחשבון של בית ספר (מצב Hydrogen): צירפתי גיליון בדיקה מ-Drive עם טבלה אחת, עמודת "מחנך" ועמודת "ת.ז", וכתבתי רק "אני רוצה שכל מחנך יראה רק את התלמידים שלו". Gemini מצא לבד את עמודת המחנך והסתיר לבד את הת"ז. בתפריט רק 2 כפתורים, והעדכון האוטומטי מתחיל בלחיצה על 2. בריצה הראשונה Gemini כתב את שם הקובץ במקום שם הלשונית, והקוד היה נעצר. תיקנתי, ובריצה השנייה הקוד קורא מהלשונית הראשונה. את הקוד עצמו לא הרצתי בגיליון אמיתי'
- 'גרסה 1.3.0 (20.11.2026): הקוד עוצר אחרי 5 דקות ואומר ללחוץ שוב, עובד גם בטבלה אחת וגם בלשונית לכל מורה, ומשתמש רק בהודעות קבועות בעברית. 25 בקשות ב-gemini-3.5-flash: Claude נתן 7 ומעלה ל-19 מתוך 25, ממוצע 7.2 (לפני: 17, ממוצע 6.8). ב-24 מתוך 24 התשובות עם קוד יש עצירה אחרי 5 דקות. ב-23 הקוד רץ בלי שגיאה. בתשובה אחת הקוד יצר קבצים כפולים בלחיצה השנייה'
- 'גרסה 1.2.0 (20.11.2026): תשובה קצרה יותר, ההוראות לפני הקוד, ובלי מילים טכניות מחוץ לקוד. 25 בקשות ב-gemini-3.5-flash: הטקסט לרכז ירד מ-455 מילים בממוצע ל-228. בכל 24 התשובות עם קוד ההוראות באו לפני הקוד, ורק באחת הופיעה מילה טכנית. ב-22 הקוד רץ בלי שגיאה, בלי קבצים כפולים ובלי נתונים של מורה אחר. Claude נתן ציון: 17 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.8. רוב ההורדות על הקוד: אין עצירה אחרי 5 דקות עם הרבה מורים, שמות שונים בתפריט, ומילה משובשת בהודעות'
- '25 בקשות של רכזים דרך ה-API של Gemini (20.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 22 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.6. בגרסה הראשונה, באותו יום: 18'
- 'גרסה 1.1.0 (20.11.2026): עדכון כל 5 דקות, וקובץ של מורה נכתב רק כשהנתונים שלו השתנו. 25 בקשות ב-gemini-3.5-flash: ב-22 הקוד רץ בלי שגיאה, ובכל 15 התשובות שיצרו קבצים, לחיצה שנייה לא כתבה שוב קובץ שלא השתנה. ציון של Claude לא נעשה. הגרסה עברה את סריקת האבטחה של Gemini והותקנה'
- 'גרסה 1.0.1 (20.11.2026): גרסה 1.0.0 נחסמה בסריקת האבטחה של Gemini בהעלאה, בגלל דוגמת הקוד המלאה. הוצאתי את הקוד ותיארתי אותו במילים. הגרסה הזאת עברה את הסריקה והותקנה ב-Gemini'
- 'אחרי השינוי, אותן 25 בקשות שוב (20.11.2026, gemini-3.5-flash): ב-22 מתוך 25 הקוד רץ בלי שגיאה בבדיקה האוטומטית (לפני: 24), ובאף תשובה אין שיתוף פתוח או נתונים של מורה אחר. ציון של Claude לא נעשה בריצה הזאת'
- 'הקוד הורץ בגיליון ובתיקיית Drive מדומים. בדקתי כמה קבצים נוצרו, עם מי כל קובץ שותף, ושאין בקובץ של מורה שורות של מורה אחר או עמודת ת"ז'
limitations:
- הקוד רץ בגיליון אמיתי רק בחשבון של בית ספר, עם 3 מחנכים. בחשבון Gmail פרטי ועם הרבה מורים הוא עוד לא נבדק
- לפעמים ג'מיני משנה את השמות בתפריט או כותב מילה משובשת בהוראות. לקרוא את ההוראות לפני שמריצים
- בחשבון של בית ספר לפעמים אי אפשר לשתף עם מייל פרטי (Gmail). אז משתפים עם המייל של המורה בבית הספר
- עדכון כל 5 דקות בחשבון Gmail פרטי עם הרבה מורים יכול לעבור את המכסה היומית של Google. אז משנים בקוד ל-15 דקות
- מחיקת מורה מהרשימה לא מבטלת את השיתוף. מבטלים בקובץ עצמו, בכפתור "שיתוף"
simple: 'יש לכם גיליון אחד עם נתונים של כל המורים? מצרפים אותו לג''מיני, וג''מיני כותב קוד שיוצר לכל מורה קובץ משלו, משותף רק איתו. כשמשנים את הגיליון שלכם, הקבצים של המורים מתעדכנים לבד.'
uses:
- when: 'לשונית לכל מורה'
  ask: 'יש לי גיליון נוכחות עם לשונית לכל מורה. אני רוצה שכל מורה יראה רק את הלשונית שלו. [כאן מצרפים את הגיליון: + ← הוספה מ-Drive]'
  get: 'קוד מוכן להדבקה, תפריט בגיליון, וקובץ לכל מורה שמשותף רק איתו.'
- when: 'טבלה אחת של כל השכבה'
  ask: 'יש לי טבלת ציונים של כל השכבה עם עמודה "מחנך". כל מחנך צריך לראות רק את הכיתה שלו, בלי עמודת הת"ז. [כאן מצרפים את הגיליון: + ← הוספה מ-Drive]'
  get: 'קוד שמפצל את הטבלה לפי המחנך, משאיר את הת"ז רק אצלכם, ומעדכן כל 5 דקות.'
- when: 'רוצים בלי קוד'
  ask: 'יש לי 4 מורים, ואני לא רוצה קוד. איך כל אחד יראה רק את הלשונית שלו?'
  get: 'הסבר על IMPORTRANGE צעד אחר צעד, ומה חשוב לא לעשות כדי שלא יראו נתונים של אחרים.'
story: |
  בקבוצות הוואטסאפ של מורים שעובדים עם Google, אותה שאלה עלתה 5 פעמים ביומיים: איך משתפים גיליון אחד כך שכל מורה יראה רק את הלשונית שלו.

  התשובות סתרו זו את זו: להסתיר לשונית, להגן על טווח, IMPORTRANGE. רק חלק מהן באמת שומרות על הנתונים. הסקיל הזה נותן את התשובה שעובדת, ואומר בגלוי מה לא עובד ולמה.
fixes:
  source: 'מתוך 25 בקשות של מורים ל-Gemini Pro, בלי הסקיל ועם הסקיל, 21.11.2026.'
  list:
  - without: 'הנוסחה מעבירה לקובץ של המורה גם עמודות שביקשתם להשאיר אצלכם, כמו ת"ז ואבחון. ב-3 מתוך 25 בקשות.'
    quote: 'עכשיו כל הטבלה שלך תופיע בקובץ של מרים.'
    with: 'העמודות הרגישות שכתבתם לא עוברות לקובץ של המורה, ונשארות רק אצלכם.'
  - without: 'מציע גם דרך באותו קובץ, כמו נעילת לשונית או תצוגת סינון, שבה כל מורה עדיין רואה את הנתונים של כולם. ב-8 מתוך 25 בקשות.'
    quote: 'מורה א'' יכול להיכנס ללשונית של מורה ב'''
    with: 'אומר במשפט אחד שבאותו קובץ אי אפשר להסתיר, ונותן רק דרך של קובץ נפרד לכל מורה.'
  - without: 'במקום קוד, נותן נוסחה שצריך להדביק ביד בכל קובץ, וליצור ולשתף לבד קובץ לכל מורה. ב-21 מתוך 25 בקשות.'
    quote: 'חזרי על הפעולה בקבצים של יוסי ומירב.'
    with: 'קוד אחד יוצר קובץ לכל מורה, משתף אותו רק איתו ומעדכן אותו לבד, בלחיצה על תפריט בגיליון.'
  - without: 'מעתיק לתשובה שמות של תלמידים וציונים שהדבקתם, ואפילו מציע לשלוח אותם למורים בוואטסאפ. ב-5 מתוך 25 בקשות.'
    quote: 'את יכולה להעתיק כל טבלה ישירות למייל או לוואטסאפ של המחנך הרלוונטי'
    with: 'שמות של תלמידים, ת"ז ואבחונים לא חוזרים בתשובה. הם נשארים רק בגיליון שלכם.'
  also: 'לשתף כל קובץ רק בצפייה, לא ליצור קבצים כפולים בלחיצה שנייה, ולעדכן רק קובץ שהנתונים שלו השתנו.'
