name: staff-meeting-tasks
title: מישיבת צוות למשימות
version: 1.0.0
updated: 2026-11-21
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מנהלים, סגני מנהלים ורכזים שמנהלים ישיבות
who:
- מנהלים
- רכזים
problem: אחרי ישיבה כולם חושבים שסיכמו, ושבוע אחר כך אף אחד לא זוכר מי היה אמור לעשות מה.
benefit: סיכום והודעה לצוות מוכנים מיד אחרי הישיבה, עם כל משימה שאין לה אחראי מסומנת.
what_it_does: 'מקבל תמלול, סיכום של Meet או נקודות מהישיבה, וכותב: מה הוחלט, טבלה של מי עושה מה ועד מתי, מה נשאר פתוח, והודעת וואטסאפ לצוות. רק מה שנאמר. משימה בלי אחראי או תאריך מקבלת "לא נקבע".'
output: סיכום ישיבה עם טבלת משימות, הודעת וואטסאפ לצוות, ו-2-3 שורות למנהל על מה לבדוק
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מנהלים וסגני מנהלים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: בגרסה 1.0.0, 23 מתוך 25 קיבלו 7 ומעלה, ממוצע 8.2. בסבב הראשון באותו יום: 21 מתוך 25'
- 'ג''מיני כתב "לא נקבע" כשלא היה אחראי או תאריך, ולא המציא תאריך. מילים כמו "לפני החנוכה" נשארו כמו שנאמרו'
- 'כשלא הודבק חומר, ג''מיני שאל שאלה אחת קצרה, ואחרי התשובה כתב את הסיכום בלי לשאול שוב'
limitations:
- 'פרט על בריאות של תלמיד יכול לעבור להודעה לצוות דרך משימה, למשל הדרכה על מחלה. כדאי לקרוא את ההודעה לפני ששולחים'
- 'רעיון שעלה ולא הוחלט נעלם לפעמים מ"נשאר פתוח"'
- 'הבקשות נכתבו לבדיקה. לא נבדק עוד עם מנהל אמיתי באפליקציה של ג''מיני'
simple: 'מדביקים לג''מיני את מה שנאמר בישיבה, והוא כותב מה הוחלט, מי עושה מה ועד מתי, והודעה מוכנה לצוות.'
uses:
- when: 'אחרי ישיבת צוות'
  ask: 'תסכם את הישיבה ותכין הודעה לצוות. [כאן מדביקים את התמלול או את הנקודות]'
  get: 'סיכום עם טבלת משימות, והודעת וואטסאפ קצרה.'
- when: 'רק צריך לדעת מי עושה מה'
  ask: 'רק המשימות מהישיבה, מי ועד מתי. [כאן מדביקים את הסיכום של Meet]'
  get: 'טבלה של מה עושים, מי ועד מתי. מה שלא נקבע מסומן.'
- when: 'פרוטוקול לתיק'
  ask: 'תכתוב פרוטוקול רשמי של הישיבה. [כאן מדביקים את הנקודות]'
  get: 'פרוטוקול בפסקאות, בלי אימוג''י, מוכן למייל.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בסיכום של ישיבה 3 טעויות נפוצות:'
  list:
  - without: 'הופך הצעה שעלתה בישיבה להחלטה.'
    with: 'עם הסקיל, מה שלא סוכם עובר ל"נשאר פתוח".'
  - without: 'מנחש מי אחראי ועד מתי.'
    with: 'עם הסקיל, כתוב "לא נקבע", כדי שתראו מה חסר.'
  - without: 'מכניס להודעה לצוות פרטים רגישים על תלמיד.'
    with: 'עם הסקיל, הפרטים נשארים בחוץ, ותקבלו שורה על מה הורד.'
