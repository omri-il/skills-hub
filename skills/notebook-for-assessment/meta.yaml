name: notebook-for-assessment
title: 'Gemini Notebook שמתרגל ולא נותן תשובות'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים בכל מקצוע, מכיתה ז'' עד י"ב'
who: [מורים]
fits: [ריאליים, רב-מלל]
problem: 'תלמיד שמתרגל עם צ''אט רגיל מקבל תשובות מלאות ולומד פחות. ומורה שרוצה מחברת לתרגול או לבדיקה לא יודע מה לכתוב בהגדרות שלה.'
benefit: 'טקסט הגדרות מוכן להדבקה ב-Gemini Notebook, עם רשימת מקורות ובדיקות, בלי לנסח אותו לבד.'
what_it_does: 'בונה אחד משלושה: מתרגל לתלמידים ששואל ונותן רמזים ולא תשובות, עוזר בדיקה למורה לפי מחוון ועבודות לדוגמה, או מחולל שאלות מהמקורות. מחזיר אילו מקורות להעלות, טקסט הגדרות לצ''אט, 3 בקשות לבדיקה (אחת מנסה לשבור את הכלל), ומה המחברת לא עושה.'
output: 'בצ''אט: רשימת מקורות, טקסט הגדרות להדבקה ובקשות לבדיקה'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 7.5, ו-24 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 6.8'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 8.4'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'נבדק רק הטקסט שהסקיל כותב. לא נבדק איך Gemini Notebook עצמו מתנהג עם ההגדרות האלה'
