name: draw-math-figures
title: שרטוטים מדויקים לדפי מתמטיקה
version: 1.1.0
updated: 2026-11-11
subjects:
- מתמטיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים למתמטיקה, בעיקר ביסודי
problem: 'כשמבקשים מג''מיני לצייר זווית של 65°, הוא יוצר תמונה שנראית טוב, אבל אם מודדים אותה במד-זווית היא בכלל לא 65°. משולש "של 50° ו-70°" לא באמת נראה כך, ותלמיד שמודד מקבל תשובה אחרת מהמפתח.

  '
what_it_does: 'מצייר את השרטוט בקוד ולא בכלי התמונות: זוויות למדידה ולמיון, זוויות צמודות וקודקודיות, משולשים ומרובעים לפי זוויות, ישר מספרים ושברים כעיגול. השרטוט נכנס לקובץ ה-Word בגודל אמיתי, עם אותיות עבריות בקודקודים, והקוד מודד את הזוויות שצייר כדי שהמפתח יתאים לשרטוט.

  '
output: קובצי PNG בגודל הדפסה אמיתי שנכנסים לקובץ ה-Word, או תמונה גדולה להמחשה על הלוח
requires: []
role: shared
tested:
- 'נבדק במחשב, לא בג''מיני: הזוויות שהקוד מודד בשרטוט תואמות בדיוק (50°, 70°, 60° במשולש; 90°, 90°, 110°, 70° במרובע), האותיות העבריות יוצאות נכון, והשרטוטים נכנסים לקובץ Word בגודל שנקבע'
limitations:
- 'בג''מיני (Flash, 11.11.2026) בקשה כמו "תשרטט לי זווית של 65°" הלכה לכלי יצירת התמונות, גם כשבחרו את הסקיל עם @. הזווית בתמונה לא הייתה 65°'
- 'ב-11.11.2026 ג''מיני לא מסר קובצי Word בכלל: גם create-math-practice, שעבד קודם, בנה את הקובץ בקוד ואז ענה "אני רק AI מבוסס-טקסט". צריך לבדוק שוב כשזה יעבור'
- עדיין לא נבדק שהגודל נשמר אחרי שמירה כ-Google Docs והדפסה
- אין עדיין משבצות, תרגיל במאונך, שעון, סימטריה ומערכת צירים
example: תשרטט לי זווית של 65° בלי המספר, למדידה במד-זווית
