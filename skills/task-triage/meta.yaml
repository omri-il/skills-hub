name: task-triage
title: מרשימה ארוכה לשבוע מסודר
version: 1.0.0
updated: 2026-11-21
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מנהלים וסגני מנהלים עם יותר מדי משימות
who:
- מנהלים
- רכזים
problem: יש 40 דברים בראש וכולם נראים דחופים, ובסוף המנהל עושה הכל לבד.
benefit: רשימה קצרה של מה רק אתם עושים, והודעות מוכנות למי שמקבל את השאר.
what_it_does: 'מקבל את כל המשימות, המיילים והבקשות בלי סדר, ומחלק ל-4 קבוצות: רק אני, להעביר, לדחות, למחוק. בטיחות ותלמיד בסיכון תמיד ראשונים. לכל משימה שעוברת, הודעה קצרה: מה, עד מתי ואיך יודעים שזה גמור.'
output: 4 קבוצות של משימות עם סדר לשבוע, והודעת העברה מוכנה לכל משימה שעוברת לאדם אחר
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מנהלים וסגני מנהלים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: בגרסה 1.0.0, 20 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.6. בסבב הקודם באותו יום: 22 מתוך 25'
- 'בטיחות ותלמיד בסיכון הגיעו ראשונים, גם כשנכתבו בסוף הרשימה'
- 'ג''מיני העביר משימות רק לאנשים שכתבתם, ולא הוסיף עצות על ניהול זמן'
limitations:
- 'בהודעות ההעברה ג''מיני ממציא לפעמים מועד, כמו "עד מחר". כדאי לבדוק את התאריך לפני ששולחים'
- 'ברשימה ארוכה מאוד (30 משימות ומעלה) הוא מאחד לפעמים משימות, או מוחק משימה בלי סיבה ברורה'
- 'הבקשות נכתבו לבדיקה. לא נבדק עוד עם מנהל אמיתי באפליקציה של ג''מיני'
simple: 'כותבים לג''מיני את כל מה שיש לכם בראש, בלי סדר. הוא אומר מה רק אתם עושים, מה להעביר למישהו אחר, ומה אפשר לדחות.'
uses:
- when: 'שבוע עמוס'
  ask: 'תסדר לי את השבוע. בצוות יש את [שמות ותפקידים]. המשימות: [כאן כותבים הכל]'
  get: '4 קבוצות, והודעה מוכנה לכל מי שמקבל משימה.'
- when: 'רק היום'
  ask: 'מה הכי חשוב היום? [כאן כותבים את המשימות]'
  get: '3 דברים שרק אתם עושים היום, ומה להעביר.'
- when: 'להעביר משימה'
  ask: 'אני רוצה להעביר את זה ל[שם]. תכתוב לו הודעה. [כאן כותבים את המשימה]'
  get: 'הודעה קצרה עם מה, עד מתי ואיך יודעים שזה גמור.'
fixes:
  source: 'מתוך 25 בקשות של מנהלים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 21.11.2026.'
  list:
  - without: 'מעביר משימות לאנשים שלא כתבתם, כמו רכזת חברתית שאין בצוות.'
    quote: 'מעבירים לשרון היועצת + הרכזת החברתית.'
    with: 'רק מי שכתבתם. כשאין מתאים, תפקיד בסוגריים שאתם בוחרים.'
  - without: 'אומר לכם לשלוח הודעות, אבל לא כותב אותן. ב-13 מתוך 25 בקשות לא הייתה אף הודעה מוכנה.'
    quote: 'תעבירי כבר עכשיו הודעה קצרה בוואטסאפ לאורית, דנה ושמעון'
    with: 'לכל משימה שעוברת יש הודעה מוכנה: מה, עד מתי ואיך יודעים שזה גמור.'
  - without: 'פותח בעידוד ובעצות, ורק אחר כך מסדר. ב-9 מתוך 25 בקשות התשובה נפתחה ב"לנשום עמוק".'
    quote: 'לנשום עמוק, זה יום עמוס אבל לחלוטין פתיר.'
    with: 'הסידור פותח את התשובה, בלי משפט מקדים ובלי עצות על ניהול זמן.'
  also: 'לשים בטיחות ותלמיד בסיכון ראשונים גם כשנכתבו בסוף, למחוק משימה רק עם סיבה מהחומר, ולהשאיר שיחה רגישה אצלכם.'
