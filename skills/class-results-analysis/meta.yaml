name: class-results-analysis
title: 'מה הכיתה הבינה: ניתוח של טבלת ציונים'
version: 1.1.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ורכזים
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: אחרי מבחן יש טבלה מלאה במספרים, אבל ממוצע לא אומר מה ללמד מחר.
benefit: תמונת מצב ותוכנית לשיעור הבא, בלי לחשב אחוזים.
what_it_does: מחשב אחוז הצלחה לכל שאלה, מוצא שאלות קשות וטעויות משותפות, ומחלק את התלמידים לקבוצות לפי מה שהם צריכים. לא מנחש מי העתיק.
output: 'בצ''אט: תמונת מצב, טבלה לפי שאלה, קבוצות ותוכנית'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 7.2, ו-20 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 6.0'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 17 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.1. בגרסה הקודמת, באותו יום: 20'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- לפעמים אחוז יוצא שגוי. ליד כל אחוז כתוב השבר, אז כדאי לבדוק מספר אחד
simple: 'מדביקים לג''מיני את טבלת הציונים של המבחן. הוא אומר איזו שאלה הייתה הכי קשה, מי צריך עזרה, ומה ללמד בשיעור הבא.'
uses:
- when: 'אחרי מבחן'
  ask: 'זו טבלת הציונים של ט''2 במבחן באנגלית, ציון לכל שאלה. מה הכיתה הבינה ומה לא? [כאן מדביקים את הטבלה]'
  get: 'אחוז הצלחה לכל שאלה, השאלות הכי קשות, ותוכנית לשיעור הבא.'
- when: 'לחלק את הכיתה לקבוצות'
  ask: 'העליתי את קובץ האקסל של המבחן במתמטיקה. תחלק את הכיתה לקבוצות לפי מה שכל אחד צריך לתרגל.'
  get: 'קבוצות של תלמידים, ולכל קבוצה מה לתרגל.'
- when: 'בוחן קצר מ-Google Forms'
  ask: 'העתקתי את גיליון התוצאות של הבוחן מ-Forms. איזה נושא צריך ללמד שוב?'
  get: 'תמונת מצב קצרה, והנושא שכדאי ללמד שוב. בלי חישובים מצדכם.'
