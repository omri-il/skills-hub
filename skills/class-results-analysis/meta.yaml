name: class-results-analysis
title: 'מה הכיתה הבינה: ניתוח של טבלת ציונים'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים ורכזים בכל מקצוע'
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'אחרי מבחן יש טבלה מלאה במספרים, אבל ממוצע לא אומר מה ללמד מחר ומי צריך עזרה במה.'
benefit: 'תמונת מצב ותוכנית לשיעור הבא מתוך טבלה שמדביקים, בלי לחשב אחוזים לבד.'
what_it_does: 'מחשב מחדש אחוז הצלחה לכל שאלה (עם השבר ליד, כדי שאפשר לבדוק), מוצא שאלות קשות וטעויות משותפות, בודק משבצות חריגות, ומחלק את התלמידים לקבוצות לפי מה שהם צריכים. מתעלם מעמודות של אבחונים, ולא מנחש מי העתיק.'
output: 'בצ''אט: תמונת מצב, טבלה לפי שאלה, קבוצות ותוכנית לשיעור הבא'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 7.2, ו-20 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 5.1'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 6.0'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'לפעמים ממוצע הכיתה או אחוז של שאלה יוצא שגוי. ליד כל אחוז כתוב השבר, אז כדאי לבדוק מספר אחד מול הטבלה'
