name: create-test
title: 'מבחן עם טבלת מפרט'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים בכל מקצוע, מכיתה ד'' עד י"ב'
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'מבחן שנכתב מהר בודק בעיקר שינון, עם מסיחים שאף תלמיד לא בוחר, ולפעמים לא נכנס בזמן.'
benefit: 'מבחן מוכן להדפסה עם טבלת מפרט, מפתח ומחוון, בלי לחשב זמנים ונקודות לבד.'
what_it_does: 'מתחיל מטבלת מפרט (נושא ורמת חשיבה), ורק אז כותב שאלות: אמריקאיות עם מסיחים מטעויות אמיתיות, ופתוחות עם מחוון ניקוד. בודק שהמבחן נכנס בזמן, שכל נושא מופיע, ושאף שאלה לא מסגירה תשובה. כשצריך, גרסה מותאמת אחת לפי סוג הצורך.'
output: 'בצ''אט: טבלת מפרט, מבחן לתלמיד, מפתח תשובות ומחוון'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 5.0, ו-2 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 4.2'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 6.2'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'החלק החלש ביותר בבדיקה: במצב המהיר הסכומים בטבלת המפרט יצאו שגויים ב-12 מתוך 25 בקשות, וב-11 מתוך 25 היה ציטוט או מקור שלא קיים (למשל שורה משיר). במבחן כדאי לעבוד במצב Thinking או Pro, ולבדוק את הסכומים ואת הציטוטים לפני הדפסה'
