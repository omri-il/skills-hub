name: create-test
title: מבחן עם טבלת מפרט
version: 1.1.0
updated: 2026-11-21
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, כיתות ד'-י"ב
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: מבחן שנכתב מהר בודק שינון, עם מסיחים שאף תלמיד לא בוחר.
benefit: מבחן עם טבלת מפרט, מפתח ומחוון, בלי לחשב זמנים ונקודות.
what_it_does: 'מתחיל מטבלת מפרט, ורק אז כותב שאלות: אמריקאיות עם מסיחים מטעויות אמיתיות, ופתוחות עם מחוון. בודק שהמבחן נכנס בזמן ושכל נושא מופיע.'
output: 'בצ''אט: טבלת מפרט, מבחן לתלמיד, מפתח תשובות ומחוון'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 5.0, ו-2 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 6.2'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 2 מתוך 25 קיבלו 7 ומעלה, ממוצע 5.1'
- 'ניסיון של גרסה קצרה 1.2.0 (21.11.2026, gemini-3.5-flash): 0 מתוך 25 קיבלו 7 ומעלה, ממוצע 5.2. לא נשמרה, הגרסה 1.1.0 נשארה'
- 'ניסיון של גרסה 1.2.1 (21.11.2026, gemini-3.5-flash): 1 מתוך 25 קיבלו 7 ומעלה, ממוצע 5.2. לא נשמרה'
- '25 בקשות דרך ה-API של Gemini (21.11.2026, gemini-3.1-pro-preview), גרסה 1.1.0: 6 מתוך 25 קיבלו 7 ומעלה, ממוצע 5.8'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- 'החלק החלש: במצב המהיר הסכומים בטבלת המפרט שגויים ב-12 מתוך 25, ויש ציטוט שלא קיים ב-11 מתוך 25. לעבוד ב-Thinking או ב-Pro, ולבדוק לפני הדפסה'
simple: 'מספרים לג''מיני על מה המבחן ולאיזו כיתה. הוא מתכנן קודם מה בודקים, ורק אז כותב שאלות, מפתח ומחוון.'
uses:
- when: 'מבחן סוף יחידה'
  ask: 'מבחן של 45 דקות על מערכת העיכול לכיתה ח''.'
  get: 'טבלת מפרט, מבחן לתלמיד, מפתח ומחוון לשאלות הפתוחות.'
- when: 'שאלות אמריקאיות טובות'
  ask: 'מבחן אמריקאי של 15 שאלות באזרחות לכיתה י"א.'
  get: 'שאלות שבהן כל תשובה שגויה היא טעות שתלמידים באמת עושים.'
- when: 'מבחן מהחומר שלכם'
  ask: 'הנה רשימת הנושאים שלמדנו. תבנה מבחן של שעה. [כאן מדביקים את הנושאים]'
  get: 'מבחן שכל נושא מופיע בו, ושנכנס בזמן.'
hidden: true
