name: oral-check
title: שיחה של 3 דקות במקום גלאי AI
version: 1.1.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, כיתות ו'-י"ב
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: חושדים שעבודה נכתבה ב-AI, אבל גלאי AI טועים ומאשימים גם תלמידים שכתבו לבד.
benefit: 5 שאלות לשיחה קצרה, שבודקות אם התלמיד מבין את מה שהגיש.
what_it_does: 'קורא את העבודה ובונה 5 שאלות על מקומות בה. לכל שאלה: מה תשובה טובה, ושאלת המשך. עם משפט פתיחה לא מאשים ודף רישום.'
output: 'בצ''אט: משפט פתיחה, 5 שאלות ודף רישום'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 7.0, ו-18 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 7.0'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- לפעמים שאלה בודקת משהו שכתוב בעבודה, ואז היא בודקת זיכרון ולא הבנה
simple: 'חושדים שעבודה נכתבה ב-AI? מדביקים אותה לג''מיני. הוא כותב 5 שאלות לשיחה של 3 דקות עם התלמיד, על מה שכתוב בעבודה.'
uses:
- when: 'חשד ל-AI'
  ask: 'יש לי חשד שהעבודה הזאת נכתבה ב-AI. תכין לי שיחה קצרה עם התלמיד. [כאן מדביקים את העבודה]'
  get: 'משפט פתיחה לא מאשים, 5 שאלות ושאלת המשך לכל אחת.'
- when: 'שיחה עם כל הכיתה'
  ask: 'אני רוצה לשאול כל תלמיד 3 דקות על העבודה שלו, בלי להאשים אף אחד. [כאן מדביקים עבודה אחת]'
  get: 'שאלות על מקומות בעבודה, ומה נחשב תשובה טובה.'
- when: 'לרשום מה התלמיד ענה'
  ask: 'תכין לי שיחה ודף רישום לעבודה בגאוגרפיה. [כאן מדביקים את העבודה]'
  get: 'דף שבו רושמים מה התלמיד ענה, כדי להחליט אחר כך בשקט.'
