problem: חושדים שעבודה נכתבה ב-AI, אבל גלאי AI טועים ומאשימים גם תלמידים שכתבו לבד.
benefit: 5 שאלות לשיחה קצרה, שבודקות אם התלמיד מבין את מה שהגיש.
what_it_does: 'קורא את העבודה ובונה 5 שאלות על מקומות בה. לכל שאלה: מה תשובה טובה, ושאלת המשך. עם משפט פתיחה לא מאשים ודף רישום.'
output: 'בצ''אט: משפט פתיחה, 5 שאלות ודף רישום'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 7.0, ו-18 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 7.0'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- לפעמים שאלה בודקת משהו שכתוב בעבודה, ואז היא בודקת זיכרון ולא הבנה
