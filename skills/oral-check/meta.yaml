name: oral-check
title: 'שיחה של 3 דקות במקום גלאי AI'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים בכל מקצוע, מכיתה ו'' עד י"ב'
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'מורה חושד שעבודה נכתבה ב-AI, אבל גלאי AI טועים ומאשימים גם תלמידים שכתבו לבד. אין דרך הוגנת לדעת.'
benefit: '5 שאלות לשיחה קצרה על העבודה, עם דף רישום, שבודקות מה שחשוב: האם התלמיד מבין את מה שהגיש.'
what_it_does: 'קורא את העבודה ובונה 5 שאלות, כל אחת מצביעה על מקום בעבודה: פתיחה, מושג, בחירה, "מה היה קורה אם" ותהליך. לכל שאלה: מה תשובה טובה כוללת ושאלת המשך. משפט פתיחה לא מאשים, ודף רישום למורה.'
output: 'בצ''אט: משפט פתיחה, 5 שאלות, דף רישום ומה עושים אחרי השיחה'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 7.0, ו-18 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 6.9'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 7.0'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'לפעמים שאלת "מה היה קורה אם" בודקת משהו שהתלמיד כבר כתב בעבודה, ואז היא בודקת זיכרון ולא הבנה'
