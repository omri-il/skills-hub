name: create-rubric
title: 'מחוון בדקה, גם בשפה של התלמידים'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים בכל מקצוע, מכיתה ד'' עד י"ב'
who: [מורים]
fits: [ריאליים, רב-מלל]
problem: 'מחוון שכתוב "מעמיק" ו"טוב מאוד" לא עוזר לבדוק 30 עבודות, ולא אומר לתלמיד מה לעשות. וכשמותר AI, מחוון שבודק רק את התוצר בודק את ה-AI.'
benefit: 'מחוון ספציפי למשימה, עם גרסה לתלמידים ורשימת בדיקה עצמית, בלי לכתוב 15 משבצות לבד.'
what_it_does: 'בונה מחוון עם 3-5 קריטריונים. כל משבצת אומרת מה רואים בעבודה, וההבדל בין רמות הוא דבר שאפשר לספור. כשהמשימה בבית ומותר בה AI, יש קריטריון של תהליך והסבר של לפחות 25 נקודות, שלא מוריד ציון למי שלא השתמש ב-AI.'
output: 'בצ''אט: מחוון למורה, מחוון לתלמידים ורשימת בדיקה עצמית'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 6.2, ו-8 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 5.6'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 6.4'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'לפעמים קריטריון אחד בודק 2 דברים, או שמשבצת ארוכה מ-20 מילים. כדאי לקרוא את המחוון לפני שנותנים אותו לתלמידים'
