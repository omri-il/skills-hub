name: create-rubric
title: מחוון בדקה, גם בשפה של התלמידים
version: 1.1.0
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, כיתות ד'-י"ב
who:
- מורים
fits:
- ריאליים
- רב-מלל
problem: מחוון עם "מעמיק" ו"טוב מאוד" לא עוזר לבדוק 30 עבודות. וכשמותר AI, מחוון שבודק רק את התוצר בודק את ה-AI.
benefit: מחוון למשימה, עם גרסה לתלמידים ובדיקה עצמית.
what_it_does: בונה מחוון עם 3-5 קריטריונים. כל משבצת אומרת מה רואים בעבודה. כשמותר AI, יש קריטריון של תהליך והסבר, שלא מוריד ציון למי שלא השתמש בו.
output: 'בצ''אט: מחוון למורה, מחוון לתלמידים ובדיקה עצמית'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.2, ו-8 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 6.4'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 9 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.2'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
- 'באפליקציה של Gemini, כשכל 25 הסקילים מותקנים (19.11.2026, מצב Hydrogen Thinking): בקשה למחוון כקובץ הפעילה את הסקיל הזה לתוכן ואת hebrew-docs-rtl לקובץ Word'
- '25 בקשות דרך ה-API של Gemini Pro (19.11.2026, gemini-3.1-pro-preview), באותה גרסה: 10 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.2'
- 'שוב 25 בקשות ב-Gemini Pro (21.11.2026, gemini-3.1-pro-preview), באותה גרסה: 15 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.6. הציון ניתן על ידי Claude Opus, עם אותן הוראות ציון'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- עובד טוב רק ב-Gemini Pro. ב-Flash פחות מחצי מהמחוונים יצאו טובים
- לפעמים קריטריון אחד בודק 2 דברים. לקרוא את המחוון לפני שנותנים לתלמידים
- לפעמים Gemini משנה קצת את מדיניות ה-AI שכתבתם, או טועה בתוכן המקצועי. לבדוק את 2 אלה לפני שנותנים לתלמידים
simple: 'מספרים לג''מיני מה המשימה. הוא בונה מחוון שבו כל משבצת אומרת מה רואים בעבודה. מקבלים גם גרסה בשפה של התלמידים.'
uses:
- when: 'לפני שנותנים משימה'
  ask: 'מחוון לעבודה על מקור היסטורי לכיתה י''.'
  get: 'מחוון עם 3-5 קריטריונים. בכל משבצת כתוב מה רואים בעבודה.'
- when: 'משימה שמותר בה AI'
  ask: 'מחוון לחיבור באנגלית לכיתה ט''. מותר להשתמש ב-AI.'
  get: 'מחוון עם קריטריון של תהליך והסבר, שלא מוריד ציון למי שלא השתמש ב-AI.'
- when: 'שהתלמידים יבדקו את עצמם'
  ask: 'מחוון לפרויקט במדעים לכיתה ו'', בשפה של התלמידים ועם בדיקה עצמית.'
  get: 'מחוון לתלמידים ורשימה לבדיקה עצמית לפני הגשה.'
needs_pro: true
fixes:
  source: 'מתוך 2 בקשות של מורים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 19.11.2026.'
  list:
  - without: 'משבצות עם מילים כלליות, שלא אומרות מה לחפש בעבודה.'
    quote: 'הסבר נכון (אך קצת שטחי)'
    with: 'כל משבצת אומרת מה רואים בעבודה. ההבדל בין הרמות הוא דבר שאפשר לספור.'
  - without: 'כלל שאי אפשר לבדוק.'
    quote: 'עבודה שתיכתב כולה על ידי AI תקבל ציון נכשל'
    with: 'קריטריון של תהליך והסבר, שלא מוריד ציון למי שלא השתמש ב-AI.'
  also: 'לכתוב גם גרסה לתלמידים בשפה שלהם, ורשימת בדיקה לפני הגשה.'
hidden: true
