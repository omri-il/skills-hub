name: create-rubric
title: מחוון בדקה, גם בשפה של התלמידים
version: 1.0.1
updated: 2026-11-18
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, כיתות ד'-י"ב
who:
- מורים
fits:
- ריאליים
- רב-מלל
problem: מחוון עם "מעמיק" ו"טוב מאוד" לא עוזר לבדוק 30 עבודות. וכשמותר AI, מחוון שבודק רק את התוצר בודק את ה-AI.
benefit: מחוון למשימה, עם גרסה לתלמידים ובדיקה עצמית.
what_it_does: בונה מחוון עם 3-5 קריטריונים. כל משבצת אומרת מה רואים בעבודה. כשמותר AI, יש קריטריון של תהליך והסבר, שלא מוריד ציון למי שלא השתמש בו.
output: 'בצ''אט: מחוון למורה, מחוון לתלמידים ובדיקה עצמית'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.2, ו-8 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 6.4'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- לפעמים קריטריון אחד בודק 2 דברים. לקרוא את המחוון לפני שנותנים לתלמידים
