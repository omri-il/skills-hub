name: create-physics-practice
title: דפי תרגול בפיזיקה
version: 1.2.4
updated: 2026-11-20
subjects:
- פיזיקה
- מדעים
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים לפיזיקה ולמדעים, חט"ב ותיכון
who:
- מורים
problem: 'בדף פיזיקה בעברית קל לטעות: יחידה חסרה, סימן הפוך של תאוצה, מפתח עם טעות חשבון, ונוסחה שמתבלגנת בתוך משפט. ג''מיני בלי הנחיות נופל בזה.'
benefit: דף תרגול עם גרפים, שרטוטי כוחות ומפתח תשובות שנבדק בקוד.
what_it_does: 'יוצר דף עבודה לפי נושא וכיתה: שאלות מדורגות, גרפים של תנועה ושרטוטי כוחות, גם על מדרון. כל תשובה במפתח מחושבת בקוד, וכתובה במבנה נתונים, מבוקש, פתרון ותשובה, עם יחידות בכל שלב.'
output: קובץ Word עם דף תלמיד ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- verify-solutions
role: main
category: עזרי הוראה
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (20.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10. סבב 1: 13 מתוך 25 קיבלו 7 ומעלה. סבב 2, אחרי תיקונים בסקיל: 18 מתוך 25, ממוצע 7.1'
- 'קבצי Word נבדקו כתמונה: העברית מימין לשמאל, והגרפים ושרטוטי הכוחות במקום הנכון'
- 'בבקשה בלי כיתה ג''מיני בחר כיתה וכתב את זה'
- 'אחרי סבב 2 הקוד מחליף לבד ב-"?" ערך שהתלמיד מחשב בשרטוט של שאלה. סבב 3: 13 מתוך 25, ממוצע 6.6'
- 'גרסה 1.2.0: בשאלה שממירה km/h ל-m/s, הקוד כותב "?" בגרף במקום התוצאה, וכל שאר המספרים נשארים. סבב 5 (20.11.2026): 20 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.1'
- 'באפליקציה של Gemini (20.11.2026, מצב 4 Hydrogen, כל הסקילים מותקנים), 3 בקשות: דף על ניוטון ומישור משופע, ודף על זריקה אופקית בלי כיתה, יצאו כקובץ Word. כל התשובות במפתח נכונות (בדקתי כל חישוב), בשרטוטים שבשאלות הופיע "?" במקום ערך שהתלמיד מחשב, ובצ''אט היו רק השורות שהסקיל מבקש'
- 'באפליקציה של Gemini, גרסה 1.1.0 (20.11.2026): הבקשה הקצרה "צריך דף בפיזיקה לכיתה י'' לשיעור מחר" הפעילה את הסקיל. יצא קובץ Word עם 6 שאלות וגרף, ובצ''אט השורה "בחרתי נושא: תנועה בתאוצה קבועה. אפשר לבקש נושא אחר." כל התשובות במפתח נכונות. בגרסה 1.0.0 אותה בקשה לא הפעילה את הסקיל'
- 'באפליקציה של Gemini, גרסה 1.2.1 (20.11.2026): הבקשה "צריך דף עבודה על תנועה בתאוצה קבועה לכיתה י'', עם גרפים של מהירות-זמן. בחלק מהשאלות המהירות נתונה ב-km/h.", בלי המילה פיזיקה, הפעילה את הסקיל. בגרסה 1.2.0 אותה בקשה לא הפעילה אותו 3 פעמים. יצא קובץ Word, כל 12 התשובות במפתח נכונות, ובשני הגרפים הקוד כתב "?" במקום תוצאת ההמרה מ-km/h'
- 'גרסה 1.2.3 (20.11.2026): הקוד שומר רק את קובץ ה-Word בתיקייה. באפליקציה של Gemini, ב-2 מתוך 2 הרצות הקובץ הופיע בצ''אט להורדה. בגרסה 1.2.2 הקובץ לא הופיע ב-2 מתוך 5 הרצות'
limitations:
- 'הסקיל לא מצייר מעגלים חשמליים וקרני אור. בשאלות כאלה המעגל מתואר במילים'
- 'במצב המהיר יש עדיין טעויות: לפעמים טעות בפיזיקה במפתח (בעיקר בגלים ובאופטיקה), מילה משובשת בעברית, וסיכום ארוך בצ''אט. כדאי לעבור על המפתח לפני ההדפסה'
- 'בבקשה בלי נושא הסקיל בוחר נושא לבד (לכיתה י'': תנועה בתאוצה קבועה). מורה שרוצה נושא אחר כותב אותו בבקשה'
simple: 'אומרים לג''מיני נושא בפיזיקה וכיתה. הוא יוצר דף עבודה בקובץ Word, עם גרפים ושרטוטי כוחות, ומפתח תשובות שנבדק.'
uses:
- when: 'דף תרגול לשיעור'
  ask: 'דף עבודה על תנועה בתאוצה קבועה לכיתה י'', כקובץ Word.'
  get: 'דף לתלמיד עם גרפים של מהירות-זמן, ומפתח עם נתונים, מבוקש ופתרון.'
- when: 'חוקי ניוטון'
  ask: 'דף על החוק השני של ניוטון ומישור משופע לכיתה י"א, 6 שאלות.'
  get: 'שאלות עם שרטוטי כוחות, ומפתח שבו הכוח השקול נבדק בקוד.'
- when: 'שתי רמות בכיתה'
  ask: 'דף על אנרגיה לכיתה י"א, בשתי רמות: בסיס ומתקדם.'
  get: '2 גרסאות באותו קובץ, ומפתח אחד לשתיהן.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בדף פיזיקה בעברית 3 טעויות נפוצות:'
  list:
  - without: 'טעויות חשבון במפתח.'
    with: 'עם הסקיל, Gemini מחשב כל תשובה בקוד.'
  - without: 'נוסחאות ומספרים שמתבלגנים בתוך משפט בעברית.'
    with: 'עם הסקיל, הקובץ נכתב נכון מימין לשמאל.'
  - without: 'גרף שמראה לתלמיד את התשובה.'
    with: 'עם הסקיל, הקוד שם "?" במקום המספר.'
