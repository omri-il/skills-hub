name: create-physics-practice
title: דפי תרגול בפיזיקה
version: 1.0.0
updated: 2026-11-10
subjects:
- פיזיקה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים לפיזיקה, חטיבת ביניים ותיכון (5 יחידות)
problem: 'בדפי פיזיקה בעברית יש הרבה סימונים שנשברים: אותיות יווניות, וקטורים ויחידות שמתהפכים בתוך משפט עברי. וכשמבקשים מג''מיני שרטוט, הוא יוצר תמונה במחולל, והכיתוב בה משתבש.

  '
what_it_does: 'יוצר דף עבודה בפיזיקה לפי כיתה ונושא: קינמטיקה, כוחות, אנרגיה ותנע, חשמל ומעגלים, מגנטיות, גלים וקרינה. כולל תיבת נתונים וקבועים, שרטוטים מדויקים בקוד (תרשים כוחות, מישור משופע, מעגל חשמלי, גרפים), ומפתח תשובות עם נוסחה, הצבה ויחידות בכל שלב. משתמש בסקיל העיצוב, בסקיל השרטוטים ובסקיל הבדיקה.

  '
output: קובץ Word עם דף תלמיד, שרטוטים ומפתח תשובות
requires:
- format-equations-for-hebrew-worksheets
- draw-worksheet-diagrams
- verify-solutions
role: main
tested:
- עוד לא נבדק בג'מיני. דף לדוגמה, עם מישור משופע, מעגל חשמלי, יחידות ומטען שלילי, נבנה בקוד שבסקילים ונפתח נכון ב-Word
limitations:
- עוד לא נבדק על דפי עבודה אמיתיים של מורים לפיזיקה
