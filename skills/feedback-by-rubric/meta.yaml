name: feedback-by-rubric
title: משוב לעבודות לפי מחוון, בלי שמות
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, כיתות ד'-י"ב
who:
- מורים
fits:
- ריאליים
- רב-מלל
problem: משוב לכל תלמיד לוקח שעות, ו"עבודה יפה" לא עוזר לתקן כלום.
benefit: טיוטת משוב לכל עבודה, שאתם רק בודקים ומשנים.
what_it_does: 'קורא עבודה לפי המחוון שלכם. למורה: רמה לכל קריטריון, עם ציטוט. לתלמיד: מה עבד, עד 2 דברים לשפר ושאלה לחשיבה. הציון תמיד שלכם.'
output: 'בצ''אט: טבלה למורה ומשוב מוכן לתלמיד'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.4, ו-11 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 6.6'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- במצב המהיר לפעמים יש שגיאת כתיב או ציטוט לא מדויק. לקרוא לפני ששולחים
simple: 'מדביקים לג''מיני מחוון ועבודה של תלמיד. הוא כותב משוב: מה עבד ומה לשפר. הציון נשאר שלכם.'
uses:
- when: 'ערימת עבודות לבדיקה'
  ask: 'זה המחוון שלי, וזו עבודה של תלמיד. תכתוב משוב. [כאן מדביקים את המחוון ואת העבודה]'
  get: 'טבלה למורה עם רמה לכל קריטריון וציטוט מהעבודה.'
- when: 'משוב שהתלמיד יבין'
  ask: 'תכתוב לתלמיד משוב קצר לפי המחוון, בשפה של כיתה ז''. [כאן מדביקים את העבודה]'
  get: 'מה עבד, עד 2 דברים לשפר, ושאלה אחת לחשיבה.'
- when: 'כמה עבודות בבת אחת'
  ask: 'הנה 3 עבודות והמחוון. תכתוב משוב לכל אחת. [כאן מדביקים את העבודות]'
  get: 'משוב לכל עבודה, בלי שמות: "עבודה 1", "עבודה 2". את השמות מוסיפים אתם.'
