name: feedback-by-rubric
title: 'משוב לעבודות לפי מחוון, בלי שמות'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים בכל מקצוע, מכיתה ד'' עד י"ב'
who: [מורים]
fits: [ריאליים, רב-מלל]
problem: 'משוב כתוב לכל תלמיד לוקח שעות, ומשוב כמו "עבודה יפה" לא עוזר לתלמיד לתקן כלום.'
benefit: 'טיוטת משוב לכל עבודה, עם ראיה מהעבודה לכל רמה, שהמורה רק בודק ומשנה.'
what_it_does: 'קורא עבודה של תלמיד לפי המחוון של המורה. למורה: רמה מוצעת לכל קריטריון עם ציטוט מהעבודה, ומה המורה צריך לבדוק בעצמו. לתלמיד: מה עבד, עד 2 דברים לשפר עם צעד ברור, ושאלה אחת לחשיבה. הציון תמיד של המורה. לא מנחש אם התלמיד השתמש ב-AI, ומזכיר להסיר שמות לפני ההדבקה.'
output: 'בצ''אט: טבלה למורה ומשוב מוכן לתלמיד'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 6.4, ו-11 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 5.7'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 6.6'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'במצב המהיר יש לפעמים שגיאת כתיב בחלק לתלמיד, או ציטוט מהעבודה שלא הועתק בדיוק. לקרוא את המשוב לפני ששולחים'
