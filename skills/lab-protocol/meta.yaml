name: lab-protocol
title: פרוטוקול מעבדה וטופס הזמנת ציוד
version: 1.2.0
updated: 2026-11-20
subjects:
- ביולוגיה
- מדעים
platforms:
  tested: []
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים לביולוגיה ולמדעים שעושים ניסויים במעבדה
who:
- מורים
problem: 'לפני כל ניסוי צריך לכתוב דף הנחיות לתלמידים, ואחר כך לספור ציוד לכל הקבוצות בשביל הלבורנט. קל לשכוח פריט או לטעות בכמות.'
benefit: 'פרוטוקול לתלמידים וטופס ללבורנט, עם כמויות שמחושבות לכל הקבוצות.'
what_it_does: 'כותב פרוטוקול: מטרה, רקע, ציוד, בטיחות, שלבים ממוספרים, טבלת תוצאות ושאלות לדיון. בונה טופס הזמנה נפרד ללבורנט, עם כמות לקבוצה, כמות כוללת והערות הכנה. שלב מסוכן מוחלף בחלופה בטוחה.'
output: '2 קבצי Word: פרוטוקול לתלמידים וטופס הזמנת ציוד'
requires:
- format-equations-for-hebrew-worksheets
role: main
category: עזרי הוראה
tested:
- עוד לא נבדק
limitations:
- 'הסקיל לא מכיר את הציוד שיש בבית הספר שלכם. כדאי לבדוק את הטופס עם הלבורנט'
simple: 'אומרים לג''מיני איזה ניסוי, לאיזו כיתה וכמה קבוצות. הוא יוצר פרוטוקול לתלמידים וטופס הזמנת ציוד ללבורנט, ב-2 קבצי Word.'
uses:
- when: 'ניסוי בשבוע הבא'
  ask: 'פרוטוקול לניסוי על השפעת הטמפרטורה על קטלאז, כיתה י'', 8 קבוצות.'
  get: 'דף לתלמידים עם שלבים וטבלת תוצאות, וטופס ללבורנט עם כל הכמויות.'
- when: 'יש לכם כבר פרוטוקול'
  ask: 'תכין טופס הזמנת ציוד ל-10 קבוצות לפי הפרוטוקול הזה: [כאן מדביקים את הפרוטוקול]'
  get: 'טופס עם כמות לקבוצה וכמות כוללת, והפרוטוקול שלכם עם תיקון רק אם יש טעות.'
- when: 'מעבדה בחטיבה'
  ask: 'דף מעבדה לכיתה ז'' על זיהוי עמילן במזון, 6 קבוצות.'
  get: 'שלבים קצרים, נקודות בטיחות, וטופס ציוד מוכן.'
