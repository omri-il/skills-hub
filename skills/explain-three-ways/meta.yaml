name: explain-three-ways
title: הסבר בשלוש דרכים
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שנתקע מול מושג שהכיתה לא קולטת
problem: 'כשתלמיד לא מבין, החזרה על אותו הסבר לאט יותר לא עוזרת. כשמבקשים מבינה מלאכותית "תסביר אחרת", מקבלים שלוש פסקאות שהן אותו הסבר בניסוח אחר, ואנלוגיה שלא נאמר איפה היא נשברת — ולכן יוצרת תפיסה שגויה חדשה שתופיע במבחן.

  '
what_it_does: 'מזהה קודם מה בדיוק לא מובן ואת התפיסות השגויות הנפוצות במושג, ואז בונה שלושה הסברים משלוש משפחות שונות — מוחשי, חזותי, פורמלי, סיפורי, מהסוף אחורה או מצב קצה. כל הסבר קצר, בשפה שהמורה אומר בכיתה, וכל אנלוגיה מלווה בשורה שאומרת איפה היא נשברת. מסתיים בשאלה אחת שמבדילה בין הבנה לשינון, עם התשובה שתגיע מכל סוג תלמיד.

  '
output: שלושה הסברים, טבלת תפיסות שגויות ושאלת בדיקה; קובץ Word אם צריך להקרין
requires:
- hebrew-docs-rtl
role: main
tested:
- '2026-11-11, Gemini 3.1 Pro: "התלמידים כותבים 1/2+1/3=2/5, איך להסביר אחרת?". החזיר שלושה הסברים ממשפחות שונות (מטבעות, שם המספר, שקפים מונחים), ובכל אחד שורה שאומרת איפה הוא נשבר. שאלת הבדיקה ביקשה להוכיח בלי לחשב למה 2/5 לא הגיוני, עם התשובה הצפויה מתלמיד ששינן ומתלמיד שהבין'
- '2026-11-11, אותה שאלה ב-Pro בלי הסקיל: תשובה טובה, אבל בלי איפה האנלוגיות נשברות, בלי טבלת תפיסות שגויות ובלי שאלת בדיקה'
limitations:
- 'נבדק רק ב-Gemini 3.1 Pro. ב-2026-11-11 בחשבון הבדיקה Flash ענה רק על שאלות של שורה אחת, ועל שאלות הבדיקה החזיר סירוב גנרי או נתקע; Thinking נתקע או סירב גם על "מה בירת איטליה". לא ברור אם זו תקלה בחשבון או עומס מ-36 הסקילים שהיו מותקנים בו, ולכן עדיין לא ידוע איך הסקיל מתנהג ב-Flash, ברירת המחדל של רוב המורים'
- 'טבלת התפיסות השגויות יצאה עם שורה אחת בלבד'
- 'טרם נבדק על מושגים הומניים מופשטים, שבהם קשה יותר לייצר משפחות הסבר שונות'
