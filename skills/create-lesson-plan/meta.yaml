name: create-lesson-plan
title: מערך שיעור
version: 1.0.0
updated: 2026-11-11
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שמתכנן שיעור או רצף שיעורים
problem: 'מערך שיעור שמייצרת בינה מלאכותית בלי הנחיות נראה טוב על הנייר ונופל בכיתה: שלוש מטרות, 45 דקות מתוכננות מדויק כך שהסגירה תמיד נחתכת, פתיחה שהיא "היום נלמד על", ואין שום תשובה לשאלה מה עושים כשהכיתה לא מגיבה או כשמאחרים.

  '
what_it_does: 'בונה מערך של עמוד אחד עם מטרה אחת נצפית, טבלת תזמון שמתכננת 40 דקות מתוך 45 כדי שיישאר מרווח, פתיחה שתופסת מתוך חמישה סוגים שעובדים, כלל של עד עשר דקות דיבור רצוף של המורה, סגירה בשליפה פעילה שלא מוותרים עליה, ותוכנית ב'' מלאה: מה עושים אם הכיתה שותקת, אם מאחרים, אם סיימת מוקדם ואם הטכנולוגיה לא עובדת.

  '
output: קובץ Word בעמוד אחד שהמורה מחזיק בכיתה
requires:
- write-graded-questions
- hebrew-docs-rtl
role: main
tested:
- '2026-11-11, Gemini 3.1 Pro: שיעור של 45 דקות על אינפלציה לכיתה ט'', "כקובץ Word". יצר קובץ עם מטרה אחת נצפית, טבלת תזמון שנגמרת ב-40, פתיחה של "100 שקלים מתחת לבלטות" וסגירה בפתק יציאה'
- 'תוכנית ב'' יצאה מלאה בפועל: מה עושים אם הכיתה לא מגיבה, אם יש איחור של 10 דקות ("לא מוותרים על הסגירה"), אם סיימת מוקדם (עם השאלה עצמה) ואם הטכנולוגיה לא עובדת'
limitations:
- 'המערך יצא בשני עמודים ולא בעמוד אחד, למרות שהסקיל דורש עמוד אחד'
- 'נבדק רק ב-Gemini 3.1 Pro. ב-2026-11-11 בחשבון הבדיקה Flash ענה רק על שאלות של שורה אחת, ועל שאלות הבדיקה החזיר סירוב גנרי או נתקע; Thinking נתקע או סירב גם על "מה בירת איטליה". באותו יום, בחשבון גוגל רגיל עם 9 סקילים, Flash ענה כרגיל על אותן שאלות. בבדיקה חוזרת בחשבון הבדיקה, כשנשאר בו מותקן סקיל אחד בלבד, Flash החזיר שוב סירוב, כך שמספר הסקילים אינו הסיבה והתקלה היא בחשבון עצמו. איך הסקיל הזה מתנהג ב-Flash, ברירת המחדל של רוב המורים, עוד לא נבדק'
- 'טרם נבדק על רצף של כמה שיעורים'
- 'לא נבדק מה קורה כשמותקנים גם סקילים אחרים של מערך שיעור (למשל בביולוגיה) ומבקשים מערך באותו מקצוע'
