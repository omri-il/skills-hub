name: create-integrated-lesson
title: שיעור משולב מבקשה אחת, מהקניה ועד כרטיס יציאה
version: 1.0.0
updated: 2026-11-27
subjects:
- מתמטיקה
- פיזיקה
- כימיה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ומרצים למתמטיקה ולמדעים, חטיבת ביניים ותיכון
who:
- מורים
problem: 'מערך שיעור מ-AI הוא בדרך כלל רשימה של רעיונות. את התרגול, את שאלת החקר ואת כרטיס היציאה צריך לבנות לבד, וכל אחד בכלי אחר.'
benefit: 'שיעור של 45 דקות מבקשה אחת: מה אומרים, דף תרגול שהתלמידים בודקים בו את עצמם בטלפון, שאלת חקר וכרטיס יציאה.'
what_it_does: 'כותב בצ''אט את ההקניה עם דוגמה פתורה צעד אחר צעד, שאלת חקר לזוגות עם התשובה, וכרטיס יציאה עם תשובות. בונה ב-Canvas דף תרגול: התלמיד כותב תשובה, מקבל ✓ או רמז, ואחרי 2 טעויות רואה פתרון. בחרוט הדף מתחיל ביישומון שהתלמיד מסובב, משנה ופורס.'
output: 'בצ''אט: הקניה, שאלת חקר, כרטיס יציאה ובדיקה למורה. ב-Canvas: דף תרגול עם בדיקה עצמית'
role: main
category: עזרי הוראה
hidden: true
tested:
- 'הדף נבדק בדפדפן ובתצוגת טלפון (27.11.2026): עם היישומון של החרוט ובלעדיו, שאלות עם מספר ושאלות עם 3 תשובות, תשובה כמו 12π או 75,4, רמז אחרי טעות ופתרון אחרי 2 טעויות. בבדיקה למורה 2 ✓'
- 'עוד לא נבדק באפליקציה של Gemini'
limitations:
- 'יישומון יש רק לחרוט. בנושא אחר הדף הוא תרגול ושאלת חקר, בלי יישומון'
- 'הדף לא שומר את התשובות ולא שולח אותן למורה. כרטיס היציאה הוא טקסט להדביק ב-Google Forms'
simple: 'כותבים לג''מיני נושא וכיתה. מקבלים שיעור שלם: מה אומרים בהקניה, דף תרגול שהתלמידים בודקים בו את עצמם בטלפון, שאלת חקר לזוגות וכרטיס יציאה.'
uses:
- when: 'שיעור על נפח החרוט'
  ask: 'תבנה לי שיעור משולב לכיתה ט'' על נפח ושטח פנים של חרוט.'
  get: 'הקניה עם דוגמה פתורה, דף עם יישומון של חרוט ו-5 שאלות עם בדיקה עצמית, שאלת חקר על הגזרה וכרטיס יציאה.'
- when: 'נושא חדש בפיזיקה'
  ask: 'מערך שיעור לכיתה י'' על מהירות ממוצעת: הקניה, תרגול מתוקשב, שאלת חקר בזוגות וכרטיס יציאה.'
  get: 'דוגמה פתורה צעד אחר צעד, דף תרגול עם רמזים, שאלת חקר שבה הזוגות משווים 2 מסלולים, ו-3 שאלות ליציאה.'
- when: 'שיעור חזרה לפני מבחן'
  ask: 'שיעור חזרה לכיתה ח'' על אחוזים, עם תרגול שהתלמידים בודקים לבד. [כאן מדביקים את הנושאים של המבחן]'
  get: 'הקניה קצרה של הכללים, 6 שאלות מהקל לקשה עם בדיקה עצמית, שאלת חקר וכרטיס יציאה.'
fixes:
  also: 'לכתוב את כל השיעור בצ''אט, ולא רק לבנות דף. לחשב כל תשובה נכונה בקוד, ולא בראש. לשמור נוסחה משמאל לימין בתוך משפט בעברית. לכתוב נוסחאות בלי LaTeX. לבנות יישומון רק לחרוט, שנבדק, ולא לכתוב יישומון חדש לנושא אחר.'
