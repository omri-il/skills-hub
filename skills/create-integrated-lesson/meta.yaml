name: create-integrated-lesson
title: שיעור משולב מבקשה אחת, מהקניה ועד כרטיס יציאה
version: 1.1.0
updated: 2026-11-27
subjects:
- מתמטיקה
- פיזיקה
- כימיה
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ומרצים למתמטיקה ולמדעים, חטיבת ביניים ותיכון
who:
- מורים
problem: 'מערך שיעור מ-AI הוא בדרך כלל רשימה של רעיונות. את התרגול, את שאלת החקר ואת כרטיס היציאה צריך לבנות לבד, וכל אחד בכלי אחר.'
benefit: 'שיעור של 45 דקות מבקשה אחת: מה אומרים, דף תרגול שהתלמידים בודקים בו את עצמם בטלפון, שאלת חקר וכרטיס יציאה.'
what_it_does: 'בונה ב-Canvas דף שיעור אחד: הקניה עם דוגמה פתורה צעד אחר צעד, יישומון של חרוט שהתלמיד מסובב ופורס, תרגול שבו התלמיד כותב תשובה ומקבל ✓ או רמז, ואחרי 2 טעויות רואה פתרון, שאלת חקר לזוגות וכרטיס יציאה. כפתור "בדיקה למורה" מראה את כל התשובות.'
output: 'ב-Canvas: דף שיעור אחד, מההקניה ועד כרטיס היציאה, עם בדיקה למורה'
role: main
category: עזרי הוראה
hidden: true
tested:
- 'הדף נבדק בדפדפן ובתצוגת טלפון (27.11.2026): עם היישומון של החרוט ובלעדיו, שאלות עם מספר ושאלות עם 3 תשובות, תשובה כמו 12π או 75,4, רמז אחרי טעות ופתרון אחרי 2 טעויות. בבדיקה למורה 2 ✓'
- 'באפליקציה של Gemini, חשבון בית ספר, Hydrogen (27.11.2026). "תבנה לי יישומון שיעור לכיתה ט'' על נפח ושטח פנים של חרוט: הקניה עם דוגמה פתורה, תרגול עם בדיקה עצמית, שאלת חקר לזוגות וכרטיס יציאה", בלי @: Gemini בנה ב-Canvas את הדף של הסקיל ("לפי הקוד שסיפקת"). החרוט הסתובב, ותשובה נכונה בתרגול קיבלה ✓'
- 'אותה בקשה עם "שיעור משולב" במקום "יישומון שיעור", 5 ניסיונות (גרסאות 1.0.0 עד 1.1.0, עם @ ובלי, ופעם אחת עם הכלי Canvas): אף פעם לא דף. 3 פעמים Gemini כתב מערך שיעור משלו בצ''אט, של 90 דקות, עם LaTeX והפניה ל-GeoGebra. פעם אחת התשובה יצאה ריקה, ופעם אחת Canvas של מסמך טקסט'
- '"יישומון שיעור" על מהירות ממוצעת לכיתה י'': Gemini לא השתמש בסקיל. הוא כתב שיעור בצ''אט עם LaTeX וענה בהמחשה החזותית המובנית שלו'
limitations:
- 'ב-Hydrogen הסקיל עבד רק בחרוט, ורק כשהבקשה אומרת "יישומון שיעור". בבקשה "שיעור משולב" או בנושא אחר Gemini כותב מערך שיעור משלו'
- 'בחרוט Gemini העתיק את הדוגמאות שבסקיל כמו שהן. הדף טוב, אבל אותו דף לכל מורה'
- 'הדף לא שומר את התשובות ולא שולח אותן למורה. את כרטיס היציאה אפשר להדביק ב-Google Forms'
simple: 'כותבים לג''מיני "יישומון שיעור" על חרוט. מקבלים דף שיעור שלם בטלפון: הקניה, חרוט שמסתובב ונפרס, תרגול שבודק את עצמו, שאלת חקר לזוגות וכרטיס יציאה.'
uses:
- when: 'שיעור על נפח החרוט'
  ask: 'תבנה לי יישומון שיעור לכיתה ט'' על נפח ושטח פנים של חרוט: הקניה עם דוגמה פתורה, תרגול עם בדיקה עצמית, שאלת חקר לזוגות וכרטיס יציאה.'
  get: 'דף שיעור ב-Canvas: הקניה, חרוט שמסתובב ונפרס, 5 שאלות עם בדיקה עצמית, שאלת חקר על הגזרה וכרטיס יציאה.'
- when: 'להקרין בכיתה'
  ask: 'תבנה לי יישומון שיעור לכיתה ט'' על שטח הפנים של חרוט, עם דוגמה פתורה שאני מציג על הלוח.'
  get: 'אותו דף: מקרינים את ההקניה והחרוט, והתלמידים פותרים בטלפון.'
- when: 'לבדוק לפני הכיתה'
  ask: 'איך אני בודק שהיישומון נכון לפני שאני נותן אותו לתלמידים?'
  get: 'לוחצים על "בדיקה למורה" בתחתית הדף: כל התשובות, ו-2 ✓ שהנוסחאות מתאימות לציור.'
fixes:
  also: 'לשים את כל השיעור בדף אחד, ולא במערך שיעור בצ''אט. לחשב כל תשובה נכונה בקוד, ולא בראש. לשמור נוסחה משמאל לימין בתוך משפט בעברית. לכתוב נוסחאות בלי LaTeX. להשתמש ביישומון החרוט שנבדק, ולא לכתוב יישומון חדש.'
