name: apps-script-lomda
title: לומדה ששומרת כל תשובה בגיליון (Apps Script)
version: 1.0.1
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, גם בלי ניסיון בקוד
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: לומדה ב-Canvas יפה, אבל התשובות של התלמידים לא נשמרות בשום מקום.
benefit: לומדה בקישור לתלמידים, וכל הגשה נכנסת לגיליון שלכם.
what_it_does: 'כותב 2 קבצים ל-Apps Script: השאלות והבדיקה, ודף בעברית שעובד בטלפון. התשובות הנכונות נשארות בשרת, ותלמיד לא רואה אותן. מסביר צעד אחר צעד איך לפרסם.'
output: 'בצ''אט: Code.gs, Index.html והוראות התקנה'
role: main
category: וייב קודינג
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.7, ו-18 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 7.0'
- 'הקוד הורץ בגיליון מדומה: ב-24 מתוך 25 הלומדה עלתה ושמרה תשובה, והתשובות הנכונות לא הגיעו לדף'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 15 מתוך 25 קיבלו 7 ומעלה, ממוצע 6.6. בגרסה הקודמת, באותו יום: 12'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- בחשבון של בית ספר אפליקציות אינטרנט יכולות להיות חסומות. אז עובדים מחשבון Gmail אישי
- לפעמים התשובה הנכונה באותו מקום בכל השאלות. לענות פעם אחת לפני ששולחים לתלמידים
simple: 'ג''מיני בונה לומדה שתלמידים פותחים בקישור, גם בטלפון. כל תשובה של תלמיד נשמרת בגיליון שלכם.'
uses:
- when: 'תרגול לפני מבחן'
  ask: 'תבנה לי לומדה של 10 שאלות אמריקאיות על מחזור המים לכיתה ה'', שתשמור את התשובות בגיליון.'
  get: '2 קבצי קוד מוכנים, והסבר צעד אחר צעד איך לפרסם ולקבל קישור לתלמידים.'
- when: 'שיעורי בית שבודקים לבד'
  ask: 'אני רוצה לומדה בשברים לכיתה ו''. כל תלמיד כותב שם, עונה, ורואה כמה צדק.'
  get: 'לומדה בעברית שבודקת את התשובות. בגיליון רואים מה כל תלמיד ענה.'
- when: 'לומדה שכבר בניתם ב-Canvas'
  ask: 'בניתי לומדה ב-Canvas, אבל התשובות לא נשמרות. תהפוך אותה ללומדה ששומרת בגיליון. [כאן מדביקים את השאלות]'
  get: 'אותן שאלות, ועכשיו כל הגשה נכנסת לגיליון. התלמידים לא רואים את התשובות הנכונות.'
fixes:
  source: 'מתוך 2 בקשות של מורים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 19.11.2026.'
  list:
  - without: 'לא בונה לומדה. מציע במקום זה Google Forms.'
    quote: 'הפתרון המושלם, הקל והחינמי ביותר עבורך'
    with: 'בונה לומדה. התשובות של כל תלמיד נשמרות בגיליון שלכם, עמודה לכל שאלה.'
  also: 'להשאיר את התשובות הנכונות בשרת, כדי שתלמיד לא יראה אותן בדף.'
hidden: true
