name: apps-script-lomda
title: לומדה ששומרת כל תשובה בגיליון (Apps Script)
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, גם בלי ניסיון בקוד
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: לומדה ב-Canvas יפה, אבל התשובות של התלמידים לא נשמרות בשום מקום.
benefit: לומדה בקישור לתלמידים, וכל הגשה נכנסת לגיליון שלכם.
what_it_does: 'כותב 2 קבצים ל-Apps Script: השאלות והבדיקה, ודף בעברית שעובד בטלפון. התשובות הנכונות נשארות בשרת, ותלמיד לא רואה אותן. מסביר צעד אחר צעד איך לפרסם.'
output: 'בצ''אט: Code.gs, Index.html והוראות התקנה'
role: main
category: וייב קודינג
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.7, ו-18 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 7.0'
- 'הקוד הורץ בגיליון מדומה: ב-24 מתוך 25 הלומדה עלתה ושמרה תשובה, והתשובות הנכונות לא הגיעו לדף'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- בחשבון של בית ספר אפליקציות אינטרנט יכולות להיות חסומות. אז עובדים מחשבון Gmail אישי
- לפעמים התשובה הנכונה באותו מקום בכל השאלות. לענות פעם אחת לפני ששולחים לתלמידים
