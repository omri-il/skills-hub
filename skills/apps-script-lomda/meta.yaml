name: apps-script-lomda
title: 'לומדה ששומרת כל תשובה בגיליון (Apps Script)'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים בכל מקצוע, גם בלי ניסיון בקוד'
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'לומדה שנבנית ב-Canvas יפה, אבל התשובות של התלמידים לא נשמרות בשום מקום. ומורים לא יודעים לתכנת.'
benefit: 'לומדה עובדת בקישור לתלמידים, שכל הגשה בה נכנסת לגיליון של המורה, בלי לכתוב קוד.'
what_it_does: 'כותב 2 קבצים מלאים ל-Google Apps Script: Code.gs (השאלות, התשובות הנכונות, בדיקה ושמירה בגיליון) ו-Index.html (דף בעברית שעובד בטלפון). התשובות הנכונות רק בשרת, כך שתלמיד לא רואה אותן בקוד. מסביר צעד אחר צעד איך להדביק, לפרסם ולבדוק.'
output: 'בצ''אט: הוראות התקנה, Code.gs ו-Index.html מלאים, ותקלות נפוצות'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 6.7, ו-18 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 5.5'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 7.0'
- 'הקוד בכל תשובה הורץ בגיליון מדומה (לא ב-Google): ב-24 מתוך 25 הלומדה עלתה, שמרה שורה בגיליון, והתשובות הנכונות לא הגיעו לדף'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'הקוד הורץ בגיליון מדומה, לא בפריסה אמיתית ב-Google. בחשבון של בית ספר מנהל המערכת יכול לחסום אפליקציות אינטרנט, ואז עובדים מחשבון Gmail אישי'
- 'לפעמים התשובות הנכונות באותו מקום בכל השאלות, או שמספרים עם מינוס מוצגים הפוך. כדאי לענות פעם אחת על הלומדה לפני ששולחים לתלמידים'
