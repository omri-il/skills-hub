name: fix-slides-rtl
title: מצגות בעברית שנפתחות ב-Slides מימין לשמאל
version: 1.1.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים שמכינים מצגות בעברית
who:
- מורים
- רכזים
- מנהלים
problem: 'מצגת בעברית יוצאת הפוכה אחרי "ייצוא ל-Slides": פסקאות משמאל לימין ובולטים בצד הלא נכון.'
benefit: המצגת נפתחת ב-Slides מימין לשמאל, בלי לתקן שקף אחרי שקף.
what_it_does: במקום כפתור הייצוא, ג'מיני בונה קובץ PowerPoint שכולו מימין לשמאל. מעלים ל-Drive ופותחים ב-Slides. למצגת שכבר יצאה הפוכה, הוא נותן קוד Apps Script שמתקן הכל.
output: קובץ PowerPoint להורדה
requires: []
role: main
category: עזרי הוראה
tested:
- קובץ שג'מיני בנה בסביבת הקוד שלו נפתח ב-Slides מימין לשמאל (7.11.2026)
limitations:
- בג'מיני הסקיל לא רץ כשמבקשים מצגת, גם עם שם הסקיל. הקובץ יצא רק כשהקוד הודבק בצ'אט
- קוד ה-Apps Script לא נבדק על מצגת אמיתית
- עיצוב פשוט, בלי תמונות
