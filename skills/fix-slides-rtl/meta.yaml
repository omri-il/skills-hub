name: fix-slides-rtl
title: מצגות בעברית שנפתחות ב-Slides מימין לשמאל
version: 1.1.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: כל מורה שיוצר מצגות בעברית בג'מיני ופותח אותן ב-Google Slides
who: [מורים, רכזים, מנהלים]
problem: 'מצגת בעברית שנראית מצוין בג''מיני יוצאת הפוכה אחרי לחיצה על "ייצוא ל-Slides": כיוון הפסקאות משמאל לימין, הבולטים בצד הלא נכון, ופיסוק, מספרים ומילים באנגלית קופצים. מתקנים שקף אחרי שקף, וזה לוקח הרבה זמן.

  '
benefit: 'המצגת נפתחת ב-Slides מימין לשמאל כבר מההתחלה, ויש פחות מה לתקן שקף אחרי שקף.'
what_it_does: 'במקום כפתור הייצוא, ג''מיני בונה את המצגת בעצמו כקובץ PowerPoint, וכל פסקה בו מוגדרת מימין לשמאל, כולל הערות הדובר. מורידים, גוררים ל-Drive ופותחים ב-Google Slides, והמצגת כבר נכונה. יש ארבעה סוגי שקפים: פתיחה, הסבר, שאלה לכיתה ומשימה. למצגת שכבר יוצאה הפוכה הוא נותן קוד Apps Script שמתקן את כולה בבת אחת.

  '
output: קובץ PowerPoint להורדה, ושלוש שורות למורה
requires: []
role: main
tested:
- 'גרסה 1.0.0 (רק קוד Apps Script לאחר הייצוא) לא עזרה: כפתור הייצוא השאיר את המצגת משמאל לימין'
- 'ג''מיני בנה בסביבת הקוד שלו קובץ PowerPoint עם גרסה ראשונה ופשוטה יותר של הקוד, והקובץ נפתח ב-Google Slides מימין לשמאל (7.11.2026)'
- 'בקשה רגילה של מורה בג''מיני (Flash ו-Pro), גם כשכתוב בה "קובץ PowerPoint" או שם הסקיל: ג''מיני בנה מצגת Canvas משלו עם כפתור הייצוא, ולא הפעיל את הסקיל (7.11.2026)'
limitations:
- 'בג''מיני הסקיל לא מופעל כשמבקשים מצגת: הכלי המובנה של ג''מיני לוקח את הבקשה. הקובץ מימין לשמאל יצא רק כשהקוד הודבק ישירות בצ''אט'
- קוד ה-Apps Script למצגת שכבר יוצאה עוד לא נבדק על מצגת אמיתית
- העיצוב פשוט (רקע, כותרת, נקודות). בלי תמונות
