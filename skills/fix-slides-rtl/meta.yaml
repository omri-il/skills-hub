name: fix-slides-rtl
title: תיקון מצגת עברית שיצאה הפוכה ב-Slides
version: 1.0.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה שיוצר מצגות בג'מיני ומייצא אותן ל-Google Slides
problem: 'מצגת בעברית שנראית מצוין בג''מיני יוצאת הפוכה אחרי ייצוא ל-Google Slides: הטקסט מיושר לשמאל, הבולטים בצד הלא נכון, והפיסוק קופץ. מתקנים שקף אחרי שקף, וזה לוקח הרבה זמן.

  '
what_it_does: 'נותן למורה קוד Apps Script מוכן וחמישה צעדים פשוטים (תוספים ← Apps Script ← הדבקה ← שמירה ← הפעלה). הקוד מיישר מימין לשמאל כל פסקה בעברית בכל השקפים: תיבות טקסט, כותרות, טבלאות, קבוצות והערות דובר. פסקאות באנגלית בלבד נשארות כמו שהן. אחרי שג''מיני יוצר מצגת בעברית, הוא גם מזכיר שהתיקון קיים.

  '
output: הוראות בצ'אט וקוד להעתקה
requires: []
role: main
tested:
- עוד לא נבדק בגרסה הזו. אותה שיטה (קוד Apps Script שמתקן את כל המצגת) הודגמה בסרטון ביוטיוב ב-25.6.2026
limitations:
- לא מחליף את סדר העמודות בטבלאות
- לא מתקן טקסט שנמצא בתוך תמונה
- בחשבון של בית ספר ייתכן ש-Apps Script חסום
