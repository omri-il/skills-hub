name: fix-slides-rtl
title: מצגות בעברית שנפתחות ב-Slides מימין לשמאל
version: 1.1.1
updated: 2026-11-19
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים שמכינים מצגות בעברית
who:
- מורים
- רכזים
- מנהלים
problem: 'מצגת בעברית יוצאת הפוכה אחרי "ייצוא ל-Slides": פסקאות משמאל לימין ובולטים בצד הלא נכון.'
benefit: המצגת נפתחת ב-Slides מימין לשמאל, בלי לתקן שקף אחרי שקף.
what_it_does: במקום כפתור הייצוא, ג'מיני בונה קובץ PowerPoint שכולו מימין לשמאל. מעלים ל-Drive ופותחים ב-Slides. למצגת שכבר יצאה הפוכה, הוא נותן קוד Apps Script שמתקן הכל.
output: קובץ PowerPoint להורדה
requires: []
role: main
category: עזרי הוראה
tested:
- קובץ שג'מיני בנה בסביבת הקוד שלו נפתח ב-Slides מימין לשמאל (7.11.2026)
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- בג'מיני הסקיל לא רץ כשמבקשים מצגת, גם עם שם הסקיל. הקובץ יצא רק כשהקוד הודבק בצ'אט
- קוד ה-Apps Script לא נבדק על מצגת אמיתית
- עיצוב פשוט, בלי תמונות
simple: 'מצגת בעברית יוצאת הפוכה ב-Google Slides? עם הסקיל, ג''מיני בונה קובץ PowerPoint מימין לשמאל, שנפתח נכון ב-Slides.'
uses:
- when: 'מצגת חדשה'
  ask: 'תכין מצגת של 8 שקפים על מחזור המים לכיתה ה'', כקובץ PowerPoint.'
  get: 'קובץ PowerPoint מימין לשמאל. מעלים ל-Drive ופותחים ב-Slides.'
- when: 'מצגת שכבר יצאה הפוכה'
  ask: 'ייצאתי מצגת ל-Slides והעברית הפוכה. איך מתקנים?'
  get: 'קוד Apps Script קצר שמתקן את כל השקפים, והסבר איך להפעיל אותו.'
- when: 'טקסט שכבר כתבתם'
  ask: 'הנה הטקסט של 5 שקפים. תהפוך אותו לקובץ PowerPoint בעברית. [כאן מדביקים את הטקסט]'
  get: 'קובץ שבו הבולטים בצד הנכון והפסקאות מימין.'
hidden: true
