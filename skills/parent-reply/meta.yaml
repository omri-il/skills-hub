name: parent-reply
title: תשובה להורה במצב רגיש
version: 1.0.0
updated: 2026-11-21
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מנהלים, סגני מנהלים, יועצות ומחנכים שעונים להורים
who:
- מנהלים
- מחנכים
- יועצים
problem: הורה כותב בכעס, ואת התשובה כותבים בלחץ. משפט אחד לא נכון הופך שיחה לתלונה.
benefit: טיוטה רגועה ומדויקת במקום לכתוב בלחץ, בלי הבטחות שאי אפשר לקיים ובלי פרטים על ילדים אחרים.
what_it_does: 'מקבל את ההודעה של ההורה ומה קרה לפי בית הספר, וכותב טיוטת תשובה קצרה: מכירה ברגש, נשארת בעובדות, לא מאשימה ולא מבטיחה, לא כותבת על תלמידים אחרים, ומציעה צעד הבא אחד. במצב של איום או פגיעה, אומרת קודם עם מי להתייעץ.'
output: טיוטה למייל או לוואטסאפ, ו-2-3 שורות למנהל על מה לבדוק לפני השליחה
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מנהלים וסגני מנהלים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: בגרסה 1.0.0, 19 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.3. בסבב הראשון באותו יום: 18 מתוך 25, ו-2 תשובות עם רמז על ילד אחר'
- 'בכל 25 התשובות ג''מיני לא כתב פרטים על תלמיד אחר, גם כשההורה שאל מה העונש שלו'
- 'ג''מיני לא הבטיח פיטורים, שינוי ציון או החזר כסף. כשהורה איים בתקשורת, הוא הציע למנהל לעדכן את המפקח ולא הזכיר את האיום בטיוטה'
limitations:
- 'לפעמים נכנסים לטיוטה פרט, סיבה או זמן שלא כתבתם, כמו "על פי הנהלים" או "מחר בבוקר". כדאי לקרוא כל משפט מול מה שקרה באמת'
- 'לפעמים יש מילה שנשמעת מתגוננת, או שגיאת עברית קטנה בשורות למנהל'
- 'הבקשות נכתבו לבדיקה. לא נבדק עוד עם מנהל אמיתי באפליקציה של ג''מיני'
simple: 'מדביקים לג''מיני את ההודעה של ההורה וכותבים מה קרה באמת. הוא כותב תשובה רגועה וקצרה, ואתם מחליטים מה לשלוח.'
uses:
- when: 'הורה כועס במייל'
  ask: 'תעזור לי לענות להורה. מה שקרה באמת: [כאן כותבים]. ההודעה שלו: [כאן מדביקים]'
  get: 'טיוטת מייל קצרה, ומה לבדוק לפני ששולחים.'
- when: 'הודעה בוואטסאפ'
  ask: 'תכתוב תשובה קצרה לוואטסאפ. [כאן מדביקים את ההודעה של ההורה]'
  get: 'תשובה עד 80 מילים, עם צעד הבא אחד.'
- when: 'בית הספר באמת טעה'
  ask: 'טעינו ואני רוצה להתנצל. מה קרה: [כאן כותבים]. ההודעה של האמא: [כאן מדביקים]'
  get: 'התנצלות קצרה על הדבר המסוים, ומה עושים עכשיו.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בתשובה להורה 3 טעויות נפוצות:'
  list:
  - without: 'מבטיח דברים שלא בידיים שלכם, כמו "זה לא יקרה שוב".'
    with: 'עם הסקיל, מובטח רק מה שאמרתם שתעשו.'
  - without: 'כותב את הטענות של ההורה כאילו הן עובדות.'
    with: 'עם הסקיל, רק מה שאתם כתבתם הוא עובדה.'
  - without: 'תשובה ארוכה שנשמעת כמו התגוננות.'
    with: 'עם הסקיל, תשובה קצרה עם צעד הבא אחד.'
