name: apps-script-fix
title: 'תיקון ושינוי של קוד Apps Script'
version: 1.0.0
updated: 2026-11-17
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים ורכזים שבנו כלי ב-Apps Script'
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'הקוד שג''מיני כתב מחזיר שגיאה באנגלית, או שצריך לשנות בו משהו קטן, והמורה לא יודע לתכנת.'
benefit: 'הסבר פשוט של מה קרה וקובץ מתוקן מלא להדבקה, בלי לחפש שורות בקוד.'
what_it_does: 'קורא את הקוד ואת הודעת השגיאה, מסביר במילים פשוטות מה הבעיה, ומחזיר את הקובץ שהשתנה כולו, עם רשימת שינויים ואיך לבדוק. משנה רק מה שצריך. כשהשגיאה היא הרשאה או פריסה, אומר שלא צריך לשנות קוד.'
output: 'בצ''אט: הסבר, קובץ מתוקן מלא, רשימת שינויים וצעדים'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 6.6, ו-16 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 6.1'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 7.4'
- 'הקוד בכל תשובה הורץ בגיליון מדומה (לא ב-Google): ב-23 מתוך 25 הקוד המתוקן עבר בדיקת תחביר ושמות בלי שגיאה'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'לפעמים Gemini משנה יותר ממה שביקשו. כדאי לקרוא את "מה שיניתי" לפני שמדביקים'
