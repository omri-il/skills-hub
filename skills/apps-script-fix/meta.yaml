name: apps-script-fix
title: תיקון ושינוי של קוד Apps Script
version: 1.1.0
updated: 2026-11-26
subjects:
- כל המקצועות
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים ורכזים שבנו כלי ב-Apps Script
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: הקוד שג'מיני כתב מחזיר שגיאה באנגלית, והמורה לא יודע לתכנת.
benefit: הסבר פשוט וקובץ מתוקן מלא להדבקה, גם בכלי גדול עם הרבה קבצים.
what_it_does: מסביר במילים פשוטות מה הבעיה, ומחזיר את הקובץ המלא עם רשימת שינויים. משנה רק מה שצריך. כשהבעיה בהרשאה, אומר שהקוד בסדר. בכלי גדול עובד עם כרטיס הפרויקט (Card.gs), מבקש רק את הקבצים שצריך, ומראה איך לבדוק לפני שהתלמידים רואים ואיך לחזור לגרסה הקודמת.
output: 'בצ''אט: הסבר, קובץ מתוקן ורשימת שינויים'
role: main
category: וייב קודינג
tested:
- '5 בקשות באפליקציה של Gemini, בחשבון של בית ספר (26.11.2026, מצב Hydrogen, גרסה 1.1.0). עם כרטיס הפרויקט: ג''מיני ביקש רק את 3 הקבצים שהשינוי צריך, ואחרי ההדבקה החזיר אותם מלאים עם Card.gs מעודכן, בדיקה בקישור /dev ו-3 שורות לחזרה אחורה. בלי כרטיס: בנה Card.gs, ועשה רק את השינוי הראשון מתוך 2'
- 'קובץ HTML של 255 שורות (26.11.2026): בהרצה הראשונה ג''מיני לא הציע לפצל, והחזיר את הקובץ מלא. תיקנתי את הסקיל. בהרצה השנייה הוא פיצל ל-Styles, Scripts ו-Index, קובץ אחד בכל הודעה, ושינה נכון את doGet'
- 'כלי עם תפריט בגיליון (26.11.2026): בלי "גרסה חדשה", ושמירה כשאף אחד לא עובד בגיליון. בהרצה הראשונה הופיעה גם שורת החזרה של אפליקציית אינטרנט. תוקן, ובהרצה השנייה הופיעה רק השורה הנכונה'
- 'הסקיל עלה לאפליקציה ב-2 חשבונות (hello@ ובית ספר), והסריקה של Gemini לא חסמה אותו'
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.6, ו-16 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 7.4'
- 'הקוד הורץ בגיליון מדומה: ב-23 מתוך 25 הקוד המתוקן עבר את הבדיקה בלי שגיאה'
- '25 בקשות דרך ה-API של Gemini (19.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: 18 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.0'
- 'כל 25 הסקילים מותקנים יחד, דרך ה-API (19.11.2026): בבקשות שבהן הסקיל הזה יכול להתנגש עם סקיל אחר, ג''מיני בחר את הסקיל הנכון'
limitations:
- נבדק באפליקציה בלי @ רק על בקשות לשינוי, לא על שגיאות
- לא בדקתי את הקוד שג'מיני החזיר בעורך אמיתי של Apps Script, רק את התשובות בצ'אט
- בחשבון של בית ספר ג'מיני כתב לפעמים "את/ה" ו"ימין/שמאל" בהוראות
- לפעמים ג'מיני משנה יותר ממה שביקשו. לקרוא את "מה שיניתי" לפני שמדביקים
simple: 'קוד Apps Script לא עובד, או שרוצים לשנות בו משהו? מדביקים לג''מיני את הקוד ואת הודעת השגיאה. הוא מסביר במילים פשוטות מה הבעיה ונותן קובץ מתוקן. בכלי גדול מדביקים רק את כרטיס הפרויקט, וג''מיני אומר אילו קבצים הוא צריך.'
uses:
- when: 'הודעת שגיאה באנגלית'
  ask: 'הקוד מחזיר שגיאה באנגלית, ואני לא מבין אותה. [כאן מדביקים את הקוד ואת השגיאה]'
  get: 'הסבר פשוט של השגיאה, והקוד המלא המתוקן להדבקה.'
- when: 'לשנות כלי שכבר עובד'
  ask: 'הלומדה שלי עובדת. אני רוצה להוסיף לה עוד 5 שאלות. [כאן מדביקים את הקוד]'
  get: 'הקוד המלא עם השינוי בלבד, ורשימה של מה השתנה.'
- when: 'כלי גדול עם הרבה קבצים'
  ask: 'יש לי כלי גדול ב-Apps Script, ואני רוצה להוסיף לו כפתור הדפסה. [כאן מדביקים את Card.gs. אין עדיין? מדביקים את כל הקבצים, כל אחד עם השם שלו]'
  get: 'שורה עם הקבצים שג''מיני צריך. אחרי שמדביקים אותם: רק הקבצים שהשתנו, Card.gs מעודכן, ואיך לבדוק בקישור הבדיקה לפני שהתלמידים רואים.'
fixes:
  source: 'מתוך 2 בקשות של מורים ל-Gemini Flash, בלי הסקיל ועם הסקיל, 19.11.2026.'
  list:
  - without: 'שולח ל-New deployment. כך נוצר קישור חדש, והתלמידים נשארים עם הקישור הישן.'
    quote: 'New deployment'
    with: 'שולח לעדכן גרסה באותה פריסה. הקישור לא משתנה.'
  also: 'לבקש את הודעת השגיאה המלאה לפני שמתקנים, ולומר כשהקוד תקין והבעיה היא הרשאה.'
