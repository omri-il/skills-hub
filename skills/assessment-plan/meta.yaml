name: assessment-plan
title: 'תוכנית הערכה ליחידה, עם רמת AI לכל משימה'
version: 1.0.1
updated: 2026-11-18
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: 'מורים ורכזים בכל מקצוע, מכיתה ז'' עד י"ב'
who: [מורים, רכזים]
fits: [ריאליים, רב-מלל]
problem: 'כל תלמיד יכול לבקש מ-AI לעשות את העבודה, וציון על עבודה מהבית כבר לא אומר מה התלמיד יודע. קשה לתכנן מראש מה בודקים, מתי, ומה מותר עם AI.'
benefit: 'תוכנית הערכה מוכנה ליחידה, עם בדיקה קטנה כל שבוע, משקלים לציון והודעה לתלמידים, בלי לבנות טבלה לבד.'
what_it_does: 'שואל כמה שאלות קצרות ובונה תוכנית: בדיקה קטנה בכיתה בכל שבוע בלי ציון, 1-2 הערכות עם ציון עם חלק בכיתה או בשיחה, ולכל אחת רמת AI מתוך 5 הרמות של AI Assessment Scale. מסיים בהודעה מוכנה לתלמידים.'
output: 'בצ''אט: טבלה שבועית, טבלת הערכות עם ציון, משקלים והודעה לתלמידים'
role: main
tested:
- 'בדיקה דרך ה-API של Gemini, לא באפליקציה (17.11.2026): 25 בקשות של מורים, שלמות, חסרות, עם פרטים מזהים ומקרי קצה, עם gemini-3.5-flash. Claude בדק כל תשובה מול הסקיל, בציון מ-0 עד 10. ממוצע 6.4, ו-14 מתוך 25 קיבלו 7 ומעלה. בגרסה הראשונה של הסקיל הממוצע היה 5.7'
- 'אותן בקשות עם gemini-3.1-pro-preview (5 בקשות): ממוצע 6.8'
limitations:
- 'לא נבדק באפליקציית Gemini, לא בחשבון של בית ספר, ולא נבדק אם Gemini מפעיל את הסקיל בלי @'
- 'במצב המהיר Gemini לפעמים מכניס רכיב עם ציון לטבלה השבועית, או לא כותב מתי התלמידים מקבלים משוב לפני הערכה עם ציון. כדאי לעבור על 2 הטבלאות לפני שמשתמשים בתוכנית'
