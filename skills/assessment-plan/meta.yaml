name: assessment-plan
title: תוכנית הערכה ליחידה, עם רמת AI לכל משימה
version: 1.0.1
updated: 2026-11-18
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ורכזים, כיתות ז'-י"ב
who:
- מורים
- רכזים
fits:
- ריאליים
- רב-מלל
problem: ציון על עבודה מהבית כבר לא אומר מה התלמיד יודע. קשה לתכנן מה בודקים ומה מותר עם AI.
benefit: תוכנית הערכה ליחידה, עם משקלים והודעה לתלמידים.
what_it_does: 'שואל כמה שאלות ובונה תוכנית: בדיקה קטנה בכיתה כל שבוע, 1-2 הערכות עם ציון, ולכל אחת רמת AI מתוך 5. מסיים בהודעה לתלמידים.'
output: 'בצ''אט: טבלה שבועית, הערכות עם ציון, משקלים והודעה לתלמידים'
role: main
category: הערכה ומשוב
tested:
- '25 בקשות של מורים דרך ה-API של Gemini (17.11.2026, gemini-3.5-flash). Claude נתן ציון מ-0 עד 10: ממוצע 6.4, ו-14 מתוך 25 קיבלו 7 ומעלה. עם 3.1 Pro: 6.8'
limitations:
- לא נבדק באפליקציה, בחשבון של בית ספר, או בלי @
- במצב המהיר לפעמים נכנס ציון לטבלה השבועית. לעבור על הטבלאות לפני שמשתמשים
simple: 'מספרים לג''מיני על יחידת הלימוד. הוא בונה תוכנית: מה בודקים כל שבוע, אילו משימות מקבלות ציון, וכמה מותר להשתמש ב-AI בכל משימה.'
uses:
- when: 'תחילת יחידה חדשה'
  ask: 'אני מתחיל יחידה של 6 שבועות על המהפכה התעשייתית בכיתה ט''. תבנה לי תוכנית הערכה.'
  get: 'טבלה לפי שבועות, ו-1-2 הערכות עם ציון ומשקל לכל אחת.'
- when: 'להחליט מה מותר עם AI'
  ask: 'ביחידה שלי יש עבודה בבית ומבחן. באיזה שלב מותר לתלמידים להשתמש ב-AI?'
  get: 'רמת AI מ-1 עד 5 לכל משימה, ולמה.'
- when: 'רכזת שבונה תוכנית לשכבה'
  ask: 'אני רכזת אנגלית בחטיבה. תבנה תוכנית הערכה ליחידה על כתיבת מכתב, לכל כיתות ח''.'
  get: 'תוכנית אחת לכל השכבה, עם בדיקה קטנה בכיתה כל שבוע והודעה לתלמידים.'
