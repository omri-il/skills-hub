name: hard-decision
title: לפני החלטה קשה
version: 1.0.0
updated: 2026-11-21
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מנהלים וסגני מנהלים לפני החלטה שפוגעת במישהו בכל מקרה
who:
- מנהלים
problem: צריך להחליט עד מחר, כל אפשרות פוגעת במישהו, ואין עם מי לחשוב בקול.
benefit: החלטה שאפשר להסביר, עם מה שעוד צריך לבדוק ומה יכול להשתבש, לפני שמחליטים.
what_it_does: 'מקבל תיאור של דילמה, וכותב 2-3 אפשרויות, מי מושפע מכל אחת, מה עוד חסר לדעת ומי יכול לענות, ובדיקה "נניח שזה נכשל, למה?". בסוף המלצה עם ההנחות שלה. ההחלטה שלכם.'
output: ניתוח קצר של האפשרויות, השאלה הכי חשובה לבדוק, והמלצה עם ההנחות
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של מנהלים וסגני מנהלים דרך ה-API של Gemini (21.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude נתן ציון מ-0 עד 10: בגרסה 1.0.0, 19 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.2. בסבב הקודם באותו יום: 17 מתוך 25'
- 'ג''מיני לא המציא נהלים של משרד החינוך. שאלות על נוהל הלכו ל"מה עוד חסר לדעת", עם מי לבדוק'
- 'כשביקשו הסבר להורים לפני שהמנהל בחר, ג''מיני חיכה להחלטה'
limitations:
- 'לפעמים ניחוש או טענה של אדם אחר נכתבים כעובדה, וההמלצה נשענת עליהם'
- 'לפעמים האפשרות השלישית היא אותה אפשרות עם תוספת קטנה'
- 'הבקשות נכתבו לבדיקה. לא נבדק עוד עם מנהל אמיתי באפליקציה של ג''מיני'
simple: 'כותבים לג''מיני על החלטה קשה. הוא מסדר את האפשרויות, אומר מה עוד צריך לבדוק ומה יכול להשתבש, וממליץ. אתם מחליטים.'
uses:
- when: 'דילמה עם תאריך'
  ask: 'תעזור לי להחליט. [כאן כותבים מה ההחלטה, עד מתי ומה ידוע]'
  get: '2-3 אפשרויות, מה לבדוק קודם, והמלצה עם ההנחות שלה.'
- when: 'כבר נוטים לאפשרות'
  ask: 'אני נוטה ל[אפשרות]. מה יכול להשתבש? [כאן כותבים את הפרטים]'
  get: 'מה יכול להיכשל, ומה לעשות כבר עכשיו כדי למנוע את זה.'
- when: 'להסביר את ההחלטה'
  ask: 'החלטתי [מה]. תכתוב הסבר קצר לצוות. [כאן כותבים למה]'
  get: 'פסקה קצרה: מה הוחלט, למה, ומה עושים עכשיו.'
fixes:
  intro: 'בלי הסקיל, Gemini עושה בהחלטה קשה 3 טעויות נפוצות:'
  list:
  - without: 'מסכים עם מה שאתם כבר חושבים.'
    with: 'עם הסקיל, גם האפשרות שאתם אוהבים נבדקת: מה יכול להיכשל.'
  - without: 'ממציא נוהל או חוזר שההחלטה תלויה בו.'
    with: 'עם הסקיל, כתוב מה לבדוק ועם מי.'
  - without: 'רשימה ארוכה של יתרונות וחסרונות, בלי מסקנה.'
    with: 'עם הסקיל, יש המלצה, ומה ישנה אותה.'
