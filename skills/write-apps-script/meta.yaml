name: write-apps-script
title: כותבים קוד Apps Script בלי לדעת לתכנת
version: 0.1.0
updated: 2026-11-09
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים ורכזים בלי ידע בתכנות שרוצים לבנות אוטומציות ב-Google Workspace בעזרת ג'מיני
problem: 'כשמבקשים מג''מיני קוד Apps Script, הוא לפעמים ממציא פקודות, מחזיר קוד חלקי, שובר את הקוד בגלל גרשיים בעברית, ומייצר קבצים משמאל לימין. מורה בלי ידע בתכנות לא יכול לזהות למה זה לא עובד.

  '
what_it_does: 'ג''מיני כותב קובץ קוד מלא לפי כללים קבועים: הגדרות בראש הקוד, הערות בעברית, עברית מימין לשמאל ב-Docs, Sheets, Slides ובמיילים, מצב בדיקה לפני שליחת מיילים, והסבר צעד אחר צעד איך מדביקים ומריצים. הוא גם משנה קוד קיים בלי לשבור אותו.

  '
output: קוד מלא להדבקה ב-Apps Script, וצעדי הרצה למורה
requires: []
role: main
tested:
- עוד לא נבדק
limitations:
- 'עוד לא נבדק בג''מיני, ולא ידוע אם בקשה רגילה מפעילה אותו או עוברת ל-Canvas'
- 'ב-Google Forms אין פקודה לכיוון כתיבה, ועוד לא בדקנו איך טופס בעברית נראה לתלמיד'
- ג'מיני כותב את הקוד אבל לא מריץ אותו. המורה מריץ אותו בחשבון שלו
- בחשבון בית ספר מנהל המערכת יכול לחסום את Apps Script
