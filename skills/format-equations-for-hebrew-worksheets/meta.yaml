name: format-equations-for-hebrew-worksheets
title: עיצוב משוואות לדפי עבודה בעברית
version: 2.1.0
updated: 2026-11-07
subjects:
- מתמטיקה
- כימיה
- ביולוגיה
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים למתמטיקה ולמדעים
who: [מורים]
problem: 'ג''מיני מציג משוואות יפה בצ''אט, אבל בייצוא ל-Google Docs הן מגיעות כקוד LaTeX גולמי, ותוספים שממירים אותן חסומים ברוב בתי הספר. גם בטקסט רגיל מטענים כמו H₃O⁺ קופצים לצד הלא נכון בדף עברי, וחצים בניסוחים כימיים יוצאים הפוכים.

  '
benefit: 'משוואות שאפשר לערוך ב-Docs, במקום קוד LaTeX גולמי או הקלדה מחדש של כל משוואה.'
what_it_does: 'מגדיר לג''מיני איך לבנות דף עבודה בעברית עם משוואות: קובץ Word עם משוואות אמיתיות שאפשר לערוך, ניסוחים כימיים כטקסט יוניקוד, חצים בכיוון הנכון, מיקום משוואות שלא מתבלגן, ותו כיווניות נסתר שמונע קפיצת מטענים. כולל בדיקה עצמית לפני מסירה.

  '
output: קובץ Word (‎.docx) שנפתח נכון ב-Word וב-Google Docs
requires: []
role: shared
tested:
- ג'מיני ממיר את הדף ב-pandoc בסביבת הקוד שלו, והקובץ יוצא עם משוואות Word אמיתיות (44 משוואות בדף סדרות הנדסיות, בלי בעיות)
- משוואות Word ניתנות לעריכה ב-Word וב-Google Docs אחרי "שמירה כ-Google Docs"
- תו LRM מונע קפיצת מטענים ב-Docs, ושורד המרה מ-Word ל-Docs
- ניסוחים כימיים ביוניקוד עם → ו-⇌ ומצבי צבירה יוצאים נכון בקובץ
limitations:
- לפעמים, במיוחד בכימיה, ג'מיני עונה בצ'אט במקום ליצור קובץ. הוספת המילים "כקובץ Word" לבקשה פותרת את זה
- קובץ Python מצורף לסקיל גורם לג'מיני לסרב ("סקילים עם סקריפטים לא רצים כאן"), ולכן הקוד כתוב בתוך ההוראות
- במצב "מעמיק", ריצה ארוכה עם הרבה שלבי קוד הסתיימה פעם אחת ב"קרתה שגיאה"
