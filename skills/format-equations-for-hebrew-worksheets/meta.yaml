name: format-equations-for-hebrew-worksheets
title: עיצוב משוואות לדפי עבודה בעברית
version: 2.3.0
updated: 2026-11-19
subjects:
- מתמטיקה
- כימיה
- ביולוגיה
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים למתמטיקה ולמדעים
who:
- מורים
problem: משוואות מג'מיני מגיעות ל-Docs כקוד LaTeX, ומטענים וחצים קופצים בדף עברי.
benefit: משוואות שאפשר לערוך ב-Docs, בלי להקליד מחדש.
what_it_does: מלמד את ג'מיני לבנות קובץ Word עם משוואות אמיתיות, ניסוחים כימיים נכונים וחצים בכיוון הנכון. בודק את עצמו לפני שהוא מוסר.
output: קובץ Word שנפתח נכון גם ב-Google Docs
requires: []
role: shared
tested:
- 44 משוואות בדף סדרות הנדסיות יצאו משוואות Word אמיתיות
- אפשר לערוך אותן ב-Word וב-Docs
- מטענים וניסוחים כימיים (→, ⇌) יוצאים נכון
- 'גרסה 2.2.0 (19.11.2026): טבלה יוצאת מימין לשמאל ב-Word. נבדק עם pandoc על המחשב'
limitations:
- לפעמים ג'מיני עונה בצ'אט. המילים "כקובץ Word" בבקשה פותרות את זה
- במצב "מעמיק" ריצה ארוכה נגמרה פעם אחת ב"קרתה שגיאה"
simple: 'משוואות מג''מיני נשברות ב-Docs ונראות כמו קוד. עם הסקיל, ג''מיני בונה קובץ Word עם משוואות אמיתיות. סקילים אחרים משתמשים בו לבד.'
uses:
- when: 'דף עם משוואות'
  ask: 'תכין דף עם 6 משוואות ריבועיות לפתרון, כקובץ Word.'
  get: 'קובץ Word עם משוואות אמיתיות, שנפתח נכון גם ב-Google Docs.'
- when: 'ניסוחים בכימיה'
  ask: 'תכתוב בקובץ Word את 5 הניסוחים האלה, עם מטענים וחצים. [כאן מדביקים את הניסוחים]'
  get: 'ניסוחים שהמטענים בהם במקום והחצים בכיוון הנכון.'
- when: 'משוואות שיצאו כקוד'
  ask: 'הדבקתי ל-Docs משוואות מג''מיני, ויצאו סימנים מוזרים. תכין לי את הדף מחדש כקובץ Word.'
  get: 'אותו תוכן, עם משוואות שנראות כמו בספר.'
