name: explain-choices
title: הסבר שיקולים (שרשרת מחשבה)
version: 1.0.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה
fits:
- רב-מלל
problem: ג'מיני עונה בביטחון, אבל לא מסביר למה בחר בתשובה.
benefit: רואים על מה ג'מיני בנה את התשובה, ומחליטים מהר אם לסמוך עליה.
what_it_does: 'לפני כל תשובה מציג "השיקולים שלי": מה הבין, אילו אפשרויות שקל, למה בחר, וכמה הוא בטוח.'
output: '"השיקולים שלי", ואחריהם התשובה'
requires: []
role: main
category: כלים לכל יום
tested:
- עוד לא נבדק
limitations:
- זה הסבר של ההחלטה, לא מה שקורה בתוך המודל
- לא נבדק יחד עם סקיל אחר
simple: 'לפני כל תשובה, ג''מיני כותב למה הוא בחר בה ועד כמה הוא בטוח. כך מחליטים מהר אם לסמוך על התשובה.'
uses:
- when: 'לבחור בין כמה אפשרויות'
  ask: 'מה מתאים יותר לכיתה ו'' שמתקשה בקריאה: קריאה בזוגות, או שהמורה מקריא בקול?'
  get: 'מה ג''מיני הבין, אילו אפשרויות שקל, למה בחר, וכמה הוא בטוח.'
- when: 'עובדה שלא בטוחים בה'
  ask: 'באיזו שנה נחקק חוק לימוד חובה בישראל?'
  get: 'התשובה, ומה רמת הביטחון של ג''מיני בה. כך יודעים מתי לבדוק.'
- when: 'רעיון לשיעור'
  ask: 'תציע פעילות פתיחה לשיעור על שברים לכיתה ד''.'
  get: 'הפעילות, ולפניה הסבר למה ג''מיני בחר בה ולא באחרת.'
hidden: true
