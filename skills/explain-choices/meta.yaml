name: explain-choices
title: הסבר שיקולים (שרשרת מחשבה)
version: 1.0.0
updated: 2026-11-07
subjects:
- כל המקצועות
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: כל מורה שרוצה להבין למה הבינה המלאכותית הציעה מה שהציעה
problem: 'ג''מיני נותן תשובה בטוחה בעצמה, אבל לא מסביר למה בחר בה ומה עוד היה אפשר. קשה לדעת אם לסמוך עליה, וקשה להתאים אותה לכיתה כשלא יודעים על אילו הנחות היא בנויה.

  '
benefit: 'רואים על מה ג''מיני בנה את התשובה, ומחליטים מהר אם לסמוך עליה.'
what_it_does: 'לפני כל תוצר מציג חלק קצר, "השיקולים שלי": מה הבין מהבקשה ואילו הנחות הניח, אילו אפשרויות שקל, לפי מה בחר, למה דחה את האחרות, מה היה משנה את ההחלטה, וכמה הוא בטוח. עובד גם יחד עם סקילים אחרים.

  '
output: חלק "השיקולים שלי" לפני התשובה, ואחריו התשובה עצמה
requires: []
role: main
tested:
- עוד לא נבדק
limitations:
- זה הסבר מסודר של ההחלטה, לא חשיפה של מה שקורה "בתוך" המודל
- עוד לא נבדק איך הוא עובד יחד עם סקיל אחר באותה שיחה
