name: apps-script-build
title: כלי משלכם לגיליון, בלי לדעת לתכנת
version: 1.0.0
updated: 2026-11-26
subjects:
- כל המקצועות
- ניהול וארגון
platforms:
  tested:
  - Gemini
  compatible:
  - Claude
  - ChatGPT
audience: מורים, רכזים ומנהלים, גם בלי ניסיון בקוד
who:
- מורים
- רכזים
- מנהלים
fits:
- ריאליים
- רב-מלל
problem: ביקשתם מג'מיני כלי לגיליון, וקיבלתם קוד שלא עובד. או שג'מיני הציע לכם טופס, במקום הכלי שרציתם.
benefit: 'כלי שעושה עבודה בגיליון במקומכם, עם בדיקה שמראה "הכול עובד" לפני שמשתמשים בו.'
what_it_does: 'אתם כותבים לג''מיני מה הכלי צריך לעשות, והוא כותב את הקוד, כלומר את ההוראות שהמחשב מבין. הכלי יכול להיות כפתור בתפריט של הגיליון, משהו שקורה לבד כמו מייל כל יום ראשון, או דף קטן שאנשים פותחים בקישור. ג''מיני מסביר איפה להדביק את הקוד, צעד אחר צעד. כש-Google שואל אם מותר לכלי לעבוד, הוא אומר לכם לסמן את כל התיבות. הוא מוסיף בדיקה שמראה "הכול עובד", בלי לשנות שום דבר בגיליון. והוא כותב כרטיס קטן שמתאר את הכלי. כשתרצו לשנות משהו, מדביקים את הכרטיס בשיחה חדשה, וג''מיני יודע מה הוא בנה.'
output: 'בצ''אט: כל הקוד מוכן להעתקה, הוראות הדבקה צעד אחר צעד, וכרטיס קטן שמתאר את הכלי'
role: main
category: וייב קודינג
tested:
- '5 בקשות באפליקציה של Gemini, בחשבון של בית ספר (26.11.2026, מצב Hydrogen, גרסה 1.0.0), כל אחת בשיחה חדשה. בכל 5: קוד מלא, עמודות לפי שם הכותרת, כל עברית בקוד בתוך backticks, runCheck שכותבת "הכול עובד", Card.gs עם "עדכון מס'' 1", Select all בחלון ההרשאות, ו-3 שורות ב"אם משהו לא עובד"'
- 'תפריט שצובע שורות, ומייל שבועי מהגיליון: קוד מיד, בלי שאלות. בתפריט פריט "בדיקה", ובלי "גרסה חדשה". במייל TEST_MODE = true, והבדיקה לא שולחת מייל'
- 'דף בקישור להזמנת חדרים: Index, הודעת שגיאה בכל קריאה לשרת, הכפתור חוזר לפעול, בדיקת "החדר תפוס" בתוך נעילה, קישור /dev ואז "גרסה חדשה". runCheck כתבה שורה ומחקה אותה'
- 'גיליון נוכחות בלי שמות של לשונית וכותרות: הודעה אחת עם 3 שאלות, בלי קוד. אחרי "תחליט אתה" בנה מיד'
- 'טופס הרשמה עם הכיתות ז''1, ח''2: טריגר של הגשת טופס, הלשונית של הטופס לא משתנה, ולשונית הסיכום נבנית מחדש. בקשת המשך באותה שיחה (מייל כשכיתה מגיעה ל-30) עברה ל-apps-script-fix: Card.gs עם "עדכון מס'' 2", ומייל אחד לכל כיתה'
- 'בקשה לבוחן, כשהסקיל apps-script-lomda לא מותקן בחשבון: בנה בוחן לפי הסקיל הזה, ובשורה האחרונה כתב שיש סקיל apps-script-lomda'
- 'הסקיל עלה לאפליקציה בחשבון של בית ספר, והסריקה של Gemini לא חסמה אותו'
limitations:
- לא בדקתי עדיין את הקוד בגיליון אמיתי. בדקתי רק את מה שג'מיני כתב בצ'אט
- לא נבדק בחשבון Gmail פרטי, רק בחשבון של בית ספר
- 'לפעמים ג''מיני מוסיף דברים שלא ביקשו. בדף הזמנת החדרים הוא הוסיף "שם המורה" ו"הערות". כדאי לקרוא את השורה הראשונה בתשובה, "מה נקבע", לפני שמדביקים'
- 'ביקשתי שינוי באותה שיחה, וג''מיני לא הוסיף את שלב הבדיקה למייל החדש. המייל הלך רק לבעל הגיליון. עדיף לבקש שינוי בשיחה חדשה, ולהדביק בה את הכרטיס של הכלי מההתחלה'
simple: 'יש לכם גיליון ב-Google Sheets ורעיון לכלי שיחסוך לכם בו עבודה? כותבים לג''מיני את הרעיון במילים רגילות, והוא כותב את כל הקוד ומסביר איפה להדביק אותו. בסוף בודקים בלחיצה אחת, ורואים "הכול עובד".'
uses:
- when: 'כפתור בגיליון שעושה סדר'
  ask: 'יש לי גיליון של השאלת ציוד: מי לקח, מה לקח, ומתי צריך להחזיר. אני רוצה כפתור בתפריט שצובע באדום כל מי שעבר את התאריך. [כאן מדביקים את שורת הכותרות]'
  get: 'כפתור חדש בתפריט של הגיליון שצובע את השורות, כפתור "בדיקה", והסבר איך להדביק, צעד אחר צעד.'
- when: 'משהו שקורה לבד כל שבוע'
  ask: 'אני רוצה שכל יום ראשון ב-7 בבוקר הגיליון ישלח לי מייל עם רשימת התורנויות של השבוע.'
  get: 'קוד ששולח את המייל לבד כל שבוע. בהתחלה המייל הולך רק אליכם, כדי לבדוק. וגם הסבר איך מפעילים ואיך עוצרים.'
- when: 'דף קטן בקישור לצוות'
  ask: 'אני רוצה דף שהמורים פותחים בקישור, בוחרים חדר ושעה, ושההזמנה תיכנס לגיליון שלי.'
  get: 'דף בעברית שעובד גם בטלפון. כל הזמנה נכנסת כשורה בגיליון שלכם. קודם בודקים לבד בקישור בדיקה, ורק אחר כך שולחים לצוות.'
fixes:
  also: 'לבנות את הכלי שביקשו, ולא להציע טופס במקומו. למצוא כל עמודה לפי השם שלה, כדי שהכלי לא יישבר כשמוסיפים עמודה. לכתוב את העברית בקוד בדרך שלא שוברת אותו. להוסיף בדיקה שלא משנה את הגיליון. להגיד לסמן את כל התיבות כש-Google מבקש אישור.'
