name: apps-script-build
title: כלי חדש ב-Apps Script, מהרעיון שלכם
version: 1.0.0
updated: 2026-11-26
subjects:
- כל המקצועות
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: מורים, רכזים ומנהלים, גם בלי ניסיון בקוד
who:
- מורים
- רכזים
- מנהלים
fits:
- ריאליים
- רב-מלל
problem: ג'מיני כותב קוד Apps Script, אבל הרבה פעמים הוא נשבר כבר בהרצה הראשונה, או שג'מיני מציע טופס במקום הכלי שביקשתם.
benefit: קוד מלא לכלי שאין לו סקיל, עם בדיקה שאומרת "הכול עובד" לפני שמשתמשים בו.
what_it_does: 'כותב את כל הקוד לרעיון שאין לו סקיל משלו: תפריט בגיליון, פעולה אוטומטית (טריגר) או דף בקישור. כל השמות והמספרים בראש הקוד. מוסיף פונקציית בדיקה שכותבת שורה אחת ומוחקת אותה, וכרטיס פרויקט (Card.gs) כדי ששינוי בעתיד יהיה פשוט. מסביר צעד אחר צעד, כולל סימון כל התיבות בחלון ההרשאות.'
output: 'בצ''אט: Code.gs, Card.gs (ואם צריך Index.html), והוראות התקנה'
role: main
category: וייב קודינג
tested: []
limitations:
- 'עוד לא נבדק בחשבון של בית ספר. ריצה ראשונה ב-26.11.2026 נעשתה בטעות בחשבון hello@ במצב Neon, ולכן היא לא נחשבת'
simple: 'יש לכם רעיון לכלי ב-Google Sheets, ואין לו סקיל באתר? כותבים לג''מיני מה הכלי צריך לעשות. הוא כותב את כל הקוד, עם בדיקה שאומרת "הכול עובד", והסבר איך להדביק.'
uses:
- when: 'תפריט שעושה סדר בגיליון'
  ask: 'יש לי גיליון של השאלת ציוד: מי לקח, מה לקח, ומתי צריך להחזיר. אני רוצה כפתור בתפריט שצובע באדום כל מי שעבר את התאריך. [כאן מדביקים את שורת הכותרות]'
  get: 'קוד מלא עם תפריט בעברית, פריט "בדיקה" בתפריט, והוראות התקנה צעד אחר צעד.'
- when: 'משהו שקורה לבד כל שבוע'
  ask: 'אני רוצה שכל יום ראשון ב-7 בבוקר הגיליון ישלח לי מייל עם רשימת התורנויות של השבוע.'
  get: 'קוד עם טריגר שבועי. הבדיקה הראשונה שולחת רק אליכם, ואיך מפעילים ועוצרים.'
- when: 'דף קטן בקישור לצוות'
  ask: 'אני רוצה דף שהמורים פותחים בקישור, בוחרים חדר ושעה, ושההזמנה תיכנס לגיליון שלי.'
  get: 'קוד לדף בעברית שעובד בטלפון, וכל הזמנה נכנסת כשורה בגיליון. איך לבדוק בקישור הבדיקה לפני ששולחים לצוות.'
fixes:
  also: 'לבנות את הכלי שביקשו, ולא להציע טופס במקומו. לקרוא עמודות לפי שם הכותרת, לא לפי מספר. לכתוב כל עברית בקוד בתוך backticks. להוסיף בדיקה שלא נוגעת בנתונים, ולומר לסמן את כל התיבות בחלון ההרשאות.'
hidden: true
