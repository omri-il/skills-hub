name: google-update-for-staff
title: עדכון של Google לצוות שלי
version: 1.0.0
updated: 2026-11-20
subjects:
- ניהול וארגון
platforms:
  compatible:
  - Gemini
  - Claude
  - ChatGPT
audience: רכזי תקשוב, רכזים ומנהלים שמעדכנים את הצוות
who:
- רכזים
- מנהלים
problem: Google משנה משהו כמעט כל שבוע. רכז התקשוב קורא פוסט ארוך באנגלית, וצריך להסביר לצוות בפשטות מה חדש.
benefit: הודעה מוכנה לצוות במקום לתרגם ולפשט פוסט לבד, בלי לנחש מה עובד בחשבון של בית הספר.
what_it_does: 'מקבל פוסט, הודעה או טקסט על עדכון של Google, וכותב הודעה קצרה לצוות: מה השתנה, האם זה עובד בחשבון של משרד החינוך ("לבדוק" כשהמקור לא אומר), 3 שלבים לנסות ורעיון אחד לכיתה. רק מה שכתוב במקור.'
output: הודעת וואטסאפ או מייל מוכנים להעתקה, ו-2 שורות לרכז על מה לבדוק לפני השליחה
requires: []
role: main
category: כלים לכל יום
tested:
- '25 בקשות של רכזים דרך ה-API של Gemini (20.11.2026, gemini-3.5-flash), כשהסקיל מותקן לבד. Claude Sonnet נתן ציון מ-0 עד 10: בגרסה 1.0.0, 17 מתוך 25 קיבלו 7 ומעלה, ממוצע 7.2. 2 טיוטות קודמות באותו יום: 11 מתוך 25'
- 'כשלא הודבק מקור, או רק קישור שאי אפשר לפתוח, ג''מיני ביקש את הטקסט ולא כתב עדכון מהזיכרון'
- 'כשהודבק חוזר של משרד החינוך או חוק, ולא עדכון של Google, ג''מיני פישט אותו בלי התבנית'
limitations:
- 'בפוסט עם הרבה עדכונים ההודעה יוצאת לפעמים ארוכה מדי לוואטסאפ'
- 'לפעמים חסר שלב או כפתור מהמקור בשלבים לנסות, או ששלב כולל פעולה שהמקור לא מתאר. כדאי לבדוק מול המקור'
- 'במקור ישן ג''מיני עדיין כותב לפעמים "חדש"'
- 'הבקשות והמקורות נכתבו לבדיקה. לא נבדק עם קישור אמיתי באפליקציה של ג''מיני'
simple: 'מדביקים לג''מיני פוסט על עדכון של Google, והוא כותב הודעה קצרה לצוות: מה חדש, איך לנסות, ואם זה עובד בחשבון של בית הספר.'
uses:
- when: 'פוסט באנגלית'
  ask: 'תכין לצוות הודעה על העדכון הזה. [כאן מדביקים את הפוסט]'
  get: 'הודעת וואטסאפ קצרה בעברית, עם 3 שלבים לנסות ורעיון לכיתה.'
- when: 'מייל לחדר המורים'
  ask: 'תכתוב מייל לצוות על העדכון הזה. [כאן מדביקים את ההודעה של Google]'
  get: 'מייל עם שורת נושא, מוכן לשליחה.'
- when: 'הרבה עדכונים בפוסט אחד'
  ask: 'מה מזה חשוב למורים? תכין הודעה לצוות. [כאן מדביקים את הפוסט]'
  get: 'הודעה אחת עם עד 3 העדכונים החשובים, והשאר בשורה אחת.'
story: |
  בקבוצת וואטסאפ של מורים שעובדים עם Google, רכזת תקשוב ביקשה "פירוט ברור של הגרסה החדשה כדי שנוכל לעדכן את המורים בצוות".

  Google משנה משהו כמעט כל שבוע, וההודעות ארוכות ובאנגלית. הכישור הופך אותן להודעה אחת קצרה, ולא מוסיף שום דבר שלא כתוב במקור.
